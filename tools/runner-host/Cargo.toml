[package]
name         = "actionlint-runner-host"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.96"
publish      = false

[workspace]

[dependencies]
serde_json    = "1"
sha2          = "0.10"
wasmtime      = { version = "=49.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=49.0.0", default-features = false, features = ["p2"] }
