# Layer table for the actionlint.kjanat.dev/v2 module.
#
# Every package of the module belongs to exactly one layer. Non-test files of a
# layer may import the standard library, packages of their own layer (unless the
# layer is isolated), packages of the layers in `allow`, and the external modules
# in `externals`. `allow` may only name layers declared earlier, so the table
# has no cycles. `deny-std` removes standard packages; every layer the layer may
# import must deny them too, so the denial holds for the whole dependency tree.
#
# Test files may also import any package of their own layer, the layers in
# `tests`, the modules in the layer's `test-externals` and the modules in the
# top-level `test-externals`. Tests are outside the layer order, so `tests` may
# name any layer.
#
# An [[exception]] admits one import edge the layers reject. Each one names the
# importing and imported package and says why the edge stays for now. With
# `tests = true` it applies to the importing package's test files only.
#
# Packages are paths relative to the module root: "." is the root package and a
# trailing "/..." includes the packages below a directory.
#
# After editing, run `go run ./tools/layers` to regenerate the depguard rules in
# .golangci.toml. `go run ./tools/layers -check` fails when an import breaks the
# table or the rules are stale.

test-externals = ["github.com/google/go-cmp", "golang.org/x/tools"]

[std-reasons]
"os/exec" = "this layer does not launch processes; process execution belongs to the analyzer host and the layers above it"

[[layer]]
name     = "source"
doc      = "The public source contract: files, spans and their identities."
packages = ["source"]
deny-std = ["os/exec"]

[[layer]]
name     = "contract-leaves"
doc      = "Public contracts with no module dependencies. config/report is a value contract that imports only the standard library."
packages = ["rule", "resolver", "config/report", "knowledge"]
isolated = true
deny-std = ["os/exec"]

[[layer]]
name     = "analysis-contracts"
doc      = "The public diagnostic and analyzer contracts. They never import internal packages."
packages = ["diagnostic", "analyzer"]
allow    = ["source", "contract-leaves"]
deny-std = ["os/exec"]
tests    = ["documents", "examples", "public-analysis"]

[[layer]]
name     = "repository-contracts"
doc      = "Repository knowledge and immutable remote action manifests. Hosts supply facts; these contracts perform no fetching."
packages = ["repository", "actions"]
allow    = ["contract-leaves", "analysis-contracts"]
deny-std = ["os/exec"]

[[layer]]
name     = "document-contracts"
doc      = "Public document and runner contracts built on diagnostics."
packages = ["document", "runner"]
allow    = ["analysis-contracts"]
isolated = true
deny-std = ["os/exec"]

[[layer]]
name      = "leaves"
doc       = "Internal utilities and data that import no module package: file reading, source text, YAML node models, expression context tables and webhook data."
packages  = [
  "internal/buildinfo",
  "internal/config/address",
  "internal/expression/context",
  "internal/fsread",
  "internal/pluginref",
  "internal/schemapath",
  "internal/source/text",
  "internal/stringutil",
  "internal/webhook",
  "internal/webhook/payload",
  "internal/yaml/schema",
  "internal/yaml/syntax",
]
isolated  = true
externals = ["golang.org/x/sys"]
deny-std  = ["os/exec"]

# Action references are action-domain values. They sit apart from leaves so
# that semantics, which allows leaves, cannot import any internal/action package.
[[layer]]
name     = "action-reference"
doc      = "Parsed action references. The package imports no module package."
packages = ["internal/action/reference"]
isolated = true
deny-std = ["os/exec"]

[[layer]]
name           = "provider-data"
doc            = "Bundled tool provider manifests and the compiler for the configuration schemas they declare. The rule catalog and configuration decoding read them, so they import no module package."
packages       = ["internal/tools/provider/bundled", "internal/tools/provider/configschema"]
isolated       = true
externals      = ["github.com/santhosh-tekuri/jsonschema/v6"]
deny-std       = ["os/exec"]
tests          = ["tool-providers"]
test-externals = ["github.com/itchyny/gojq"]

[[layer]]
name     = "catalog"
doc      = "The rule catalog."
packages = ["internal/rulecatalog"]
allow    = ["contract-leaves", "provider-data"]
deny-std = ["os/exec"]
tests    = ["tool-providers"]

[[layer]]
name      = "config"
doc       = "Configuration decoding and its parts. Configuration does not reach execution, the host or the public API."
packages  = [
  "internal/config",
  "internal/config/rules",
  "internal/config/source",
  "internal/config/tools",
  "internal/config/tree",
  "internal/filefilter",
]
allow     = ["contract-leaves", "repository-contracts", "leaves", "action-reference", "provider-data", "catalog"]
externals = ["github.com/bmatcuk/doublestar/v4", "github.com/kjanat/go-yaml/v4", "github.com/pelletier/go-toml/v2"]
deny-std  = ["os/exec"]
tests     = ["tool-providers", "yaml-codec"]

[[layer]]
name      = "process-config"
doc       = "Native tool invocation settings, resolved without running analysis."
packages  = ["internal/processconfig"]
externals = ["github.com/mattn/go-shellwords", "golang.org/x/sys"]

[[layer]]
name     = "tool-support"
doc      = "Support for development commands: generated-file formatting and the upstream conformance corpora."
packages = ["internal/conformance", "internal/genfile"]
isolated = true

[[layer]]
name     = "core-helpers"
doc      = "Internal helpers over the public contracts and source text: source identities and captures, positions, YAML source maps, related locations, script coordinates and analyzer references."
packages = [
  "internal/analyzerref",
  "internal/related",
  "internal/scriptcoords",
  "internal/source/capture",
  "internal/source/position",
  "internal/sourceid",
  "internal/yaml/sourcemap",
]
allow    = ["source", "analysis-contracts", "leaves"]
deny-std = ["os/exec"]

[[layer]]
name      = "yaml-codec"
doc       = "The YAML codec. It is the only language package that imports the YAML parser."
packages  = ["internal/yaml/codec"]
allow     = ["leaves"]
externals = ["github.com/kjanat/go-yaml/v4"]
deny-std  = ["os/exec"]

[[layer]]
name      = "expression"
doc       = "Expression semantics, usable without workflow syntax trees, analyzers, execution or configuration."
packages  = ["internal/expression"]
allow     = ["leaves"]
externals = ["mvdan.cc/sh/v3"]
deny-std  = ["os/exec"]

[[layer]]
