  "internal/workflow/names",
  "internal/workflow/visit",
]
allow    = ["source", "analysis-contracts", "leaves", "core-helpers", "expression", "workflow-base"]
deny-std = ["os/exec"]
tests    = ["documents"]

[[layer]]
name     = "engine"
doc      = "The traversal engine. It receives semantic checks through built-in composition and imports only the workflow model."
packages = ["internal/engine"]
