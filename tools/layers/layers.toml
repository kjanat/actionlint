  "internal/workflow/references",
  "internal/workflow/schema",
  "internal/workflow/value",
]
allow    = ["analysis-contracts", "leaves", "expression"]
deny-std = ["os/exec"]
tests    = ["documents"]

[[layer]]
name     = "workflow-model"
doc      = "Workflow facts, declarations, names, findings and traversal built on the syntax trees."
packages = [
  "internal/finding",
  "internal/workflow/declaration",
