vars    = { fixture = "oversized-descriptor-values", package = "actionlint-plugin-misbehave", profile = "release", features = "oversized-descriptor-values", target_dir = "target/plugin-fixtures/oversized-descriptor-values" }

["plugin:fixture:oversized-descriptor-bytes"]
