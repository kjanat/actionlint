["plugin:example:pinned-actions"]
extends = "rust-plugin"
alias   = ["internal/plugins/component/testdata/plugins/pinned-actions.wasm"]
vars    = { fixture = "pinned-actions" }

["plugin:example:buildkite-runners"]
extends = "rust-plugin"
alias   = ["internal/plugins/component/testdata/plugins/buildkite-runners.wasm"]
vars    = { fixture = "buildkite-runners" }

["plugin:example:script-engine"]
extends = "rust-plugin"
