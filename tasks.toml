#:schema https://mise.jdx.dev/schema/mise-task.json

["protocol:go"]
description = "Generate Go guest bindings from the plugin protocol"
depends     = ["protocol:sdk"]
sources     = ["plugins/protocol/wit/**", "go.mod", "go.sum"]
outputs     = ["plugins/sdk/go/bindings/**"]
run         = "wasm-tools component wit plugins/protocol/wit --json | go tool wit-bindgen-go generate --world plugin --out plugins/sdk/go/bindings --package-root actionlint.kjanat.dev/v2/plugins/sdk/go/bindings"

["protocol:sdk"]
sources     = ["plugins/protocol/**"]
outputs     = ["plugins/sdk/rust/wit/**", "plugins/sdk/rust/json/**", "plugins/sdk/go/packaging/analyzer.wit"]
run         = [
  "cp -R plugins/protocol/wit/. plugins/sdk/rust/wit/",
  "cp -R plugins/protocol/json/. plugins/sdk/rust/json/",
  "cp plugins/protocol/wit/analyzer.wit plugins/sdk/go/packaging/analyzer.wit"
]
run_windows = '''
Copy-Item -Path plugins/protocol/wit/* -Destination plugins/sdk/rust/wit -Recurse -Force
Copy-Item -Path plugins/protocol/json/* -Destination plugins/sdk/rust/json -Recurse -Force
Copy-Item -LiteralPath plugins/protocol/wit/analyzer.wit -Destination plugins/sdk/go/packaging/analyzer.wit -Force
'''

["all"]
description = "Build, test and lint"
depends     = ["build", "test", "lint"]

["format"]
alias       = ["f", "fmt"]
description = "Format code"
run         = "kprint fmt"

["go-modernize"]
description = "Modernize Go code"
run         = "modernize -fix ./..."

["comment-cop"]
run = "node .github/actions/comment-cop/comment-cop.mjs {{ env.COMMENT_COP_BASE | default(value=\"\") }}"

["generate:readme-demo"]
description = "Update the README comparison using released actionlint binaries"
run         = "node tools/docs/readme-demo.mjs --fix README.md"

["test"]
extends     = "go-test"
description = "Run Go tests"

["conformance"]
run = [
  "go run ./internal/development/tests/conformance/fetch",
  "go test -tags conformance -run '^TestUpstreamConformance' -count=1 -timeout 2m ./internal/development/tests/conformance"
]

["scalar-source-reference"]
description = "Replay scalar source reference cases against pinned Runny"
env         = { ACTIONLINT_REFERENCE_IMAGE = "ghcr.io/kjanat/runny-mc-fuzzface@sha256:05ac3c0842628d383cc1cea6f5f2b6710ceb9356cbc53540c45fb2bb1a9acc03" }
run         = "go test ./internal/development/tests/conformance/yaml -run '^TestScalarSourceReference(Recorded|Live)$' -count=1 -timeout 10m"

["coverage"]
extends = "go-test"
alias   = ["coverage.out"]
vars    = { test_flags = "-coverprofile coverage.out -covermode=atomic" }
sources = ["cmd/**", "internal/**", "plugins/**", "tools/**", "go.{mod,sum}", "actionlint.schema.json", "schemas/**"]
outputs = ["coverage.out"]

["coverage:html"]
alias   = ["coverage.html"]
depends = ["coverage"]
sources = ["coverage.out"]
outputs = ["coverage.html"]
run     = "go tool cover -html=coverage.out -o coverage.html"

["cov"]
depends = ["coverage:html"]
run     = "go tool cover -func=coverage.out"

["lint:golangci"]
run = "golangci-lint run"

["lint:playground"]
run = "golangci-lint run ./cmd/actionlint-lsp-wasm"
env = { GOOS = "js", GOARCH = "wasm" }

["lint:vulnerabilities"]
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."

["lint"]
description = "Run Go, vulnerability and browser checks"

run = ["mise run lint:golangci", "mise run lint:vulnerabilities", "mise run lint:playground"]

["lint-docs"]
run = "go run ./internal/development/tests/integration/documentation -quiet ./docs/checks.md"

["generate:payload"]
sources = ["tools/generate/webhook-payloads/**"]
outputs = ["internal/model/contexts/events/payload/catalogue.json"]
run     = "node ./tools/generate/webhook-payloads/main.mts"

["generate:config-schema"]
sources = [
  "internal/development/generators/{config-schema,files}/**",
  "internal/input/configuration/**/*.go",
  "internal/checking/{rule_*,config_rules}.go",
  "internal/checking/rules/**/*.go",
  "internal/plugins/manifests/bundled/**",
  "internal/plugins/execution/preparation/**/*.go",
  "schemas/**"
]
outputs = ["actionlint.schema.json", "internal/input/configuration/schema/assets/**/*.json"]
run     = "go run ./internal/development/generators/config-schema"

["generate:rules"]
sources = ["internal/development/generators/{rule-docs,files}/**", "internal/checking/rule_*.go", "internal/checking/rules/**/*.go"]
outputs = ["docs/rules.md"]
run     = "go run ./internal/development/generators/rule-docs"

["generate:contexts"]
sources = ["internal/development/generators/expression-contexts/**"]
outputs = ["internal/model/contexts/availability.gen.go"]
run     = "go run ./internal/development/generators/expression-contexts ./internal/model/contexts/availability.gen.go"

["generate:events"]
depends = ["generate:payload"]
sources = ["internal/development/generators/event-triggers/**", "internal/model/contexts/events/payload/**"]
outputs = ["internal/model/contexts/events/triggers/webhooks.gen.go"]
run     = "go run ./internal/development/generators/event-triggers --registry ./internal/model/contexts/events/triggers/webhooks.gen.go"

["generate:actions"]
sources = ["internal/development/generators/action-metadata/**"]
outputs = ["internal/model/actions/*.gen.go"]
run     = [
  "go run ./internal/development/generators/action-metadata -runtimes -output internal/model/actions/runtimes.gen.go",
  "go run ./internal/development/generators/action-metadata -output internal/model/actions/availability.gen.go"
]

["generate:workflow-views"]
sources = ["internal/development/generators/workflow-views/**", "internal/model/workflows/definition/*.go"]
outputs = ["internal/model/workflows/*.gen.go"]
run     = "go run ./internal/development/generators/workflow-views . internal/model/workflows"

["generate:go"]
depends = [
  "generate:config-schema",
  "generate:rules",
  "generate:contexts",
  "generate:events",
  "generate:actions",
  "generate:workflow-views"
]

["contract"]
extends = "plugin-contract"
outputs = ["internal/plugins/execution/component/*.gen.go"]
run     = "go run -C internal/development/generators/plugin-contract ."

["bindings"]
extends = "plugin-contract"
outputs = ["internal/plugins/execution/component/*.gen.go", "internal/plugins/protocol/component/**/*.gen.go"]
run     = "go generate ./internal/plugins/execution/component"

["generate"]
depends = ["protocol:sdk", "protocol:go", "generate:go", "bindings"]

["build"]
description = "Build actionlint with its Git version"
run         = '''
if [ -z "${SKIP_GO_GENERATE:-}" ]; then mise run generate; fi
version="$(git describe --tags 2>/dev/null || true)"
if [ -n "$version" ]; then
  CGO_ENABLED=0 go build -ldflags "-X actionlint.kjanat.dev/v2/internal/integrations/buildinfo.ReleaseVersion=$version" -o actionlint ./cmd/actionlint
else
  CGO_ENABLED=0 go build -o actionlint ./cmd/actionlint
fi

'''
run_windows = '''
if (-not $env:SKIP_GO_GENERATE) {
  mise run generate
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
}
$buildArgs = @('build', '-o', 'actionlint.exe')
$version = git describe --tags 2>$null
if ($LASTEXITCODE -eq 0) {
  $buildArgs += @('-ldflags', "-X actionlint.kjanat.dev/v2/internal/integrations/buildinfo.ReleaseVersion=$version")
}
go @buildArgs ./cmd/actionlint
exit $LASTEXITCODE

'''

["fuzz"]
run = "{% if env.FUZZ_FUNC | default(value=\"\") %}go test -run '^$' -fuzz '^{{ env.FUZZ_FUNC }}$' ./internal/development/tests/integration/fuzz{% else %}go test -list '^Fuzz' ./internal/development/tests/integration/fuzz{% endif %}"

["man:roff"]
extends = "manual"
alias   = ["man/actionlint.1"]
vars    = { flags = "--to=man --metadata=title:ACTIONLINT --lua-filter=man/inline-code-bold.lua" }

["man:html"]
extends = "manual"
alias   = ["man/actionlint.1.html"]
vars    = { suffix = ".html", flags = "--to=html --css=manual.css" }

["man"]
depends = ["man:roff", "man:html"]

["bench"]
run = "go test -run '^$' -bench Lint -benchmem ./internal/checking"

["matcher"]
alias   = [".github/actionlint-matcher.json"]
sources = ["tools/matcher/main.mjs", "tools/matcher/object.mjs"]
outputs = [".github/actionlint-matcher.json"]
run     = "node ./tools/matcher/main.mjs .github/actionlint-matcher.json"

["matcher:escape"]
extends = "matcher"
alias   = ["tools/matcher/testdata/escape.txt"]
vars    = { flags = "--output-format text -color", output = "escape.txt" }

["matcher:no-escape"]
extends = "matcher"
alias   = ["tools/matcher/testdata/no_escape.txt"]
vars    = { flags = "--output-format text -no-color", output = "no_escape.txt" }

["matcher:json"]
extends = "matcher"
alias   = ["tools/matcher/testdata/want.json"]
vars    = { flags = "-format '{% raw %}{{json .}}{% endraw %}'", output = "want.json" }

["matcher:fixtures"]
depends = ["matcher:escape", "matcher:no-escape", "matcher:json"]

["plugins-check-native"]
depends = ["protocol:sdk"]
run     = [
  "cargo check --workspace --locked --all-targets",
  "cargo test --locked -p 'actionlint-example-*' --all-features",
  "cargo test --locked -p actionlint-extension-api",
  "cargo test --locked -p actionlint-extension-api --all-features"
]

["plugins:wat"]
sources = ["internal/plugins/execution/{component,module}/testdata/wat/*.wat"]
outputs = ["internal/plugins/execution/{component,module}/testdata/wat/*.wasm"]
run     = '''
{% for source in task_source_files() %}
wasm-tools parse "{{ source }}" -o "{{ source | replace(from='.wat', to='.wasm') }}"
{% endfor %}
'''

["plugin-examples"]
depends = ["plugin:example:*"]

["plugins"]
depends = ["plugin:**", "plugins:wat"]

["changelog"]
alias       = ["CHANGELOG.md"]
run         = "changelog-from-release > CHANGELOG.md"
run_windows = "changelog-from-release | Set-Content -Encoding utf8 CHANGELOG.md"

["clean"]
run         = "rm -f ./actionlint ./actionlint.exe ./man/actionlint.1 ./man/actionlint.1.html ./actionlint-workflow-ast"
run_windows = '''
foreach ($output in @('actionlint', 'actionlint.exe', 'man/actionlint.1', 'man/actionlint.1.html', 'actionlint-workflow-ast')) {
  if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output }
}

'''

["lint:biome"]
run = "biome check . --error-on-warnings"

["lint:workspaces"]
run = "bun run --filter '*' --if-present lint"

["test:js"]
run = "run -p //.github/ci:test //.github/actions/comment-cop:test //.github/actions/setup-pandoc:test //.github/actions/setup-runner:test //.github/actions/setup-shellcheck:test //.github/actions/setup-wasm-toolchain:test //tools/matcher:test //tools/release:test //tools/toolchain:test //tools/generate/webhook-payloads:test //distribution/docker:test typecheck @kjanat/actionlint-winget:typecheck @kjanat/actionlint-winget:test @kjanat/actionlint:test @kjanat/actionlint-npm:test @kjanat/actionlint-pypi:test @kjlint/changelog-rss:typecheck @kjlint/changelog-rss:test"

["test:workspaces"]
run = "bun run --filter '*' --if-present test"

["typecheck"]
run = ["bun run --filter '@kjanat-actionlint/plugin-sdk' build", { task = "typecheck:root" }, { task = "typecheck:workspaces" }]

["typecheck:root"]
run = ["bun x --no-install --package @typescript/native tsc --noEmit", { task = "//.github/ci:typecheck" }]

["typecheck:workspaces"]
run = "bun run --workspaces --sequential --shell=bun --if-present typecheck"

["fixture:copy"]
hide        = true
usage       = '''
arg "<source>"
arg "<destination>"
'''
run         = "install -m 644 \"{{ usage.source }}\" \"{{ usage.destination }}\""
run_windows = "Copy-Item -LiteralPath '{{ usage.source }}' -Destination '{{ usage.destination }}'"

