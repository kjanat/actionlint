["plugin:example:ruff-action-input"]
extends = "rust-plugin"
alias   = ["internal/plugins/component/testdata/plugins/ruff-action-input.wasm"]
vars    = { fixture = "ruff-action-input", example = "script-engine", features = "action-input-fixture,ruff-fixture", target_dir = "target/plugin-fixtures/ruff-action-input", artifact = "examples/script_engine", metadata = "examples/plugins/ruff-action-input.metadata.json" }

["plugin:fixture:misbehave"]
extends = "rust-plugin"
alias   = ["internal/plugins/component/testdata/plugins/misbehave.wasm"]
vars    = { fixture = "misbehave", package = "actionlint-plugin-misbehave" }

["plugin:fixture:script-engine-0.3.0"]
