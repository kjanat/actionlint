#:schema kprint.schema.json
# format through npx @kjanat/fmt -- [files...]

incremental = true
newLineKind = "lf"
plugins     = [
  "https://plugins.dprint.dev/kjanat/json-schema-sort-0.1.2.wasm",
  "npm:@dprint/dockerfile@0.8.0",
  "npm:@dprint/typescript@0.101.0",
  "npm:@dprint/markdown@0.29.0",
  "npm:@dprint/json@0.26.0",
  "https://plugins.dprint.dev/sargunv/dprint-cmakefmt-0.1.0.wasm",
  "npm:dprint-plugin-yaml@0.6.0",
  "npm:dprint-plugin-malva@0.16.1",
  "npm:dprint-plugin-markup@0.28.0",
  "https://plugins.dprint.dev/kjanat/pwsh-0.2.0.wasm",
  "https://plugins.dprint.dev/kjanat/shfmt-1.1.1.wasm",
  "https://plugins.dprint.dev/kjanat/svg-v0.4.1.wasm",
  "https://plugins.dprint.dev/kjanat/tombi-0.2.1.wasm",
  "npm:@jakebailey/dprint-plugin-gofumpt@0.0.20",
]
excludes    = [
  "**/testdata/**",
  "internal/development/generators/event-triggers/sources/**",
  "man/actionlint.1.md",
  ".claude/**",
  ".worktrees/**",
  "**/targets.json",
  "**/schemas/ruff/**",
  "docs/releases/**/*.md"
]

[gofumpt]
langVersion = "go1.27"
modulePath  = "actionlint.kjanat.dev/v2"

[gofumpt.extra]
groupParams   = true
balanceCalls  = true
clotheReturns = true

[exec]
cwd = "${configDir}"

[[exec.commands]]
command = "rustfmt --edition 2024"
exts    = ["rs"]

[jsonSchemaSort]
associations = ["**/*schema.json", "**/*.schema.json"]

[shfmt]
useTabs          = true
binaryNextLine   = true
switchCaseIndent = true

[pwsh]
braceStyle          = "sameLine"
useTabs             = true
keywordCasing       = true
spaceAroundOperator = true
spaceAroundPipe     = true
spaceAfterSeparator = true

[dockerfile]
associations = ["Dockerfile", "Dockerfile.*"]

[markdown]
textWrap                        = "maintain"
emphasisKind                    = "asterisks"
"codeBlock.useTabs"             = false
"codeBlock.preserveIndentation" = true
"html.useTabs"                  = false

[[markdown.overrides]]
files    = ["**/AGENTS.md", "**/CLAUDE.md", "**/CHANGELOG.md", "**/CONTRIBUTING.md", "**/.rules"]
textWrap = "never"

[yaml]
printWidth = 160

[toml]
configFile = "tombi.toml"

[json]
jsonTrailingCommaFiles         = ["**/.vscode/*.json", "**/.zed/{settings,tasks,debug}.json", "**/tsconfig*.json"]
"packageJson.applyConventions" = true

[typescript]
quoteStyle                              = "preferSingle"
useTabs                                 = true
"module.sortImportDeclarations"         = "maintain"
"importDeclaration.sortNamedImports"    = "maintain"
"importDeclaration.sortTypeOnlyImports" = "inline"
"module.sortExportDeclarations"         = "maintain"
"exportDeclaration.sortNamedExports"    = "maintain"
"exportDeclaration.sortTypeOnlyExports" = "inline"

[markup]
printWidth                 = 999
useTabs                    = true
"html.void.selfClosing"    = false
formatComments             = true
scriptIndent               = true
styleIndent                = true
doctypeKeywordCase         = "upper"
strictSvelteAttr           = false
svelteAttrShorthand        = true
svelteDirectiveShorthand   = true
ignoreCommentDirective     = "dprint-ignore"
ignoreFileCommentDirective = "dprint-ignore-file"
associations               = ["!**/*.svg"]
