name: Release
on:
  push: { tags: ["v*.*.*"] }

concurrency:
  group: actionlint-release
  cancel-in-progress: false
  queue: max

env: { GO: "1.27" }

permissions: { contents: read }

jobs:
  changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ env.GO }}", check-latest: true }
      - name: Resolve release notes
        env: { TAG: "${{ github.ref_name }}" }
        run: go run ./scripts/bump-version -notes "$TAG" > "${RUNNER_TEMP}/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: release-notes, path: "${{ runner.temp }}/release-notes.md", if-no-files-found: error }
  manual:
    name: Build command manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with: { ruby-version: "3.4" }
      - env: { BUNDLE_GEMFILE: man/Gemfile }
        run: |
          bundle install
          bundle exec ronn ./man/actionlint.1.ronn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: manual, path: man/actionlint.1, if-no-files-found: error }
  binaries:
    runs-on: ubuntu-latest
    needs: [changelog, manual]
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: manual, path: man }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ env.GO }}", check-latest: true }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with: { name: release-notes, path: "${{ runner.temp }}" }
      - name: Get version
        run: echo VERSION="${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: "~> v2", args: "release --clean --release-notes=${{ runner.temp }}/release-notes.md" }
        env: {
          GITHUB_TOKEN: "${{ github.token }}",
          HOMEBREW_TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}",
        }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with: { subject-checksums: "./dist/actionlint_${{ env.VERSION }}_checksums.txt" }
      - name: Post-release download check
        run: bash ./scripts/download-actionlint.bash
  winget:
    runs-on: ubuntu-latest
    needs: binaries
    if: github.repository == 'rhysd/actionlint'
    steps:
      - uses: vedantmgoyal9/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193 # main
        with:
          identifier: rhysd.actionlint
          installers-regex: '_windows_\w+\.zip$'
          release-notes-url: "${{ github.server_url }}/${{ github.repository }}/blob/HEAD/CHANGELOG.md#${{ github.ref_name }}"
          token: ${{ secrets.WINGET_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    needs: changelog
    outputs: { is-latest: "${{ steps.tag.outputs.is-latest }}", is-major-latest: "${{ steps.tag.outputs.is-major-latest }}" }
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Get tag name
        id: tag
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

          latest_stable_tag() {
            local pattern="$1"
            local candidate
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "$candidate"
                return
              fi
            done < <(git tag --list "$pattern" --sort=-version:refname)
          }

          latest="$(latest_stable_tag 'v*.*.*')"
          major_latest="$(latest_stable_tag "v${major}.*.*")"
          if [[ "$GITHUB_REF_NAME" == "$latest" ]]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_NAME" == "$major_latest" ]]; then
            echo "is-major-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-major-latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { username: "${{ github.repository_owner }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: Tags for the CLI image
        id: meta-cli
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.is-latest }}
      - name: Build and push CLI image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          target: cli
          build-args: |
            GOLANG_VER=${{ env.GO }}
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          annotations: |
            index:org.opencontainers.image.description=Static checker for GitHub Actions workflow files
          tags: ${{ steps.meta-cli.outputs.tags }}
      - name: Tags for the GitHub Action image
        id: meta-action
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=action-${{ steps.tag.outputs.name }}
            type=raw,value=action-v${{ steps.tag.outputs.major }},enable=${{ steps.tag.outputs.is-major-latest }}
            type=raw,value=action-latest,enable=${{ steps.tag.outputs.is-latest }}
      - name: Build and push GitHub Action image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          target: action
          build-args: |
            GOLANG_VER=${{ env.GO }}
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          annotations: |
            index:org.opencontainers.image.description=GitHub Action for actionlint
          tags: ${{ steps.meta-action.outputs.tags }}
  major-tag:
    name: Update major action tag
    needs: [binaries, docker]
    if: needs.docker.outputs.is-major-latest == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Verify release commit signature
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          commit_api="repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          verified="$(gh api "$commit_api" --jq '.commit.verification.verified')"
          test "$verified" = true
      - name: Move major tag to the release commit
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major="v${version%%.*}"
          git push --force origin "${GITHUB_SHA}:refs/tags/${major}"
