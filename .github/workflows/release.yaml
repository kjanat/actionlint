name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install ronn
      - run: ronn ./man/actionlint.1.ronn
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - name: Get version
        run: echo VERSION="${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ format('./dist/actionlint_{0}_checksums.txt', env.VERSION) }}
      - name: Post-release download check
        run: bash ./scripts/download-actionlint.bash
      - name: Clone nested repository to make version bump commit
        uses: actions/checkout@v7
        with:
          path: ./tmp-actionlint-for-update-ver
          ref: main
          fetch-depth: 0
      - name: Update version in download script
        run: |
          set -x
          cd ./tmp-actionlint-for-update-ver
          sed -i -E "s/version=\"[0-9]+\\.[0-9]+\\.[0-9]+\"/version=\"${VERSION}\"/" ./scripts/download-actionlint.bash
          git diff
          git diff --quiet --exit-code -- ./scripts/download-actionlint.bash && exit 0
          git add ./scripts/download-actionlint.bash
          git -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c user.name='github-actions[bot]' commit -m "update version to $VERSION in download-actionlint.bash"
          git log -n 1
          git push
  winget:
    runs-on: ubuntu-latest
    needs: binaries
    if: github.repository == 'rhysd/actionlint'
    steps:
      - uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: rhysd.actionlint
          installers-regex: '_windows_\w+\.zip$'
          release-notes-url: '${{ github.server_url }}/${{ github.repository }}/blob/HEAD/CHANGELOG.md#${{ github.ref_name }}'
          token: ${{ secrets.WINGET_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    outputs:
      is-latest: ${{ steps.tag.outputs.is-latest }}
      is-major-latest: ${{ steps.tag.outputs.is-major-latest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Get tag name
        id: tag
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

          latest_stable_tag() {
            local pattern="$1"
            local candidate
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "$candidate"
                return
              fi
            done < <(git tag --list "$pattern" --sort=-version:refname)
          }

          latest="$(latest_stable_tag 'v*.*.*')"
          major_latest="$(latest_stable_tag "v${major}.*.*")"
          if [[ "$GITHUB_REF_NAME" == "$latest" ]]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_NAME" == "$major_latest" ]]; then
            echo "is-major-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-major-latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push CLI image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          target: cli
          build-args: |
            GOLANG_VER=1.26
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          annotations: |
            index:org.opencontainers.image.description=Static checker for GitHub Actions workflow files
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.name }}
            ${{ steps.tag.outputs.is-latest == 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
      - name: Build and push GitHub Action image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          target: action
          build-args: |
            GOLANG_VER=1.26
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          annotations: |
            index:org.opencontainers.image.description=GitHub Action for actionlint
          tags: |
            ghcr.io/${{ github.repository }}:action-${{ steps.tag.outputs.name }}
            ${{ steps.tag.outputs.is-major-latest == 'true' && format('ghcr.io/{0}:action-v{1}', github.repository, steps.tag.outputs.major) || '' }}
            ${{ steps.tag.outputs.is-latest == 'true' && format('ghcr.io/{0}:action-latest', github.repository) || '' }}
  major-tag:
    name: Update major action tag
    needs: [binaries, docker]
    if: needs.docker.outputs.is-major-latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release commit signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_api="repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          verified="$(gh api "$commit_api" --jq '.commit.verification.verified')"
          test "$verified" = true
      - name: Move major tag to the release commit
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major="v${version%%.*}"
          git push --force origin "${GITHUB_SHA}:refs/tags/${major}"
