name: Container previews

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN: { required: true }

permissions: { contents: read }

jobs:
  publish:
    name: Build and publish CLI image
    if: >-
      github.repository == 'kjanat/actionlint' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Download the CI release snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: actionlint-cli-preview, path: dist }
      - name: Extract checksum-verified Docker binaries
        shell: bash -euo pipefail {0}
        run: |
          version="$(jq -er .version dist/metadata.json)"
          for arch in amd64 arm64; do
            archive="actionlint_${version}_linux_${arch}.tar.gz"
            awk -v archive="${archive}" '
              $2 == archive { print; count++ }
              END {
                if (count != 1) {
                  print "Expected exactly one checksum for " archive > "/dev/stderr"
                  exit 1
                }
              }
            ' "dist/actionlint_${version}_checksums.txt" | (cd dist && sha256sum -c -)
            mkdir -p ".preview/docker/${arch}"
            tar -xzf "dist/${archive}" -C ".preview/docker/${arch}" actionlint
          done
      - name: Derive preview tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=ref,event=branch,prefix=branch-
            type=raw,value=branch-${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=actionlint
            org.opencontainers.image.description=Development preview
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: &login docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: { registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ github.token }}" }
      - uses: *login
        with: { username: "${{ github.repository_owner }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: Build and publish preview
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: distribution/docker/Dockerfile
          target: cli-prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=docker-previews
          cache-to: type=gha,scope=docker-previews,mode=max
