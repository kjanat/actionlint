name: package previews

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: 0

jobs:
  publish:
    name: Build and publish package previews
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - parallel:
          - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
            with: { go-version-file: go.mod, cache: false }
          - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
            with: { bun-version-file: .tool-versions }
          - uses: kjanat/runner@30f5787ff1f4947a419c6b67663fd26259007dc8 # master
            with: { version-file: .tool-versions }
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build the plugin SDK and changelog feed
        run: run -pk
          @kjanat-actionlint/plugin-sdk:build
          @kjlint/changelog-rss:build
      - name: Build actionlint plugin host
        env: &a { ACTIONLINT: "${{ runner.temp }}/actionlint" }
        run: go build -o "${ACTIONLINT}" ./cmd/actionlint
      - name: Build CLI preview archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version-file: .tool-versions
          args: release --snapshot --clean --skip=sbom,homebrew,scoop,aur,aur-source
      - name: Assemble CLI preview packages
        shell: bash -euo pipefail {0}
        run: bun distribution/npm/src/cli.ts build
          --version "$(jq -er .version dist/metadata.json)"
          --downloads dist
      - name: Verify the packed plugin SDK
        env: *a
        run: run -pk @kjanat-actionlint/plugin-sdk:test:package
      - name: Pack example plugins
        env: *a
        run: run -pk
          @kjanat-actionlint/plugin-grant:pack
          @kjanat-actionlint/plugin-grype:pack
          @kjanat-actionlint/plugin-poutine:pack
          @kjanat-actionlint/plugin-psscriptanalyzer:pack
          @kjanat-actionlint/plugin-runner-guard:pack
          @kjanat-actionlint/plugin-syft:pack
          @kjanat-actionlint/plugin-trailing-space:pack
          @kjanat-actionlint/plugin-yamllint:pack
          @kjanat-actionlint/plugin-zizmor:pack
      - name: Install scanners for example installation checks
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: yamllint zizmor
          add_shims_to_path: false
        env: { MISE_ENABLE_TOOLS: "yamllint,zizmor" }
      - name: Check installed yamllint example
        uses: kjanat/actionlint-registry/check@97cb7fdaf812e04b9e80929709e54448c4d78d99 # master
        with:
          artifact: plugins/examples/external-linters/yamllint/actionlint-provider.json
          fixture: plugins/examples/external-linters/yamllint/installation.ts
          actionlint: ${{ runner.temp }}/actionlint
          kind: manifest
          allow-config-processes: true
          report: ${{ runner.temp }}/yamllint-candidate.json
      - name: Check installed zizmor example
        uses: kjanat/actionlint-registry/check@97cb7fdaf812e04b9e80929709e54448c4d78d99 # master
        with:
          artifact: plugins/examples/external-linters/zizmor/actionlint-provider.json
          fixture: plugins/examples/external-linters/zizmor/installation.ts
          actionlint: ${{ runner.temp }}/actionlint
          kind: manifest
          allow-config-processes: true
          report: ${{ runner.temp }}/zizmor-candidate.json
      - name: Publish CLI, SDK and example package previews
        run: bun run --bun pkg-pr-new publish --bun --packageManager=bun --previewVersion
          './distribution/npm/dist/*'
          ./libraries/github-changelog
          ./plugins/sdk/typescript
          ./plugins/examples/typescript
          ./plugins/examples/psscriptanalyzer
          ./plugins/examples/external-linters/grant
          ./plugins/examples/external-linters/grype
          ./plugins/examples/external-linters/poutine
          ./plugins/examples/external-linters/runner-guard
          ./plugins/examples/external-linters/syft
          ./plugins/examples/external-linters/yamllint
          ./plugins/examples/external-linters/zizmor
