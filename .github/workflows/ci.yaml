name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env: { GO: "1.27" }
permissions: { contents: read }
jobs:
  unit-tests:
    name: Unit tests
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, go: "1.26" }
          - { os: ubuntu-latest, go: "1.27" }
          - { os: ubuntu-24.04-arm, go: "1.27" }
          - { os: macos-latest, go: "1.27" }
          - { os: macos-26-intel, go: "1.27" }
          - { os: windows-latest, go: "1.27" }
          - { os: windows-11-arm, go: "1.27" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ matrix.go }}", check-latest: true }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ runner.os != 'Linux' }}

      - name: Install dependencies on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          set -x
          brew untap aws/tap
          brew install --quiet shellcheck
          uv tool install pyflakes
          shellcheck --version
          pyflakes --version
      - name: Install dependencies on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          choco install shellcheck -y --no-progress
          uv tool install pyflakes
          pyflakes --version

      - run: go test -v ./...

      # Check build without CGO
      - run: go build ./cmd/actionlint
        env: { CGO_ENABLED: 0 }
  race:
    name: Race detector and coverage
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ env.GO }}", check-latest: true }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: |
          set -x
          sudo apt-get install -y shellcheck
          uv tool install pyflakes
          shellcheck --version
          pyflakes --version

      - run: go test -v -race -coverprofile coverage.txt -covermode=atomic ./...
      - run: go tool cover -func ./coverage.txt

      # Set -race for catching data races on dog fooding (#333)
      - run: go build -race ./cmd/actionlint

      - name: Dog fooding 🐶
        # actionlint passes --norc to shellcheck, ignoring .shellcheckrc.
        run: echo "::add-matcher::.github/actionlint-matcher.json"; ./actionlint -color -shellcheck 'shellcheck -o all'

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with: { use_oidc: true }
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ env.GO }}", check-latest: true }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: {
          node-version: "lts/*",
          cache: npm,
          cache-dependency-path: ./package-lock.json,
        }
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build playground
        run: make -C playground build
      - name: Lint playground
        run: npm run lint
      - name: Run tests for wasm
        run: npm test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "1.26", check-latest: true }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        # check-checks reproduces docs examples with shellcheck and pyflakes
        run: |
          sudo apt-get install -y shellcheck
          uv tool install pyflakes
          shellcheck --version
          pyflakes --version
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with: { version: v2.13.1, install-only: true }
      - run: make lint SKIP_GO_GENERATE=true
      - name: Lint bash scripts
        run: shellcheck ./scripts/*.bash
  docker:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: {
          build-args: "GOLANG_VER=${{ env.GO }}",
          load: true,
          push: false,
          tags: actionlint:test,
        }
      - name: Test Docker image
        run: docker container run
          --mount type=bind,source="${PWD}",target=/w
          -- actionlint:test -color -verbose
      - name: Lint Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3018 --strict-labels
          --require-label org.opencontainers.image.source:url
          --require-label org.opencontainers.image.licenses:spdx
          - < Dockerfile
      - name: Lint Dockerfile with droast
        uses: immanuwell/dockerfile-roast@50689402f3eced348cf4bd822ffb57871b5c02d0 # 1.6.1
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Build action image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: {
          context: .,
          target: action,
          build-args: "GOLANG_VER=${{ env.GO }}",
          load: true,
          tags: actionlint-action:test,
        }
      - name: Test action image
        run: ./scripts/test-action.bash actionlint-action:test
