name: Select CI checks
on:
  workflow_call:
    inputs:
      filters: { description: Ordered include and exclude paths for each check, required: true, type: string }
    outputs:
      jobs: { description: Check names mapped to run or skip, value: "${{ jobs.changes.outputs.jobs }}" }
permissions: { contents: read }
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs: { jobs: "${{ steps.plan.outputs.jobs }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", package-manager-cache: false }
      - name: Select checks from changed paths and PR head commit trailers
        id: plan
        env: { CI_FILTERS: "${{ inputs.filters }}" }
        run: node .github/ci/plan.mjs
