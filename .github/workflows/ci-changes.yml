name: Select CI checks
env: { MISE_CACHE_DIR: "${{ github.workspace }}/../actionlint-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }
on:
  workflow_call:
    inputs:
      profile: { description: Workflow whose checks are being selected, required: true, type: string }
    outputs:
      jobs: { description: Check names mapped to run or skip, value: "${{ jobs.changes.outputs.jobs }}" }
permissions: { contents: read }
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs: { jobs: "${{ steps.plan.outputs.jobs }}" }
    env: { MISE_ENABLE_TOOLS: "bun" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with: {
          version: 2026.11.4,
          mise_dir: "${{ github.workspace }}/../actionlint-mise",
          cache: true,
          cache_key: "actionlint-mise-v5-{{platform}}-{{version}}-{{env.MISE_ENABLE_TOOLS}}-${{ hashFiles('.mise.toml', '.tool-versions', '**/mise.lock', '**/.mise.lock', '.mise/locks/**') }}",
          add_shims_to_path: false,
        }
        env: { MISE_ENABLE_TOOLS: "bun" }
      - name: Select checks from build dependencies and PR head commit trailers
        id: plan
        env: { CI_PROFILE: "${{ inputs.profile }}" }
        run: bun .github/ci/plan.mjs
