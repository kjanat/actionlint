name: Select CI checks
on:
  workflow_call:
    inputs:
      profile: { description: Workflow profile in .github/ci/filters.yml, required: true, type: string }
    outputs:
      jobs: { description: Check names mapped to run or skip, value: "${{ jobs.changes.outputs.jobs }}" }
permissions: { contents: read }
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs: { jobs: "${{ steps.plan.outputs.jobs }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with: { install_args: bun, add_shims_to_path: false }
        env: { MISE_ENABLE_TOOLS: "bun" }
      - name: Select checks from changed paths and PR head commit trailers
        id: plan
        env: { CI_PROFILE: "${{ inputs.profile }}" }
        run: bun .github/ci/plan.mjs
