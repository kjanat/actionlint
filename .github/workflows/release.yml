name: Release
on: { push: { tags: ["v*.*.*"] } }

concurrency:
  group: actionlint-release
  cancel-in-progress: false
  queue: max

permissions: { contents: read }

jobs:
  nix:
    uses: $/.github/workflows/nix.yml
    with: { tag: "${{ github.ref_name }}" }
  changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    steps:
      - uses: &ActionsCheckout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: &NoCreds { persist-credentials: false }
      - name: Check pinned go-shellcheck version
        uses: $/.github/actions/shellcheck-versions
        with: { fail-on-outdated: true }
      - uses: &SetupGo actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: &GoMod { go-version-file: go.mod }
      - name: Resolve release notes
        env: { TAG: "${{ github.ref_name }}" }
        run: go run ./scripts/bump-version -notes "${TAG}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: release-notes, path: "${{ runner.temp }}/release-notes.md", if-no-files-found: error }
  manual:
    name: Build command manual
    runs-on: ubuntu-latest
    steps:
      - uses: *ActionsCheckout
        with: *NoCreds
      - uses: $/.github/actions/setup-pandoc
      - uses: kjanat/runner@8baa9ee978cfed038b98741749673c788ff161d1 # v0.26.2
      - run: run make:man/actionlint.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: manual, path: man/actionlint.1, if-no-files-found: error }
  binaries:
    name: Publish binaries and Action bundle
    runs-on: ubuntu-latest
    needs: [changelog, manual, nix, action-bundle]
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: *ActionsCheckout
        with: { fetch-depth: 0, persist-credentials: false }
      - parallel:
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with: { name: manual, path: man }
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with: { name: release-notes, path: "${{ runner.temp }}" }
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with: { name: javascript-action, path: "${{ runner.temp }}/actionlint-action" }
          - uses: *SetupGo
            with: *GoMod
      - name: Get version
        run: echo VERSION="${GITHUB_REF#refs/tags/v}" >> "${GITHUB_ENV}"
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: { version: v2.18.0, args: "release --clean --release-notes=${{ runner.temp }}/release-notes.md" }
        env: {
          GITHUB_TOKEN: "${{ github.token }}",
          HOMEBREW_TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}",
          SCOOP_BUCKET_TOKEN: "${{ secrets.SCOOP_BUCKET_TOKEN }}",
          WINGET_TOKEN: "${{ secrets.WINGET_TOKEN }}",
          AUR_SSH_PRIVATE_KEY: "${{ secrets.AUR_SSH_PRIVATE_KEY }}",
          COMMIT_USER: "${{ vars.COMMIT_USER }}",
          COMMIT_EMAIL: "${{ vars.COMMIT_EMAIL }}",
        }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with: { subject-checksums: "./dist/actionlint_${{ env.VERSION }}_checksums.txt" }
      - name: Attest the JavaScript Action bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with: { subject-path: "${{ runner.temp }}/actionlint-action/assets/*.mjs" }
      - name: Post-release download check
        run: bash ./scripts/download-actionlint.bash
  npm:
    needs: binaries
    permissions: { contents: read, id-token: write }
    uses: $/.github/workflows/npm-release.yml
    with: { tag: "${{ github.ref_name }}" }
  action-bundle:
    name: Verify tagged JavaScript Action
    runs-on: ubuntu-latest
    needs: [changelog, nix]
    timeout-minutes: 15
    steps:
      - uses: *ActionsCheckout
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24", package-manager-cache: false }
      - name: Verify annotated release tag signature
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          object="$(git rev-parse "refs/tags/${TAG}")"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object}" --jq '.verification.verified')"
          test "${verified}" = true
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          test "${commit}" = "${GITHUB_SHA}"
      - name: Check the runtime and stage the committed bundle
        run: |
          npm ci --ignore-scripts
          npm run typecheck --workspace actionlint-action
          npm test --workspace actionlint-action
          node --test scripts/build-action-release.test.mjs
          node scripts/build-action-release.mjs --from-tag --out-dir "${RUNNER_TEMP}/actionlint-action" --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: javascript-action, path: "${{ runner.temp }}/actionlint-action", if-no-files-found: error }
  action-smoke:
    name: Check the published Action bundle
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: *ActionsCheckout
        with: *NoCreds
      - name: Prepare the exact tagged tree for the runner
        run: |
          set -euo pipefail
          mkdir .actionlint-action-release
          git archive HEAD | tar -x -C .actionlint-action-release
      - name: Run the tagged Action against the published binary
        # ./ loads the tagged tree materialized in this job's workspace.
        uses: ./.actionlint-action-release
        with: { files: testdata/ok/minimal.yaml, format: json, shellcheck: "false", pyflakes: "false" }
  docker:
    runs-on: ubuntu-latest
    needs: [changelog, nix, action-bundle]
    outputs: {
      is-latest: "${{ steps.tag.outputs.is-latest }}",
      is-major-latest: "${{ steps.tag.outputs.is-major-latest }}",
      is-minor-latest: "${{ steps.tag.outputs.is-minor-latest }}",
    }
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: *ActionsCheckout
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Get tag name
        id: tag
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          minor="${version%.*}"
          {
            echo "name=${version}"
            echo "major=${major}"
            echo "minor=${minor}"
          } >> "${GITHUB_OUTPUT}"

          latest_stable_tag() {
            local pattern="$1"
            local candidate tags
            tags="$(git tag --list "${pattern}" --sort=-version:refname)"
            while IFS= read -r candidate; do
              if [[ "${candidate}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "${candidate}"
                return
              fi
            done <<< "${tags}"
          }

          latest="$(latest_stable_tag 'v*.*.*')"
          major_latest="$(latest_stable_tag "v${major}.*.*")"
          if [[ "${GITHUB_REF_NAME}" == "${latest}" ]]; then
            echo "is-latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is-latest=false" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF_NAME}" == "${major_latest}" ]]; then
            echo "is-major-latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is-major-latest=false" >> "${GITHUB_OUTPUT}"
          fi
          minor_latest="$(latest_stable_tag "v${minor}.*")"
          if [[ "${GITHUB_REF_NAME}" == "${minor_latest}" ]]; then
            echo "is-minor-latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is-minor-latest=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - parallel:
          - name: Login to GitHub Container Registry
            uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
            with: { registry: ghcr.io, username: "${{ github.repository_owner }}", password: "${{ secrets.GITHUB_TOKEN }}" }
          - name: Login to Docker Hub
            uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
            with: { username: "${{ github.repository_owner }}", password: "${{ secrets.DOCKERHUB_TOKEN }}", scope: "${{ github.repository }}@push" }
      - name: Tags for the CLI image
        id: meta-cli
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=${{ steps.tag.outputs.minor }},enable=${{ steps.tag.outputs.is-minor-latest }}
            type=raw,value=${{ steps.tag.outputs.major }},enable=${{ steps.tag.outputs.is-major-latest }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.is-latest }}
        env: { DOCKER_METADATA_ANNOTATIONS_LEVELS: "manifest,index" }
      - name: Build CLI image for the smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          target: cli
          build-args: |
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          load: true
          cache-from: type=gha,scope=release-cli
          cache-to: type=gha,scope=release-cli,mode=max
          tags: actionlint:smoke
      - name: Smoke-test the CLI image
        run: docker run --rm --mount type=bind,source="${PWD}",target=/w -- actionlint:smoke -color -verbose
      - name: Build and push CLI image
        id: push-cli
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          target: cli
          build-args: |
            ACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-cli
          cache-to: type=gha,scope=release-cli,mode=max
          labels: ${{ steps.meta-cli.outputs.labels }}
          annotations: ${{ steps.meta-cli.outputs.annotations }}
          tags: ${{ steps.meta-cli.outputs.tags }}
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
      - parallel:
          - name: Attest the CLI image
            uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
            with:
              subject-name: ghcr.io/${{ github.repository }}
              subject-digest: ${{ steps.push-cli.outputs.digest }}
              push-to-registry: true
          - name: Attest the CLI image on Docker Hub
            uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
            with:
              subject-name: docker.io/${{ github.repository }}
              subject-digest: ${{ steps.push-cli.outputs.digest }}
  action-tags:
    name: Update moving Action references
    needs: [binaries, docker, action-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: *ActionsCheckout
        with: { fetch-depth: 0 }
      - name: Verify the published bundle matches the release tag
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "actionlint-action_${version}.mjs" \
            --pattern "actionlint-action_${version}_checksums.txt" \
            --dir "${RUNNER_TEMP}/published-action"
          cd "${RUNNER_TEMP}/published-action"
          sha256sum --check "actionlint-action_${version}_checksums.txt"
          cmp "actionlint-action_${version}.mjs" "${GITHUB_WORKSPACE}/action.mjs"
      - name: Update eligible floating tags
        shell: bash
        env: {
          MOVE_MAJOR: "${{ needs.docker.outputs.is-major-latest }}",
          MOVE_MINOR: "${{ needs.docker.outputs.is-minor-latest }}",
          RELEASE_COMMIT: "${{ github.sha }}",
        }
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major="v${version%%.*}"
          minor="v${version%.*}"
          refs=()
          if [[ "${MOVE_MAJOR}" == true ]]; then
            refs+=("+${RELEASE_COMMIT}:refs/tags/${major}")
          fi
          if [[ "${MOVE_MINOR}" == true ]]; then
            refs+=("+${RELEASE_COMMIT}:refs/tags/${minor}")
          fi
          if [[ "${#refs[@]}" -gt 0 ]]; then
            git push --atomic origin "${refs[@]}"
          fi
