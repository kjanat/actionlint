name: Release notes
on:
  push:
    branches: [master]
    paths: [docs/releases/v*.md]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to add missing notes for.
        type: string
        required: false
        default: ""

permissions: { contents: read }
defaults: { run: { shell: "bash --noprofile --norc -eo pipefail {0}" } }

jobs:
  sync:
    name: Copy docs/releases to the GitHub releases
    if: github.repository == 'kjanat/actionlint' && github.ref == 'refs/heads/master' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: release-notes, cancel-in-progress: false, queue: max }
    permissions: { contents: read, id-token: write }
    steps:
      - uses: &BeepboopToken kjanat/beepboop/actions/token@b1beb87ed2769aed465dfa68705cf42cd2613b99 # v1
        id: beepboop
        with: { permission-contents: write }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - name: Update every release whose notes file changed
        env:
          GH_TOKEN: ${{ steps.beepboop.outputs.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push && "${BEFORE}" =~ ^[0-9a-f]{40}$ && "${BEFORE}" != 0000000000000000000000000000000000000000 ]]; then
            deleted="$(git diff --name-only --no-renames --diff-filter=D "${BEFORE}" "${GITHUB_SHA}" -- 'docs/releases/v*.md')"
            if [[ -n "${deleted}" ]]; then
              echo "::error::Release notes files were deleted; their releases keep a body without a source: ${deleted//$'\n'/, }"
              exit 1
            fi
            changed="$(git diff --name-only --no-renames --diff-filter=AM "${BEFORE}" "${GITHUB_SHA}" -- 'docs/releases/v*.md')"
          else
            changed="$(git ls-files -- 'docs/releases/v*.md')"
          fi
          if [[ -z "${changed}" ]]; then
            echo 'No release notes file changed.'
            exit 0
          fi
          mapfile -t files <<< "${changed}"
          tags=()
          for file in "${files[@]}"; do
            tag="$(basename "${file}" .md)"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            node tools/release/release-candidate.mjs notes --version "${tag}" > "${RUNNER_TEMP}/${tag}.md"
            tags+=("${tag}")
          done
          for tag in "${tags[@]}"; do
            if lookup="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>&1)"; then
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/${tag}.md"
              echo "${tag}: notes updated from docs/releases/${tag}.md"
            elif [[ "${lookup}" == *"release not found"* ]]; then
              echo "::notice file=docs/releases/${tag}.md::No release ${tag} exists yet; the file publishes with it."
            else
              echo "${lookup}" >&2
              exit 1
            fi
          done
  missing:
    name: Open a PR for missing release notes
    if: >-
      github.repository == 'kjanat/actionlint' &&
      ((github.event_name == 'release' && !github.event.release.draft) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-notes-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    permissions: { contents: read, id-token: write }
    env: { TAG: "${{ github.event.release.tag_name || inputs.tag }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: refs/heads/master, persist-credentials: false }
      - name: Check whether the notes file is missing
        id: notes
        run: |
          [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ -e "docs/releases/${TAG}.md" ]]; then
            echo 'missing=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'missing=true' >> "${GITHUB_OUTPUT}"
          fi
      - uses: *BeepboopToken
        if: steps.notes.outputs.missing == 'true'
        id: beepboop
        with: { permission-contents: write, permission-pull-requests: write }
      - name: Add published notes when master has no file for this release
        if: steps.notes.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ steps.beepboop.outputs.token }}
          "${{ insert }}": ${{ fromJSON(steps.beepboop.outputs.gitId || '{}') }}
        run: |
          file="docs/releases/${TAG}.md"
          release="${RUNNER_TEMP}/published-release.json"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body,isDraft,publishedAt,url >"${release}"
          jq -e '.isDraft == false and .publishedAt != null and (.body | type == "string" and length > 0)' "${release}" > /dev/null
          branch="docs/release-notes-${TAG}"
          remote="$(git ls-remote origin "refs/heads/${branch}")"
          if [[ -n "${remote}" ]]; then
            git fetch --no-tags origin "${branch}"
            git switch -c "${branch}" FETCH_HEAD
          else
            git switch -c "${branch}"
          fi
          mkdir -p docs/releases
          jq -j '.body | gsub("\r\n"; "\n") | sub("\n+$"; "") + "\n"' "${release}" > "${file}"
          git add -- "${file}"
          if ! git diff --cached --quiet; then
            git commit -m "docs: add release notes for ${TAG}"
            gh auth setup-git
            git push origin "HEAD:refs/heads/${branch}"
          fi
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base master --head "${branch}" --state open --json number --jq length)"
          if [[ "${existing}" == 0 ]]; then
            body="${RUNNER_TEMP}/release-notes-pr.md"
            url="$(jq -r .url "${release}")"
            printf 'Adds the published release notes for [%s](%s) to `%s`.\n' "${TAG}" "${url}" "${file}" > "${body}"
            gh pr create --repo "${GITHUB_REPOSITORY}" --base master --head "${branch}" \
              --title "docs: add release notes for ${TAG}" --body-file "${body}"
          fi
