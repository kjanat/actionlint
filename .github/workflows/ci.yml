---
name: CI
env: { MISE_CACHE_DIR: "${{ github.workspace }}-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }
on:
  push: { branches: [master] }
  pull_request: null
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
defaults: { run: { shell: "bash --noprofile --norc -exo pipefail {0}" } }
jobs:
  changes:
    uses: $/.github/workflows/ci-changes.yml
    with: { profile: ci }
  nix:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['nix']) }}
    uses: $/.github/workflows/nix.yml
  unit-tests:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix: { os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest, macos-26-intel, windows-2025-vs2026, windows-11-vs2026-arm] }
    # Keep every required platform check present without allocating its native runner when unselected.
    runs-on: ${{ (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['unit']) && matrix.os || 'ubuntu-slim' }}
    env: {
      MISE_ENABLE_TOOLS: "node,npm,bun,shellcheck",
      CI_UNIT: "${{ needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['unit'] }}",
    }
    steps:
      - uses: &ActionsCheckout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.CI_UNIT == 'true'
        with: &NoCreds { persist-credentials: false }
      # Parallel setup steps race while the runner rewrites event.json on Windows.
      - uses: &SetupGo actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: env.CI_UNIT == 'true'
        with: &GoMod { go-version-file: go.mod }
      - uses: &SetupUv astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.CI_UNIT == 'true'
        with: &NoCache { enable-cache: false }
      - name: Install Node.js, npm, Bun and ShellCheck
        if: env.CI_UNIT == 'true'
        uses: &SetupMise jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env: &MiseTemp { TEMP: "${{ runner.temp }}", TMP: "${{ runner.temp }}" }
        with: &TestTools
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
          cache_save_post: true
          monorepo: false
          add_shims_to_path: false
      - name: Install Ruff for integration tests
        if: env.CI_UNIT == 'true'
        run: uv tool install ruff==0.17.0
      - name: Install shells for completion tests on Linux
        if: ${{ env.CI_UNIT == 'true' && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish bash-completion;
          zsh --version; fish --version
      - name: Install the YAML language server for editor completion tests
        if: env.CI_UNIT == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - if: env.CI_UNIT == 'true'
        run: go test -v ./...
      # Check that actionlint builds without CGO.
      - if: env.CI_UNIT == 'true'
        run: go build ./cmd/actionlint
        env: { CGO_ENABLED: 0 }
  race:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['race']) }}
    name: Race detector and coverage
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env: { MISE_ENABLE_TOOLS: "node,npm,bun,shellcheck" }
    steps:
      - &ActCheckNocred { uses: *ActionsCheckout, with: *NoCreds }
      - &GoGomod { uses: *SetupGo, with: *GoMod }
      - &Uv { uses: *SetupUv, with: *NoCache }
      - { name: Install the project Node.js and npm versions, uses: *SetupMise, with: *TestTools }
      - { name: Install Ruff for integration tests, run: uv tool install ruff==0.17.0 }
      - { name: Install the YAML language server for editor completion tests, run: bun install --frozen-lockfile --ignore-scripts }

      - run: go test -v -race -coverpkg=./... -coverprofile coverage.txt -covermode=atomic ./...
      - run: go tool cover -func ./coverage.txt

      # Detect data races when actionlint checks its own workflows (#333).
      - run: go build -race ./cmd/actionlint

      - name: Dog fooding 🐶
        # actionlint passes --norc to ShellCheck, so it ignores .shellcheckrc.
        run: ./actionlint check --output github --shellcheck='shellcheck -o all'

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with: { use_oidc: true }
  wasm:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['wasm']) }}
    name: Wasm
    runs-on: ubuntu-latest
    env: { MISE_ENABLE_TOOLS: "go,node,npm,bun,pandoc,npm:runner-run" }
    steps:
      - *ActCheckNocred
      - name: Install project tools
        uses: *SetupMise
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
          cache_save_post: true
          monorepo: false
          add_shims_to_path: false
        env: { MISE_ENABLE_TOOLS: "go,node,npm,bun,pandoc,npm:runner-run" }
      - name: Install JavaScript dependencies
        run: runner install --pm bun --no-tools --frozen
      - name: Build command manual
        run: run man
      - name: Install browser test runtime
        working-directory: libraries/browser-lsp
        run: bunx playwright install --with-deps chromium
      - name: Build and test playground
        run: run -sk
          actionlint-playground:build
          actionlint-playground:test
          @kjanat-actionlint/language-server:test
          actionlint-playground:test:browser
      - name: Lint playground
        run: run actionlint-playground:lint
      - name: Upload browser test failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-failures
          path: .review-artifacts/browser-lsp/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
  javascript:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['javascript']) }}
    name: JavaScript
    runs-on: ubuntu-latest
    env: { MISE_ENABLE_TOOLS: "go,node,npm,bun,npm:runner-run" }
    steps:
      - *ActCheckNocred
      - name: Install project tools
        uses: *SetupMise
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
          cache_save_post: true
          monorepo: false
          add_shims_to_path: false
        env: { MISE_ENABLE_TOOLS: "go,node,npm,bun,npm:runner-run" }
      - name: Install dependencies and test JavaScript tooling
        env: { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: runner install --pm bun --no-tools --frozen test:js lint:biome
      - name: Check the plugin SDK
        run: run -sk
          @kjanat-actionlint/plugin-sdk:typecheck
          @kjanat-actionlint/plugin-sdk:test
  release-snapshot:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['release']) }}
    name: Release snapshot
    runs-on: ubuntu-latest
    env: { MISE_ENABLE_TOOLS: "node,npm,bun,pandoc,npm:runner-run" }
    steps:
      - uses: *ActionsCheckout
        with: { fetch-depth: 0, persist-credentials: false }
      - parallel:
          - &Go { uses: *SetupGo, with: *GoMod }
          - name: Install syft for SBOM generation
            uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
          - name: Install Node.js, npm, Bun and Pandoc
            uses: *SetupMise
            with: {
              version: 2026.11.4,
              mise_dir: "${{ github.workspace }}-mise",
              cache: true,
              cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}",
              monorepo: false,
              add_shims_to_path: false,
            }
            env: { MISE_ENABLE_TOOLS: "node,npm,bun,pandoc,npm:runner-run" }
      - name: Build JavaScript Action release files outside the checkout
        run: bun install --frozen-lockfile --ignore-scripts;
          version="$(cat VERSION)";
          node tools/release/build-action-release.mjs --out-dir "${RUNNER_TEMP}/actionlint-action" --version "${version}"
      - run: run man:roff
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { version-file: .tool-versions, args: release --snapshot --clean }
      - name: Smoke-test the linux/amd64 snapshot binary
        run: ./dist/linux_linux_amd64_v1/actionlint -version
      - name: Upload native CLI previews for plugin authors
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actionlint-cli-preview
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
            dist/metadata.json
          if-no-files-found: error
          retention-days: 7
  package-previews:
    needs: release-snapshot
    if: ${{ !cancelled() && needs['release-snapshot'].result == 'success' }}
    uses: $/.github/workflows/package-previews.yml
    permissions: { contents: read }
  docker-previews:
    needs: release-snapshot
    if: >-
      !cancelled() && needs['release-snapshot'].result == 'success' &&
      github.repository == 'kjanat/actionlint' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: $/.github/workflows/docker-previews.yml
    permissions: { contents: read, packages: write }
    secrets: { DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}" }
  go-guest-modules:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['guest-modules']) }}
    name: Go guest modules
    runs-on: ubuntu-latest
    steps:
      - *ActCheckNocred
      - uses: *SetupGo
        with: { go-version: stable, check-latest: true }
      - name: Check Go guest module dependencies and tests
        shell: bash -euo pipefail {0}
        run: |
          for dir in plugins/sdk/go plugins/examples/insecure-download; do
            echo "::group::${dir}"
            go -C "${dir}" mod tidy -diff
            go -C "${dir}" test ./...
            echo "::endgroup::"
          done
  lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['lint']) }}
    name: Lint
    runs-on: ubuntu-latest
    env: { MISE_ENABLE_TOOLS: "bun,shellcheck,tombi,npm:runner-run" }
    steps:
      - *ActCheckNocred
      - *Go
      - *Uv
      - uses: *SetupMise
        with: {
          version: 2026.11.4,
          mise_dir: "${{ github.workspace }}-mise",
          cache: true,
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}",
          monorepo: false,
          add_shims_to_path: false,
        }
        env: { MISE_ENABLE_TOOLS: "bun,shellcheck,tombi,npm:runner-run" }
      - name: Install golangci-lint
        run: version="$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)";
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${version}"
      - run: go mod tidy -diff
      - name: Build actionlint
        run: run mise:build
        env: &SkipGoGen { SKIP_GO_GENERATE: "true" }
      - name: Check configuration with JSON Schema and Tombi
        run: run test:config-schema
      - name: Install Ruff for workflow validation
        run: uv tool install ruff==0.17.0
      - name: Validate workflows with all ShellCheck checks
        run: go run ./cmd/actionlint --tool shellcheck='shellcheck -o all'
      - run: run -s lint lint-docs
        env: *SkipGoGen
      - name: Lint bash scripts
        run: shellcheck tools/ci/*.bash distribution/docker/*.bash tools/release/*.bash distribution/install/*.bash
  rust-native:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['plugins']) }}
    name: Native Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *ActCheckNocred
      - uses: *SetupMise
        with: {
          version: 2026.11.4,
          mise_dir: "${{ github.workspace }}-mise",
          cache: true,
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}",
          install: false,
          env: false,
          monorepo: false,
          add_shims_to_path: false,
          working_directory: "${{ runner.temp }}",
        }
      - name: Install the pinned Rust toolchain and targets
        run: rustup toolchain install
      - name: Cache Cargo dependencies and workspace builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &CargoPaths |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            internal/development/tests/conformance/wasm/runner-host/target/
          key: cargo-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Check Rust plugins and fixtures on the native target
        run: mise run plugins-check-native
      - name: Check the standalone Wasmtime host
        run: cargo check --locked --all-targets --manifest-path internal/development/tests/conformance/wasm/runner-host/Cargo.toml
  checks:
    needs: [lint, javascript, go-guest-modules, rust-native]
    if: ${{ !cancelled() }}
    name: Check results before matrix builds
    runs-on: ubuntu-slim
    steps:
      - name: Require selected checks to succeed
        env:
          CHECKS_PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: test "${CHECKS_PASSED}" = true
  plugins:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['plugins']) }}
    name: Component plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { MISE_ENABLE_TOOLS: "bun,tinygo,wasi-sdk,kprint,wasm-tools,wit-bindgen" }
    steps:
      - *ActCheckNocred
      - parallel:
          - *Go
          - name: Install the WebAssembly build tools and formatter
            uses: *SetupMise
            with:
              version: 2026.11.4
              mise_dir: "${{ github.workspace }}-mise"
              cache: true
              cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
              cache_save_post: true
              monorepo: false
              add_shims_to_path: false
            env: { MISE_ENABLE_TOOLS: "bun,tinygo,wasi-sdk,kprint,wasm-tools,wit-bindgen" }
          - name: Install the pinned Rust toolchain and targets
            run: rustup toolchain install
      - name: Cache Cargo dependencies and workspace builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *CargoPaths
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.lock', 'Cargo.toml', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
            cargo-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify generated plugin interfaces
        run: |
          mise run --force protocol:go
          go run -C internal/development/generators/plugin-contract .
          git diff --exit-code -- ':(glob)internal/plugins/execution/component/*.gen.go' ':(glob)internal/plugins/protocol/component/**/*.gen.go' plugins/sdk/rust/wit plugins/sdk/rust/json plugins/sdk/go/packaging/analyzer.wit plugins/sdk/go/bindings
          untracked="$(git ls-files --others --exclude-standard -- internal/plugins/execution/component internal/plugins/protocol/component plugins/sdk/rust/wit plugins/sdk/rust/json plugins/sdk/go/packaging/analyzer.wit plugins/sdk/go/bindings)"
          test -z "${untracked}"
      - name: Verify the guest SDK package
        run: cargo package --locked -p actionlint-extension-api --all-features
      - name: Build the pinned Wasmtime runner host
        run: cargo build --locked --manifest-path internal/development/tests/conformance/wasm/runner-host/Cargo.toml
      - name: Build the plugin fixtures from source
        run: mise run --force plugins
      - name: Load the Rust, C and TinyGo examples
        run: go run ./cmd/actionlint --no-config --no-tool shellcheck --no-tool ruff
          --plugin internal/plugins/execution/component/testdata/plugins/pipe-to-shell.wasm
          --plugin internal/plugins/execution/component/testdata/plugins/no-sudo.wasm
          --plugin internal/plugins/execution/component/testdata/plugins/insecure-download.wasm
          internal/development/tests/integration/workflow/testdata/ok/minimal.yaml
      - name: Test plugins including Wasmtime runner parity
        env: { ACTIONLINT_RUNNER_HOST: "${{ github.workspace }}/internal/development/tests/conformance/wasm/runner-host/target/debug/actionlint-runner-host" }
        run: test -x "${ACTIONLINT_RUNNER_HOST}";
          go test -count=1 -v ./internal/plugins/execution/component ./internal/plugins/execution/module ./internal/development/tests/integration/plugins
      - name: Test Rust SDK consumers through the Go host
        run: mise run plugins-check-rust-sdk
      - run: go test -count=1 -run "Plugin|Engine|ModuleKind" ./internal/checking ./internal/lsp ./internal/development/tests/integration/checking ./internal/development/tests/integration/cli
  docker:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['docker']) }}
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - *ActCheckNocred
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { load: true, push: false, tags: actionlint:test, file: distribution/docker/Dockerfile }
      - name: Check bundled Ruff
        run: bash distribution/docker/test-docker-ruff.bash actionlint:test
      - name: Check published Wasm plugins and offline cache
        run: bash distribution/docker/test-docker-plugins.bash actionlint:test
      - name: Test Docker image
        run: docker container run
          --mount "type=bind,source=${PWD},target=/w"
          -- actionlint:test -color -verbose
      - name: Build Docker Action compatibility image
        run: docker build -f distribution/docker/Dockerfile --target action -t actionlint:action-test .
      - name: Check Docker Action compatibility
        run: bash distribution/docker/test-docker-action.bash actionlint:action-test
      - parallel:
          - name: Lint Dockerfile with hadolint
            run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3018 --strict-labels
              --require-label org.opencontainers.image.source:url
              --require-label org.opencontainers.image.licenses:spdx
              - < distribution/docker/Dockerfile
          - name: Lint Dockerfile with droast
            uses: immanuwell/dockerfile-roast@1c87b2aa189338c24db4acde40864dae8994de8f # 1.7.0
            with: { files: distribution/docker/Dockerfile }
  action:
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['action']) }}
    name: GitHub Action
    strategy:
      fail-fast: true
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: { MISE_ENABLE_TOOLS: "node,npm,bun,shellcheck,npm:runner-run" }
    steps:
      - uses: *ActionsCheckout
        with: { fetch-depth: 0, persist-credentials: false }
      # Parallel setup steps race while the runner rewrites event.json on Windows.
      - *GoGomod
      - { name: Install the project Node.js and npm versions, uses: *SetupMise, with: *TestTools, env: *MiseTemp }
      - name: Install JavaScript Action build dependencies
        # Packaging also runs when JavaScript-only tests are not selected.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the JavaScript runtime and release packaging
        if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['action-tests']) }}
        env: { MISE_TASK_RUN_AUTO_INSTALL: "false", MSYS_NO_PATHCONV: "1" }
        run: run -s actionlint-action:typecheck actionlint-action:test //tools/release:test //tools/toolchain:test //distribution/docker:test
      - name: Validate the staged release configuration
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { version-file: .tool-versions, args: check }
      - name: Prepare the ordinary binary and release action
        env:
          BINARY_SUFFIX: ${{ runner.os == 'Windows' && '.exe' || '' }}
          GIT_AUTHOR_NAME: Action release test
          GIT_AUTHOR_EMAIL: action-release-test@example.invalid
          GIT_COMMITTER_NAME: Action release test
          GIT_COMMITTER_EMAIL: action-release-test@example.invalid
        run: |
          bun install --frozen-lockfile --ignore-scripts
          binary="${RUNNER_TEMP}/actionlint-test${BINARY_SUFFIX}"
          go build -o "${binary}" ./cmd/actionlint
          echo "ACTIONLINT_ACTION_BINARY=${binary}" >> "${GITHUB_ENV}"
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')"
          node tools/release/build-action-release.mjs --out-dir "${RUNNER_TEMP}/actionlint-action" --version "${tag#v}"
          parent="$(git rev-parse HEAD)"
          candidate="$(node tools/release/build-action-release.mjs --commit --out-dir "${RUNNER_TEMP}/actionlint-action" \
            --version "${tag#v}" --parent "${parent}")"
          mkdir .actionlint-action-test
          git archive "${candidate}" | tar -x -C .actionlint-action-test
          test -f .actionlint-action-test/go.mod
          test -f .actionlint-action-test/cmd/actionlint/main.go
          (cd .actionlint-action-test && sha256sum --check SHA256SUMS)
      - name: Check Git-tag version fallback
        run: env -u ACTIONLINT_VERSION run actionlint-action:build --out-dir "${RUNNER_TEMP}/actionlint-action-fallback";
          cmp "${RUNNER_TEMP}/actionlint-action-fallback/action.mjs" "${RUNNER_TEMP}/actionlint-action/action/action.mjs"
      - name: Install an explicit historical version
        id: setup-version
        uses: ./.actionlint-action-test
        env: { ACTIONLINT_ACTION_BINARY: "" }
        with:
          version: v1.17.0
          version-file: missing-actionlint-version
          install-only: true
          shellcheck: false
      - name: Check the installed version and prepare a version file
        run: actionlint --version | grep -Fx 'actionlint.kjanat.dev 1.17.0';
          printf 'nodejs 24.0.0\nactionlint 1.17.0\n' > .actionlint-action-test/.tool-versions
      - name: Install from a tool version file
        id: setup-version-file
        uses: ./.actionlint-action-test
        env: { ACTIONLINT_ACTION_BINARY: "" }
        with:
          working-directory: .actionlint-action-test
          version-file: .tool-versions
          install-only: true
          shellcheck: false
      - name: Check setup outputs and the surviving binary
        env:
          VERSION_OUTPUTS: ${{ toJSON(steps.setup-version.outputs) }}
          VERSION_FILE_OUTPUTS: ${{ toJSON(steps.setup-version-file.outputs) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync } from 'node:fs';
          for (const value of [process.env.VERSION_OUTPUTS, process.env.VERSION_FILE_OUTPUTS]) {
            const outputs = JSON.parse(value);
            assert.equal(outputs.version, '1.17.0');
            assert.equal(outputs['exit-code'], '0');
            assert.equal(outputs.result, 'success');
            assert.equal(outputs['problem-count'], '');
            assert.equal(outputs['result-file'], '');
          }
          assert.ok(!readdirSync(process.env.RUNNER_TEMP).some(name => name.startsWith('actionlint-result-')));
          NODE
          actionlint_path="$(command -v actionlint)"
          [[ "${actionlint_path}" == */actionlint-bin-*/actionlint* ]]
          actionlint --version | grep -Fx 'actionlint.kjanat.dev 1.17.0'
          rm .actionlint-action-test/.tool-versions
      - name: Exercise the action through the real runner
        id: smoke
        # ./ loads the candidate release tree generated in this job's workspace.
        uses: ./.actionlint-action-test
        with: { files: internal/development/tests/integration/workflow/testdata/ok/minimal.yaml, format: json, sarif: true }
      - name: Exercise inline configuration
        uses: ./.actionlint-action-test
        with:
          files: internal/development/tests/integration/workflow/testdata/ok/minimal.yaml
          config: "config-variables: []"
          annotations: false
          summary: false
      - name: Exercise shared configuration
        shell: bash
        run: |
          mkdir -p .github
          printf 'plugins: []\nconfig-variables: []\n' > .github/actionlint.yaml
      - name: Lint with shared configuration
        uses: ./.actionlint-action-test
        with:
          files: internal/development/tests/integration/workflow/testdata/ok/minimal.yaml
          config-file: .github/actionlint.yaml
      - name: Exercise advisory review without a token
        uses: ./.actionlint-action-test
        with:
          files: internal/development/tests/integration/workflow/testdata/err/one_error.yaml
          fail-on-error: false
          annotations: false
          review: true
          token: ""
      - name: Upload result files from the recipe
        if: always() && steps.smoke.outputs.result-file != ''
        uses: &UploadAction actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actionlint-reports-${{ matrix.os }}
          path: |
            ${{ steps.smoke.outputs.result-file }}
            ${{ steps.smoke.outputs.report-sarif }}
      - name: Save Linux candidate for Dockerless runner
        if: runner.os == 'Linux'
        uses: *UploadAction
        with:
          name: actionlint-linux-candidate
          path: |
            ${{ runner.temp }}/actionlint-action/action/
            ${{ runner.temp }}/actionlint-test
      - name: Check runner outputs and input compatibility
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit-code }}
          RESULT: ${{ steps.smoke.outputs.result }}
          PROBLEM_COUNT: ${{ steps.smoke.outputs.problem-count }}
          OUTPUT: ${{ steps.smoke.outputs.output }}
        run: |
          node applications/github-action/tests/check-action-outputs.mjs
          actionlint_path="$(command -v actionlint)"
          [[ "${actionlint_path}" == */actionlint-bin-*/actionlint* ]]
          actionlint -version
      - name: Verify bundled plugins and real cache restoration
        uses: ./.github/actions/test-action
        with:
          action-directory: ${{ runner.temp }}/actionlint-action/action
          binary: ${{ env.ACTIONLINT_ACTION_BINARY }}
      - name: Check exported actionlint from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          actionlint -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $LASTEXITCODE
  action-slim:
    name: GitHub Action (ubuntu-slim)
    needs: action
    if: ${{ !cancelled() && needs.action.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - *ActCheckNocred
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: actionlint-linux-candidate, path: .actionlint-slim-test }
      - name: Restore executable permission
        run: chmod +x .actionlint-slim-test/actionlint-test
      - name: Lint on a Dockerless runner
        id: slim
        uses: ./.actionlint-slim-test/actionlint-action/action
        env: { ACTIONLINT_ACTION_BINARY: "${{ github.workspace }}/.actionlint-slim-test/actionlint-test" }
        with: { files: internal/development/tests/integration/workflow/testdata/ok/minimal.yaml, shellcheck: false }
      - name: Verify Dockerless result
        env: { RESULT: "${{ steps.slim.outputs.result }}" }
        run: test "${RESULT}" = success
  action-result:
    name: GitHub Action
    needs: [action, action-slim]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all Action platforms to pass
        env: { RESULT: "${{ needs.action.result }}", SLIM_RESULT: "${{ needs.action-slim.result }}" }
        run: |
          if [[ "${RESULT}" == skipped && "${SLIM_RESULT}" == skipped ]]; then exit 0; fi
          test "${RESULT}" = success && test "${SLIM_RESULT}" = success
