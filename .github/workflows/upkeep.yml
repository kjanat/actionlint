name: Upkeep
on:
  schedule:
    # Every Saturday 10:21 in JST
    - cron: "21 1 * * 6"
  workflow_run: { workflows: [Release], types: [completed] }
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: { contents: read }

env:
  MISE_CACHE_DIR: "${{ github.workspace }}-mise/cache"
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  generate:
    name: Regenerate the Go tables
    if: github.event_name != 'workflow_run' && github.repository_owner == 'kjanat'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - &Beepboop
        uses: kjanat/beepboop/actions/token@b1beb87ed2769aed465dfa68705cf42cd2613b99 # v1
        id: beepboop
        with: { permission-contents: write, permission-pull-requests: write }
      - &Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - &SetupGo
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - &SetupNode
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: kjanat/install-dprint@7dafce0e5019151901bae232b12cf8b7bd330b2a # v2
      - name: Install catalogue generator dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Refresh upstream action and workflow metadata
        run: mise run generate:rules generate:contexts generate:events generate:actions
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: &BeepboopToken ${{ steps.beepboop.outputs.token }}
          committer: &BeepboopCommitter "${{ steps.beepboop.outputs.bot-login }} <${{ steps.beepboop.outputs.bot-email }}>"
          author: *BeepboopCommitter
          branch: ci/go-generate
          delete-branch: true
          add-paths: |
            internal/model/contexts/events/payload/catalogue.json
            :(glob)internal/**/*.gen.go
          commit-message: "Update the generated Go tables"
          title: "Update the generated Go tables"
          body: |
            `go generate` refreshed webhook events, workflow availability, runner action-metadata tables, or JavaScript runtime lifecycle.

            Created by [this Upkeep run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            area:codegen
            type:maintenance
          assignees: ${{ github.repository_owner }}

  readme:
    name: Refresh the README demo section
    if: github.repository_owner == 'kjanat' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    env: { MISE_ENABLE_TOOLS: "node" }
    steps:
      - *Beepboop
      - *Checkout
      - *SetupGo
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
          cache_save_post: true
          monorepo: false
          add_shims_to_path: false
        env:
          MISE_ENABLE_TOOLS: node
      - run: node tools/docs/readme-demo.mjs --fix ./README.md
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: *BeepboopToken
          committer: *BeepboopCommitter
          author: *BeepboopCommitter
          branch: ci/readme-demo
          delete-branch: true
          add-paths: README.md
          commit-message: "Refresh the README example"
          title: "Refresh the README example"
          body: |
            `node tools/docs/readme-demo.mjs --fix` rebuilt actionlint and refreshed the diagnostics for the README example.

            Created by [this Upkeep run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            documentation
            type:maintenance
          assignees: ${{ github.repository_owner }}

  go-toolchain:
    name: Bump Go toolchain
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository_owner == 'kjanat'
    runs-on: ubuntu-latest
    env: { MISE_ENABLE_TOOLS: "bun,npm:runner-run" }
    permissions: { contents: read, id-token: write }
    steps:
      - *Beepboop
      - *Checkout
      - *SetupGo
      - *SetupNode
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with: {
          version: 2026.11.4,
          mise_dir: "${{ github.workspace }}-mise",
          cache: true,
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}",
          monorepo: false,
          add_shims_to_path: false,
        }
      - name: Test synchronized toolchain updates
        env: { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: run //tools/toolchain:test
      - name: Check the latest stable Go toolchain
        id: version
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash -euo pipefail {0}
        run: |
          version="$(curl --fail --silent --show-error --location 'https://go.dev/VERSION?m=text' | sed -n '1p')"
          if [[ ! "${version}" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid Go version::go.dev returned '${version}'"
            exit 1
          fi
          node tools/toolchain/update-go-toolchain.mjs "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: *BeepboopToken
          committer: *BeepboopCommitter
          author: *BeepboopCommitter
          branch: ci/go-toolchain-version
          delete-branch: true
          add-paths: |
            go.mod
            .mise.toml
            distribution/docker/Dockerfile
            CONTRIBUTING.md
            flake.nix
            flake.lock
          commit-message: "Bump Go toolchain to ${{ steps.version.outputs.version }}"
          title: "Bump Go toolchain to ${{ steps.version.outputs.version }}"
          body: |
            Updates the preferred Go toolchain, mise, Docker builder, contributor example, and verified Nix compiler pin to `${{ steps.version.outputs.version }}`. The minimum supported Go version remains unchanged.

            Created by [this Upkeep run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            area:toolchain
            type:maintenance
          assignees: ${{ github.repository_owner }}
