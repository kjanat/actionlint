name: README demo
on:
  pull_request:
    paths:
      - .github/workflows/readme-demo.yml
      - .mise.toml
      - go.mod
      - README.md
      - docs/screenshots/**
      - scripts/check-readme/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { contents: read }

jobs:
  readme-demo:
    name: README demo section matches the latest releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with: { cache: false }
      - run: go run ./scripts/check-readme -quiet ./README.md
        env: { GITHUB_TOKEN: "${{ github.token }}" }
