name: Problem Matchers
env: { MISE_CACHE_DIR: "${{ github.workspace }}/../actionlint-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }
on:
  push:
    branches: [master]
    tags-ignore: ["*"]
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  changes:
    uses: $/.github/workflows/ci-changes.yml
    with: { profile: matcher }
  matcher-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['matcher']) }}
    name: Test generate-actionlint-matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # v0.28.0
        with: { version-file: .tool-versions }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with: {
          version: 2026.11.4,
          mise_dir: "${{ github.workspace }}/../actionlint-mise",
          cache: true,
          cache_key: "actionlint-mise-v5-{{platform}}-{{version}}-{{env.MISE_ENABLE_TOOLS}}-${{ hashFiles('.mise.toml', '.tool-versions', '**/mise.lock', '**/.mise.lock', '.mise/locks/**') }}",
          install: false,
          env: false,
          add_shims_to_path: false,
          working_directory: "${{ runner.temp }}",
        }
      - name: Update test data
        run: run matcher:fixtures
        env: { SKIP_GO_GENERATE: "true" }
      - name: Test actionlint-matcher.json
        env: &MiseNoAutoInstall { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: run //tools/matcher:test
      - name: Ensure .github/actionlint-matcher.json is up-to-date
        env: *MiseNoAutoInstall
        run: |
          run //tools/matcher:generate
          if git diff --quiet; then echo 'OK';
          else
            echo 'ERROR! .github/actionlint-matcher.json is outdated. Update it by "run //tools/matcher:generate"' >&2
            set -x; git diff; exit 1
          fi
