name: Problem Matchers
on:
  push:
    branches: [master]
    tags-ignore: ["*"]
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  matcher-test:
    name: Test generate-actionlint-matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # v0.28.0
        with: { version-file: .tool-versions }
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with: { install: false, env: false }
      - name: Update test data
        run: run -s make:scripts/generate-actionlint-matcher/testdata/escape.txt make:scripts/generate-actionlint-matcher/testdata/no_escape.txt make:scripts/generate-actionlint-matcher/testdata/want.json
        env: { SKIP_GO_GENERATE: "true" }
      - name: Test actionlint-matcher.json
        env: &MiseNoAutoInstall { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: run //scripts/generate-actionlint-matcher:test
      - name: Ensure .github/actionlint-matcher.json is up-to-date
        env: *MiseNoAutoInstall
        run: |
          run //scripts/generate-actionlint-matcher:generate
          if git diff --quiet; then
            echo 'OK'
          else
            echo 'ERROR! .github/actionlint-matcher.json is outdated. Update it by "run //scripts/generate-actionlint-matcher:generate"' >&2
            set -x
            git diff
            exit 1
          fi
