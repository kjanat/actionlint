name: Problem Matchers
on:
  push:
    branches: [master]
    tags-ignore: ["*"]
  pull_request:
  workflow_dispatch:

permissions: { contents: read }

jobs:
  changes:
    uses: $/.github/workflows/ci-changes.yml
    with:
      filters: |
        {
          "shared": [
            ".github/workflows/matcher.yml", ".github/workflows/ci-changes.yml", ".github/ci/**",
            ".tool-versions", ".mise.toml"
          ],
          "jobs": {
            "matcher": [
              "*.go", "analysis/**", "config/**", "diagnostic/**", "document/**", "syntax/**", "analyzer/**", "go.mod", "go.sum", "cmd/**", "internal/**", "!**/*_test.go",
              "tools/matcher/**", ".github/actionlint-matcher.json", "testdata/**", "Makefile", ".node-version"
            ]
          }
        }
  matcher-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['matcher']) }}
    name: Test generate-actionlint-matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: $/.github/actions/setup-runner
        with: { version-file: .tool-versions }
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with: { install: false, env: false, add_shims_to_path: false, working_directory: "${{ runner.temp }}" }
      - name: Update test data
        run: run -s make:tools/matcher/testdata/escape.txt make:tools/matcher/testdata/no_escape.txt make:tools/matcher/testdata/want.json
        env: { SKIP_GO_GENERATE: "true" }
      - name: Test actionlint-matcher.json
        env: &MiseNoAutoInstall { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: run //tools/matcher:test
      - name: Ensure .github/actionlint-matcher.json is up-to-date
        env: *MiseNoAutoInstall
        run: |
          run //tools/matcher:generate
          if git diff --quiet; then
            echo 'OK'
          else
            echo 'ERROR! .github/actionlint-matcher.json is outdated. Update it by "run //tools/matcher:generate"' >&2
            set -x
            git diff
            exit 1
          fi
