---
name: Comment Cop
env: { MISE_CACHE_DIR: "${{ github.workspace }}-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }
on: { pull_request_target: { types: [opened, synchronize, reopened, ready_for_review] } }
permissions: { contents: read, pull-requests: write }
jobs:
  comment-cop:
    if: github.repository == 'kjanat/actionlint' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: { group: "comment-cop-${{ github.event.pull_request.number }}", cancel-in-progress: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ github.event.pull_request.base.sha }}", persist-credentials: false }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
          cache_save_post: true
          install: false
          env: false
          monorepo: false
          add_shims_to_path: false
          working_directory: "${{ runner.temp }}"
      - name: Run Comment Cop
        uses: ./.github/actions/comment-cop
