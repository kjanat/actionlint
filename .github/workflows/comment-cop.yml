---
name: Comment Cop

# Only base-branch code runs with the write token. PR-controlled code is never
# checked out or executed by this pull_request_target workflow.
on: { pull_request_target: { types: [opened, synchronize, reopened, ready_for_review] } }

# Resolving review threads currently requires contents: write.
permissions: { contents: write, pull-requests: write }

jobs:
  comment-cop:
    if: >-
      github.repository == 'kjanat/actionlint' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: comment-cop-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out base-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - name: Run Comment Cop
        uses: $/.github/actions/comment-cop
