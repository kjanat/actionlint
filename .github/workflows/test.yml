name: Reproduce fromJSON document parsing

on:
  push:

permissions: {}

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - input: "31"
            expected_json_status: Accepted
          - input: "31 trailing"
            expected_json_status: Rejected
          - input: '{"n":1} garbage'
            expected_json_status: Rejected
          - input: '{"n":1}{"n":2}'
            expected_json_status: Rejected
          - input: '/* comment */{"n":1}'
            expected_json_status: Rejected
    steps:
      - name: Print parsed value
        env:
          RAW: ${{ matrix.input }}
          PARSED: ${{ toJSON(fromJSON(matrix.input)) }}
          EXPECTED_JSON_STATUS: ${{ matrix.expected_json_status }}
        shell: bash
        run: |
          node -e '
            const { isDeepStrictEqual } = require("node:util");
            const raw = process.env.RAW;
            const actionsValue = JSON.parse(process.env.PARSED);
            let strictStatus;
            let strictValue;
            try {
              strictValue = JSON.parse(raw);
              strictStatus = "Accepted";
            } catch {
              strictStatus = "Rejected";
            }
            console.log(JSON.stringify({
              input: raw,
              expected_json_status: process.env.EXPECTED_JSON_STATUS,
              observed_actions_status: "Accepted",
              observed_actions_value: actionsValue,
              observed_json_parse_status: strictStatus,
              observed_json_parse_value: strictValue
            }, null, 2));
            if (strictStatus !== process.env.EXPECTED_JSON_STATUS) {
              throw new Error("JSON.parse result differs from the JSON validity expectation");
            }
            if (strictStatus === "Rejected") {
              throw new Error("fromJSON accepted input that is not a valid JSON document");
            }
            if (!isDeepStrictEqual(actionsValue, strictValue)) {
              throw new Error("fromJSON and JSON.parse returned different values");
            }
          '
