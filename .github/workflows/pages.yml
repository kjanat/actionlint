name: Pages

on:
  push: { branches: [master] }
  workflow_run: { workflows: [Release], types: [completed] }
  workflow_dispatch: null

permissions: { contents: read }

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {
          persist-credentials: false,
          fetch-depth: 0,
          ref: "${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}",
        }
      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: go node npm github:kjanat/runner github:jgm/pandoc
      - parallel:
          - name: Install JavaScript dependencies
            run: runner install --pm npm --no-tools --frozen
          - name: Build command manual
            run: run make:man
      - name: Build and test playground
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"; then
            export ACTIONLINT_LATEST_RELEASE="${latest_release}"
          fi
          run --source make -s playground:make:build playground:make:test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: playground/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: {
      name: github-pages,
      url: "${{ steps.deployment.outputs.page_url }}",
    }
    steps: [
      {
        name: Deploy to GitHub Pages,
        id: deployment,
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346, # v5.0.1
      },
    ] # v5
