name: Pages

on:
  push:
    branches: [master]
    paths:
      - "*.go"
      - ".github/workflows/pages.yml"
      - ".mise.toml"
      - ".node-version"
      - ".tool-versions"
      - "Makefile"
      - "analysis/**"
      - "analyzer/**"
      - "bun.lock"
      - "cmd/**"
      - "config/**"
      - "diagnostic/**"
      - "document/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "internal/config/config_default.yaml"
      - "man/**"
      - "package.json"
      - "packages/changelog-feed/**"
      - "packages/language-server/**"
      - "playground/**"
      - "runner/**"
      - "syntax/**"
      - "tasks.toml"
      - "tools/toolchain/update-go-toolchain.mjs"
      - "tsconfig.json"
      # Later patterns exclude files, then include the browser command and manual source.
      - "!cmd/**"
      - "cmd/actionlint-lsp-wasm/**"
      - "!internal/cli/**"
      - "!internal/githubaction/**"
      - "!**/*_test.go"
      - "!**/*.md"
      - "man/actionlint.1.md"
  workflow_run: { workflows: [Release], types: [completed] }
  workflow_dispatch: null

permissions: { contents: read }

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: "${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}"
      - name: Install project tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: true
          auto_update: true
          install_args: go node npm bun
          add_shims_to_path: false
        env: { MISE_ENABLE_TOOLS: "go,node,npm,bun" }
      - uses: $/.github/actions/setup-runner
      - uses: $/.github/actions/setup-pandoc
      - parallel:
          - name: Install JavaScript dependencies
            run: runner install --pm bun --no-tools --frozen
          - name: Build command manual
            run: run make:man
      - name: Install browser test runtime
        working-directory: packages/language-server
        run: bunx playwright install --with-deps chromium
      - name: Build and test playground
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"; then
            export ACTIONLINT_LATEST_RELEASE="${latest_release}"
          fi
          run -s actionlint-playground:build actionlint-playground:test
          run -s @kjanat-actionlint/language-server:test actionlint-playground:test:browser
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: playground/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
