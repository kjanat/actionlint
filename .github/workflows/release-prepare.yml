name: Prepare release
run-name: ${{ inputs.validation-only && 'Validate' || 'Prepare' }} actionlint v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version: { description: "Stable version (MAJOR.MINOR.PATCH)", required: true, type: string }
      source: { description: Expected source commit; empty uses the selected revision, required: false, type: string }
      validation-only: { description: Test the selected branch without creating a release draft, default: false, type: boolean }

concurrency:
  group: actionlint-release
  cancel-in-progress: false
  queue: max

permissions: { contents: read }
defaults: { run: { shell: "bash --noprofile --norc -eo pipefail {0}" } }
env: { VERSION: "${{ inputs.version }}" }

jobs:
  prepare:
    name: Build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source: ${{ steps.candidate.outputs.source }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      tree: ${{ steps.candidate.outputs.tree }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: &Checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Check requested source and version
        env: { EXPECTED_SOURCE: "${{ inputs.source }}", VALIDATION_ONLY: "${{ inputs.validation-only }}" }
        run: |
          if [[ "${VALIDATION_ONLY}" != true ]]; then
            test "${GITHUB_REF}" = refs/heads/master
          fi
          test -z "${EXPECTED_SOURCE}" || test "${EXPECTED_SOURCE}" = "${GITHUB_SHA}"
          [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          existing_tag="$(git tag --list "v${VERSION}")"
          test -z "${existing_tag}"
      - name: Keep mise metadata with cached tools
        shell: bash
        run: |
          mise_dir="${HOME//\\//}/.local/share/actionlint-mise"
          if [[ "${RUNNER_OS}" == Windows ]]; then mise_dir="$(cygpath -m "${mise_dir}")"; fi
          printf 'ACTIONLINT_MISE_DIR=%s\nMISE_CACHE_DIR=%s/cache\n' "${mise_dir}" "${mise_dir}" >> "${GITHUB_ENV}"
      - parallel:
          - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
            with: { go-version-file: go.mod, cache: false }
          - uses: $/.github/actions/setup-shellcheck
          - uses: $/.github/actions/setup-runner
            with: { version-file: .tool-versions }
          - name: Install the project Node.js and npm versions
            uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
            with:
              cache: true
              auto_update: true
              mise_dir: ${{ env.ACTIONLINT_MISE_DIR }}
              cache_save_post: true
              cache_key: >-
                actionlint-mise-v3-{{platform}}-{{version}}-{{mise_env}}-{{install_args_hash}}-p{{cache_period}}-${{ hashFiles('.mise.toml', '.tool-versions', '**/mise.lock', '**/.mise.lock') }}
              install_args: node npm
              add_shims_to_path: false
            env: { MISE_ENABLE_TOOLS: "node,npm" }
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Stage stub release archives for the PyPI wheel check
        run: |
          stub="${RUNNER_TEMP}/pypi-stub"
          mkdir -p "${stub}/linux" "${stub}/darwin" "${stub}/windows"
          printf '#!/bin/sh\necho "actionlint %s"\n' "${VERSION}" > "${stub}/linux/actionlint"
          cp "${stub}/linux/actionlint" "${stub}/windows/actionlint.exe"
          {
            printf '\xcf\xfa\xed\xfe\x07\x00\x00\x01\x03\x00\x00\x00\x02\x00\x00\x00\x01\x00\x00\x00\x18\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
            printf '\x32\x00\x00\x00\x18\x00\x00\x00\x01\x00\x00\x00\x00\x00\x0d\x00\x00\x00\x0d\x00\x00\x00\x00\x00'
          } > "${stub}/darwin/actionlint"
          chmod 755 "${stub}/linux/actionlint" "${stub}/darwin/actionlint" "${stub}/windows/actionlint.exe"
          for os in linux darwin windows; do cp LICENSE.txt "${stub}/${os}/"; done
          for platform in darwin_amd64 darwin_arm64 linux_386 linux_amd64 linux_arm64 linux_armv6; do
            tar -czf "${stub}/actionlint_${VERSION}_${platform}.tar.gz" -C "${stub}/${platform%%_*}" actionlint LICENSE.txt
          done
          for platform in windows_386 windows_amd64 windows_arm64; do
            (cd "${stub}/windows" && zip -q "${stub}/actionlint_${VERSION}_${platform}.zip" actionlint.exe LICENSE.txt)
          done
          (cd "${stub}" && sha256sum -- *.tar.gz *.zip > "actionlint_${VERSION}_checksums.txt")
          {
            echo "PYPI_ASSETS=${stub}"
            echo "PYPI_OUT=${RUNNER_TEMP}/pypi-stub-wheels"
          } >> "${GITHUB_ENV}"
      - &PypiWheels
        name: Build the PyPI wheels and run the x86-64 Linux wheel
        uses: $/.github/actions/pypi-wheels
        with: { version: "${{ inputs.version }}", assets-dir: "${{ env.PYPI_ASSETS }}", out-dir: "${{ env.PYPI_OUT }}", smoke: manylinux_2_17_x86_64 }
      - name: Validate source and release helpers
        env: { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: |
          go run ./tools/release/bump-version -check
          go run ./tools/release/bump-version -notes "v${VERSION}" > "${RUNNER_TEMP}/release-notes.md"
          go test ./...
          runner i --no-tools -fs actionlint-action:typecheck actionlint-action:test //tools/release:test //tools/toolchain:test //distribution/docker:test //tools/action:test
      - name: Build the complete candidate tree
        id: candidate
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node tools/release/release-candidate.mjs prepare --version "${VERSION}" --out-dir "${RUNNER_TEMP}/actionlint-action"
      - name: Select the candidate for packaging
        env: { CANDIDATE: "${{ steps.candidate.outputs.candidate }}" }
        run: git checkout --detach "${CANDIDATE}"
      - uses: $/.github/actions/setup-pandoc
      - run: run make:man/actionlint.1
      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Build archives and distribution manifests without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: { version-file: .tool-versions, args: "release --clean --skip=publish --release-notes=${{ runner.temp }}/release-notes.md" }
        env:
          COMMIT_USER: ${{ vars.COMMIT_USER }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
      - name: Preserve the exact release assets
        run: |
          node tools/release/release-assets.mjs collect "${RUNNER_TEMP}/actionlint-action/assets"
          cp "${RUNNER_TEMP}/release-notes.md" "${RUNNER_TEMP}/actionlint-action/release-notes.md"
      - name: Write the PyPI wheels beside the release archives
        run: |
          {
            echo "PYPI_ASSETS=${RUNNER_TEMP}/actionlint-action/assets"
            echo "PYPI_OUT=${RUNNER_TEMP}/actionlint-action/assets"
          } >> "${GITHUB_ENV}"
      - *PypiWheels
      - uses: &Upload actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: prepared-release, path: "${{ runner.temp }}/actionlint-action", if-no-files-found: error }
  nix:
    needs: prepare
    uses: $/.github/workflows/nix.yml
    with: { tag: "v${{ inputs.version }}" }
  action:
    name: Candidate Action (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux_amd64, extension: tar.gz, suffix: "" }
          - { os: macos-latest, platform: darwin_arm64, extension: tar.gz, suffix: "" }
          - { os: windows-latest, platform: windows_amd64, extension: zip, suffix: .exe }
    steps:
      - uses: *Checkout
        with: { ref: "${{ needs.prepare.outputs.source }}", fetch-depth: 0, persist-credentials: false }
      - uses: &SetupNode actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: &Node24 { node-version: "24", package-manager-cache: false }
      - uses: &Download actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: prepared-release, path: "${{ runner.temp }}/actionlint-action" }
      - name: Materialize the normal version tag and verified binary
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          assets="${RUNNER_TEMP}/actionlint-action/assets"
          git bundle verify "${assets}/release-candidate.bundle"
          git fetch --no-tags "${assets}/release-candidate.bundle" "refs/actionlint/candidates/v${VERSION}:refs/tags/v${VERSION}"
          tag_commit="$(git rev-parse "refs/tags/v${VERSION}^{commit}")"
          test "${tag_commit}" = "${CANDIDATE}"
          mkdir .actionlint-action-candidate
          git archive "v${VERSION}" | tar -x -C .actionlint-action-candidate
          (cd .actionlint-action-candidate && sha256sum --check SHA256SUMS)
          (cd "${assets}" && sha256sum --check "actionlint_${VERSION}_checksums.txt")
          archive="${assets}/actionlint_${VERSION}_${PLATFORM}.${EXTENSION}"
          binary_dir="${RUNNER_TEMP}/candidate-binary"
          mkdir "${binary_dir}"
          if [[ "${EXTENSION}" == zip ]]; then
            unzip -q "${archive}" -d "${binary_dir}"
          else
            tar -xz -C "${binary_dir}" < "${archive}"
          fi
          echo "ACTIONLINT_ACTION_BINARY=${binary_dir}/actionlint${BINARY_SUFFIX}" >> "${GITHUB_ENV}"
      - name: Test the packaged entrypoint, published plugin and GitHub cache
        uses: $/.github/actions/test-action
        with: { action-directory: .actionlint-action-candidate, binary: "${{ env.ACTIONLINT_ACTION_BINARY }}" }
      - name: Exercise the candidate through the real runner
        id: smoke
        # ./ loads the candidate tree generated during this job.
        uses: ./.actionlint-action-candidate
        with: { files: testdata/ok/minimal.yaml, format: json }
      - name: Verify runner outputs and exported actionlint
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit-code }}
          RESULT: ${{ steps.smoke.outputs.result }}
          PROBLEM_COUNT: ${{ steps.smoke.outputs.problem-count }}
          OUTPUT: ${{ steps.smoke.outputs.output }}
        run: |
          node tools/action/check-action-outputs.mjs
          actionlint -version
      - name: Verify Windows command resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          actionlint -version
          exit $LASTEXITCODE
      - name: Run the prepared Windows x86-64 wheel
        if: runner.os == 'Windows'
        uses: $/.github/actions/pypi-wheels
        with: { version: "${{ inputs.version }}", out-dir: "${{ runner.temp }}/actionlint-action/assets", smoke: win_amd64 }
  container:
    name: Build and test candidate container (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: cli, asset: actionlint-container }
          - { target: action, asset: actionlint-action-container }
    env: { CONTAINER_ASSET: "${{ matrix.asset }}", CONTAINER_TARGET: "${{ matrix.target }}" }
    steps:
      - uses: *Checkout
        with: { ref: "${{ needs.prepare.outputs.source }}", fetch-depth: 0, persist-credentials: false }
      - uses: *Download
        with: { name: prepared-release, path: "${{ runner.temp }}/actionlint-action" }
      - name: Select the exact candidate tree
        env: { CANDIDATE: "${{ needs.prepare.outputs.candidate }}" }
        run: |
          git fetch --no-tags "${RUNNER_TEMP}/actionlint-action/assets/release-candidate.bundle" "refs/actionlint/candidates/v${VERSION}"
          fetched_commit="$(git rev-parse FETCH_HEAD)"
          test "${fetched_commit}" = "${CANDIDATE}"
          git checkout --detach "${CANDIDATE}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build a portable multi-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          build-args: ACTIONLINT_VER=${{ inputs.version }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.asset }}_${{ inputs.version }}.tar
          sbom: true
          provenance: mode=max
          tags: actionlint:candidate-${{ matrix.target }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.candidate }}
      - name: Record the prepared image digest before immutable tagging
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
        run: |
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/${CONTAINER_ASSET}_${VERSION}.digest"
      - name: Test both platforms from the stored OCI archive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          for arch in amd64 arm64; do
            image="actionlint:candidate-${CONTAINER_TARGET}-${arch}"
            skopeo --override-os linux --override-arch "${arch}" copy \
              "oci-archive:${RUNNER_TEMP}/${CONTAINER_ASSET}_${VERSION}.tar" "docker-daemon:${image}"
            if [[ "${CONTAINER_TARGET}" == action ]]; then
              bash distribution/docker/test-docker-action.bash "${image}" "linux/${arch}"
            else
              bash distribution/docker/test-docker-ruff.bash "${image}" "linux/${arch}"
              bash distribution/docker/test-docker-plugins.bash "${image}" "linux/${arch}"
              docker run --rm --platform "linux/${arch}" --mount type=bind,source="${PWD}",target=/w \
                "${image}" testdata/ok/minimal.yaml
              status=0
              docker run --rm --platform "linux/${arch}" --mount type=bind,source="${PWD}",target=/w \
                "${image}" testdata/err/one_error.yaml || status=$?
              test "${status}" = 1
            fi
          done
      - uses: *Upload
        with:
          name: prepared-container-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/${{ matrix.asset }}_${{ inputs.version }}.tar
            ${{ runner.temp }}/${{ matrix.asset }}_${{ inputs.version }}.digest
          if-no-files-found: error
          compression-level: 0
  manifest:
    name: Record the validated release candidate
    needs: [prepare, nix, action, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: *Checkout
        with: { ref: "${{ needs.prepare.outputs.source }}", fetch-depth: 0, persist-credentials: false }
      - uses: *SetupNode
        with: *Node24
      - uses: *Download
        with: { name: prepared-release, path: "${{ runner.temp }}/actionlint-action" }
      - uses: *Download
        with: { pattern: prepared-container-*, merge-multiple: true, path: "${{ runner.temp }}/actionlint-action/assets" }
      - name: Record every tested asset and candidate commit
        env: { SOURCE: "${{ needs.prepare.outputs.source }}", CANDIDATE: "${{ needs.prepare.outputs.candidate }}" }
        run: |
          assets="${RUNNER_TEMP}/actionlint-action/assets"
          git fetch --no-tags "${assets}/release-candidate.bundle" "refs/actionlint/candidates/v${VERSION}"
          node tools/release/release-candidate.mjs manifest --version "${VERSION}" --directory "${assets}" --source "${SOURCE}" --candidate "${CANDIDATE}"
      - name: Preserve the manifest independently of the editable draft
        uses: *Upload
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actionlint-action/assets/release-candidate.json
          if-no-files-found: error
          retention-days: 90
  draft:
    name: Store the validated release draft
    needs: [prepare, manifest]
    if: ${{ !inputs.validation-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: *Checkout
        with: { ref: "${{ needs.prepare.outputs.source }}", fetch-depth: 0, persist-credentials: false }
      - uses: *Download
        with: { name: prepared-release, path: "${{ runner.temp }}/actionlint-action" }
      - uses: *Download
        with: { pattern: prepared-container-*, merge-multiple: true, path: "${{ runner.temp }}/actionlint-action/assets" }
      - uses: *Download
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actionlint-action/assets
      - name: Create the draft without publishing a version tag
        env: { GH_TOKEN: "${{ github.token }}", SOURCE: "${{ needs.prepare.outputs.source }}" }
        run: |
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo '::error::A release or draft already exists. Inspect it before preparing another candidate.'
            exit 1
          fi
          remote_tag="$(git ls-remote origin "refs/tags/v${VERSION}")"
          test -z "${remote_tag}"
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft --target "${SOURCE}" \
            --title "v${VERSION}" --notes-file "${RUNNER_TEMP}/actionlint-action/release-notes.md"
          gh release upload "v${VERSION}" --repo "${GITHUB_REPOSITORY}" "${RUNNER_TEMP}/actionlint-action/assets/"*
          remote_tag="$(git ls-remote origin "refs/tags/v${VERSION}")"
          test -z "${remote_tag}"
          printf 'Prepared **v%s**. Promote the validated draft with:\n\n    node tools/release/release-candidate.mjs promote --version %s --run %s\n' \
            "${VERSION}" "${VERSION}" "${GITHUB_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
