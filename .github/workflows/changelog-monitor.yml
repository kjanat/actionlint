name: GitHub Changelog monitor
on:
  schedule: [cron: "17 6 * * *"]
  workflow_dispatch:
    inputs:
      lookback-days:
        description: Only report entries published within this many days
        required: false
        default: "30"
      max-issues:
        description: Maximum number of issues opened per run
        required: false
        default: "10"

concurrency:
  group: github-changelog-monitor
  cancel-in-progress: false
  queue: single

permissions:
  contents: read

env:
  MISE_CACHE_DIR: ${{ github.workspace }}-mise/cache
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CHANGELOG_LABEL: github-changelog

jobs:
  monitor:
    if: github.repository_owner == 'kjanat' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read }
    env: { MISE_ENABLE_TOOLS: "bun,node", BUN_INSTALL_CACHE_DIR: "${{ github.workspace }}-mise/cache/bun" }
    outputs:
      drafts: ${{ steps.monitor.outputs.drafts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('bun.lock', '.mise/locks/**') }}"
          cache_save_post: true
          monorepo: false
          add_shims_to_path: false
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the workspace changelog package
        run: bun run --filter @kjlint/changelog-rss build
      - name: Collect new Actions changelog entries
        id: monitor
        uses: $/.github/actions/changelog-monitor
        with:
          token: ${{ github.token }}
          lookback-days: ${{ inputs.lookback-days || '30' }}
          max-issues: ${{ inputs.max-issues || '10' }}
  publish:
    needs: monitor
    if: needs.monitor.outputs.drafts != '' && needs.monitor.outputs.drafts != '[]'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: kjanat/beepboop/actions/token@b1beb87ed2769aed465dfa68705cf42cd2613b99 # v1
        id: beepboop
        with: { permission-contents: read, permission-issues: write }
      - name: Open issues for the collected changelog entries
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DRAFTS: ${{ needs.monitor.outputs.drafts }}
          MAX_ISSUES: ${{ inputs.max-issues || '10' }}
        with:
          github-token: ${{ steps.beepboop.outputs.token }}
          retries: 3
          script: |
            const drafts = JSON.parse(process.env.DRAFTS)
            const limit = Number(process.env.MAX_ISSUES)
            if (!Array.isArray(drafts) || !Number.isSafeInteger(limit) || limit <= 0 || drafts.length > limit) {
              throw new Error('Invalid changelog issue list')
            }
            const publications = []
            const marker = /<!-- github-changelog-guid: (\S+) -->/g
            for (const draft of drafts) {
              if (draft === null || typeof draft !== 'object' || typeof draft.title !== 'string' ||
                  typeof draft.body !== 'string' || draft.title.length === 0 || draft.title.length > 256 ||
                  draft.body.length > 65536) {
                throw new Error('Invalid changelog issue title or body')
              }
              const guids = Array.from(draft.body.matchAll(marker), match => match[1])
              if (guids.length !== 1) throw new Error('Invalid changelog GUID marker')
              publications.push({ ...draft, guid: guids[0] })
            }
            const label = process.env.CHANGELOG_LABEL
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', labels: label, per_page: 100,
            })
            const reported = new Set(issues.flatMap(issue =>
              typeof issue.body === 'string' ? Array.from(issue.body.matchAll(marker), match => match[1]) : []))
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch (error) {
              if (error?.status !== 404) throw error
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: '2088FF',
                description: 'GitHub Actions changelog entries' })
            }
            const urls = []
            for (const draft of publications) {
              if (reported.has(draft.guid)) continue
              const { data } = await github.rest.issues.create({ ...context.repo,
                title: draft.title, body: draft.body, labels: [label] })
              reported.add(draft.guid)
              urls.push(data.html_url)
            }
            core.setOutput('issues-created', urls.length)
            core.setOutput('issue-urls', urls.join('\n'))
            await core.summary.addHeading('GitHub Changelog monitor', 3).addList(urls).write()
