name: Pages

on:
  push: { branches: [main, master] }
  workflow_dispatch: null

permissions: { contents: read, pages: write, id-token: write }

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: $/.github/actions/setup-pandoc
      - uses: kjanat/runner@6e752d37c4b3de6bda86c89b2f5bc487097425cd # master
        with: { version: "0.25" } # 0.26.0 cannot resolve make targets under --dir
      - name: Install JavaScript dependencies
        run: runner install --frozen
      - name: Build command manual
        run: run make:man
      - name: Build and test playground
        run: run --dir playground -s make:build make:test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with: { path: playground/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {
      name: github-pages,
      url: "${{ steps.deployment.outputs.page_url }}",
    }
    steps: [
      {
        name: Deploy to GitHub Pages,
        id: deployment,
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346, # v5.0.1
      },
    ] # v5
