name: Generate
on:
  push:
    paths: &paths
      - .github/workflows/generate.yaml
      - scripts/generate-availability/main.go
      - scripts/generate-popular-actions/main.go
      - scripts/generate-popular-actions/popular_actions.json
      - scripts/generate-webhook-events/main.go
    branches: [main, master]
    tags-ignore: ["*"]
  pull_request:
    paths: *paths
  schedule:
    # Every Saturday 10:21 in JST
    - cron: "21 1 * * 6"
  workflow_dispatch:

jobs:
  freshness:
    name: Generated files match their generators
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - run: go generate
      - run: git diff --exit-code -- popular_actions.go all_webhooks.go availability.go
  go-generate:
    if: github.event_name != 'pull_request' && github.repository_owner == 'kjanat'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod }
      - name: Check new release on GitHub
        run: |
          set -euo pipefail
          # The detector exits 2 when a tracked action has a new major.
          status=0
          releases="$(go run ./scripts/generate-popular-actions -d)" || status=$?
          if [[ -n "${releases}" ]]; then
            printf '%s\n' "${releases}"
          fi
          if [[ "${status}" -eq 2 ]]; then
            echo '::notice title=New major releases::A tracked action has a new major. See the job summary.'
            cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ## New major releases

          Move each version into the tags list and bump next in
          scripts/generate-popular-actions/popular_actions.json.

          SUMMARY
            printf '%s\n' "${releases}" >> "${GITHUB_STEP_SUMMARY}"
          elif [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi
      - run: go generate
      - run: |
          if git diff-files --quiet; then
            echo "pr=false" >> "${GITHUB_OUTPUT}"
          else
            git diff
            echo "pr=true" >> "${GITHUB_OUTPUT}"
          fi
        id: diff
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: "ci/${{ github.run_id }}"
          commit-message: "update generated files by `go generate` on CI"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "Update generated files by CI"
          body: |
            This PR updates some generated files to the latest by running `go generate`.
            This PR was created by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) automatically.
            List of workflow runs is [here](${{ github.server_url }}/${{ github.repository }}/actions/workflows/generate.yaml).
          assignees: ${{ github.repository_owner }}
        if: ${{ steps.diff.outputs.pr == 'true' }}
