name: ShellCheck versions
on:
  schedule: [cron: "47 3 * * 1"]
  workflow_dispatch:

concurrency:
  group: shellcheck-version-lifecycle
  cancel-in-progress: false
  queue: single

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    if: github.repository_owner == 'kjanat' && contains(fromJSON('["main", "master"]'), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - parallel:
          - name: Check ShellCheck versions
            id: versions
            uses: $/.github/actions/shellcheck-versions
            with: { update-files: true }
          - name: Get default branch name
            run: base="$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')"; echo "base=${base}" >> "${GITHUB_ENV}"
      - name: Create or update the go-shellcheck bump
        id: bump
        if: steps.versions.outputs.files-updated == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ env.base }}
          branch: ci/go-shellcheck-version
          delete-branch: true
          add-paths: |
            .pre-commit-hooks.yaml
            docs/usage.md
            scripts/bump-version/targets.go
          commit-message: "Bump go-shellcheck to ${{ steps.versions.outputs.go-shellcheck-version }}"
          title: "Bump go-shellcheck to ${{ steps.versions.outputs.go-shellcheck-version }}"
          body: |
            Updates the pinned go-shellcheck dependency from `${{ steps.versions.outputs.pinned-go-shellcheck-version }}` to `${{ steps.versions.outputs.go-shellcheck-version }}`.

            The new go-shellcheck release embeds ShellCheck `${{ steps.versions.outputs.embedded-shellcheck-version }}`. Latest upstream ShellCheck: `${{ steps.versions.outputs.shellcheck-version }}`.

            Created by the [ShellCheck version lifecycle workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/shellcheck-versions.yaml).
          labels: |
            area:ci
            dependencies
          assignees: ${{ github.repository_owner }}
      - name: Reconcile upstream ShellCheck tracking issue
        if: ${{ always() && steps.versions.outcome == 'success' && steps.bump.outcome != 'failure' && steps.bump.outcome != 'cancelled' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUMP_PR_URL: ${{ steps.bump.outputs.pull-request-url }}
          EMBEDDED_SHELLCHECK_VERSION: ${{ steps.versions.outputs.embedded-shellcheck-version }}
          GO_SHELLCHECK_LAGGING: ${{ steps.versions.outputs.wrapper-lagging }}
          GO_SHELLCHECK_VERSION: ${{ steps.versions.outputs.go-shellcheck-version }}
          SHELLCHECK_VERSION: ${{ steps.versions.outputs.shellcheck-version }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const modulePath = `${process.env.GITHUB_WORKSPACE}/.github/actions/shellcheck-versions/reconcile-shellcheck-tracking-issue.mjs`
            const { default: run } = await import(modulePath)
            await run({ github, context, core, exec, glob, io })
