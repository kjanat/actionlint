name: autofix.ci
on:
  push: { branches: [main, master] }
  pull_request:
jobs:
  autofix:
    runs-on: ubuntu-latest
    if: github.event.pull_request.stack == null
    steps:
      - uses: actions/checkout@v7
      # Without this action, dprint has to recompile the wasm plugins each time the action runs,
      # which is often, and wastes time, energy, and sanity.
      - uses: kjanat/install-dprint@v2
      - { uses: actions/setup-go@v7, with: { go-version: "1.26" } }
      - name: x/tools/go/analysis modernize
        run: go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix ./...
      - name: format the code
        # autofix-ci will fail if the .github directory is touched
        run: dprint fmt --allow-no-files --diff --excludes .github
      - uses: autofix-ci/action@v1
