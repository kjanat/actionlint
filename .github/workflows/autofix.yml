name: autofix.ci
on:
  push:
    branches: [master]
    paths: &FormatPaths
      - "**/*.go"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.toml"
      - "**/*.md"
      - "**/*.ts"
      - "**/*.mts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.html"
      - "**/*.bash"
      - "**/*.sh"
      - "**/*.ps1"
      - "Dockerfile"
      - "Dockerfile.*"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "!testdata/**"
      - "!**/testdata/**"
      - "!docs/releases/**"
      - "!man/actionlint.1.md"
      - "!.github/**"
      - ".github/workflows/autofix.yml"
  pull_request:
    paths: *FormatPaths

permissions: { contents: read }

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Test autofix change tracking
        run: bash tools/ci/test-autofix-step.bash
      - name: Select generators affected by this change
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            base=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          elif [[ "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git hash-object -w -t tree /dev/null)
          else
            base=${BASE_SHA}
          fi
          bash tools/ci/autofix-inputs.bash "${base}" "${HEAD_SHA}"
      # Without this action, dprint has to recompile the wasm plugins each time the action runs,
      # which is often, and wastes time, energy, and sanity.
      - uses: kjanat/install-dprint@c2cdca92154b44b2a2c15222d25d91d1cddfca1b # v2
      - { uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e, with: { go-version-file: go.mod } } # v7
      - name: x/tools/go/analysis modernize
        id: modernize
        run: bash tools/ci/autofix-step.bash go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix ./...
      - name: Regenerate the configuration schema
        id: schema
        run: bash tools/ci/autofix-step.bash go generate -run generate-config-schema
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.inputs.outputs.tables == 'true'
        with: { node-version-file: .node-version, package-manager-cache: false }
      - name: Install catalogue generator dependencies
        if: steps.inputs.outputs.tables == 'true'
        run: npm ci --ignore-scripts
      - name: Regenerate affected Go tables
        id: tables
        if: steps.inputs.outputs.tables == 'true'
        run: bash tools/ci/autofix-step.bash go generate -skip generate-config-schema
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
        with: { cache: true, auto_update: true }
      - name: Refresh the affected README demo
        id: readme
        if: steps.inputs.outputs.readme == 'true'
        run: bash tools/ci/autofix-step.bash go run ./internal/documentation/check-readme -fix ./README.md
        env: { GITHUB_TOKEN: "${{ github.token }}" }
      - name: format the code
        id: format
        # autofix-ci will fail if the .github directory is touched
        run: bash tools/ci/autofix-step.bash dprint fmt --allow-no-files --diff --excludes .github
      - name: Describe applied fixes
        id: fixes
        env:
          MODERNIZE_CHANGED: ${{ steps.modernize.outputs.changed }}
          SCHEMA_CHANGED: ${{ steps.schema.outputs.changed }}
          TABLES_CHANGED: ${{ steps.tables.outputs.changed }}
          README_CHANGED: ${{ steps.readme.outputs.changed }}
          FORMAT_CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          changes=()
          if [[ "${MODERNIZE_CHANGED}" == true ]]; then changes+=('modernize Go'); fi
          if [[ "${SCHEMA_CHANGED}" == true ]]; then changes+=('regenerate configuration schema'); fi
          if [[ "${TABLES_CHANGED}" == true ]]; then changes+=('regenerate Go tables'); fi
          if [[ "${README_CHANGED}" == true ]]; then changes+=('refresh README demo'); fi
          if [[ "${FORMAT_CHANGED}" == true ]]; then changes+=('format code'); fi
          if (( ${#changes[@]} )); then
            printf -v description '%s, ' "${changes[@]}"
            printf 'description=%s\n' "${description%, }" >> "${GITHUB_OUTPUT}"
          fi
      - name: Check fixes for stacked pull requests
        if: github.event.pull_request.stack != null
        run: git -c core.fileMode=false add --all;
          git diff --cached --exit-code
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
        if: github.event.pull_request.stack == null && steps.fixes.outputs.description != ''
        with:
          comment: "Applied fixes: ${{ steps.fixes.outputs.description }}. Please review the generated commit."
          commit-message: "chore: ${{ steps.fixes.outputs.description }}"
          fail-fast: ${{ github.event_name == 'pull_request' }}
