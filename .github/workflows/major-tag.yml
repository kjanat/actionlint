name: Major tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Source release tag (vX.Y.Z) whose bundled Action the major tag should follow"
        required: true
        type: string

permissions:
  contents: write

jobs:
  move:
    name: Move major tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Validate and move major tag
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force --tags origin
          source="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          sha="$(git rev-parse "refs/tags/action-${TAG}^{commit}")"
          test "$(git rev-parse "${sha}^")" = "${source}"
          git cat-file -e "${sha}:dist/main.mjs"
          major="${TAG%%.*}"
          latest="$(git tag --list "${major}.*.*" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          test "${TAG}" = "${latest}"
          git push --force origin "${sha}:refs/tags/${major}"
