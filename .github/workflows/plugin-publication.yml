name: Publish example plugins

env: { MISE_CACHE_DIR: "${{ github.workspace }}-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }

on:
  push:
    tags: ["v*-plugins.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { MISE_ENABLE_TOOLS: "bun" }
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kjanat/actionlint-registry
          ref: 0088741b3bbd0eab844207e63d70b2373c0455e6
          path: registry-client
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.github/workflows/*.yml', '.mise/locks/**') }}"
          monorepo: false
          add_shims_to_path: false
      - name: Install registry tooling
        run: bun install --cwd registry-client --frozen-lockfile --filter @kjanat-actionlint/registry-tools
      - name: Wait for the release and submit its plugin manifests
        shell: bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_REPOSITORY: ${{ github.repository }}
          PLUGIN_TAG: ${{ github.ref_name }}
          PLUGIN_KIND: manifest
        run: |
          for (( attempt = 0; attempt < 60; attempt++ )); do
            if gh api "repos/${PLUGIN_REPOSITORY}/releases/tags/${PLUGIN_TAG}" > release.json && jq -e '.immutable == true and .draft == false' release.json; then break; fi
            sleep 5
          done
          jq -e '.immutable == true and .draft == false' release.json
          jq -r '.assets[] | select(.name | test("^actionlint-plugin-.*\\.json$")) | [.name, .digest] | @tsv' release.json > manifests.tsv
          test -s manifests.tsv
          while IFS=$'\t' read -r asset digest; do
            PLUGIN_ASSET="${asset}" PLUGIN_SHA256="${digest#sha256:}" bun registry-client/scripts/cli.ts submit
          done < manifests.tsv
