name: AUR release
run-name: ${{ format('aur {0} {1}', case(github.event_name == 'workflow_dispatch' && inputs.dry-run, 'dry-run', 'publish'), case(github.event_name == 'release', github.event.release.tag_name, inputs.tag)) }}
on:
  release: { types: [published] }
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag to publish (e.g. v1.13.0)", required: true, type: string }
      dry-run: { description: Prepare and print the PKGBUILDs but do not push to the AUR, required: true, default: false, type: boolean }

permissions: { contents: read }

env:
  GO: "1.27"
  RELEASE_TAG: ${{ case(github.event_name == 'release', github.event.release.tag_name, inputs.tag) }}
  DRY_RUN: ${{ inputs.dry-run || 'false' }}

jobs:
  publish:
    name: ${{ format('{0} {1}', case(github.event_name == 'workflow_dispatch' && inputs.dry-run, 'dry-run', 'publish'), matrix.package) }}
    runs-on: ubuntu-latest
    # Serialize per package so a dispatch and a release-published event cannot
    # race each other's push to the same AUR repository.
    concurrency: { group: "aur-publish-${{ matrix.package }}", cancel-in-progress: false }
    strategy:
      fail-fast: false
      matrix:
        package: [actionlint-kjanat, actionlint-kjanat-bin, actionlint-kjanat-git]
    permissions: { contents: read }
    environment: { name: aur, url: "https://aur.archlinux.org/packages/${{ matrix.package }}" }
    steps:
      # The tag's own PKGBUILDs are what describe this release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "refs/tags/${{ env.RELEASE_TAG }}", persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ env.GO }}", check-latest: true }

      # The VCS package's pkgver() runs git describe at build time; stamping the
      # tag's commit here only keeps the AUR web page showing a real version.
      - name: Resolve the tagged commit
        id: commit
        run: |
          set -euo pipefail
          # Assigned first rather than substituted inline: a command
          # substitution inside echo masks git's exit status (SC2312).
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Prepare PKGBUILD
        uses: $/.github/actions/aur-prepare
        with:
          package: ${{ matrix.package }}
          version: ${{ env.RELEASE_TAG }}
          commit: ${{ steps.commit.outputs.sha }}

      - name: Push to the AUR
        if: env.DRY_RUN != 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: aur/${{ matrix.package }}/PKGBUILD
          commit_username: Kaj Kowalski
          commit_email: info@kajkowalski.nl
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ format('Update to {0}', env.RELEASE_TAG) }}
          # The prebuilt package already has per-arch sums injected above, and
          # the VCS package's single git source is checksummed with SKIP. Only
          # the source package has a tarball for updpkgsums to hash.
          updpkgsums: ${{ matrix.package == 'actionlint-kjanat' }}
