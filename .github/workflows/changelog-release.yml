name: Changelog npm release
env: { MISE_CACHE_DIR: "${{ github.workspace }}-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }
run-name: ${{ case(inputs.dry-run, 'Check changelog npm package', 'Publish changelog npm package') }}
on:
  workflow_dispatch:
    inputs:
      dry-run: { description: Build and test without publishing, required: true, default: true, type: boolean }

concurrency: { group: changelog-npm-release, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  publish:
    if: github.repository_owner == 'kjanat' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    environment: { name: npm, url: "${{ steps.publish.outputs.url }}" }
    env: { NPM_CONFIG_PROVENANCE: "${{ !inputs.dry-run }}", MISE_ENABLE_TOOLS: bun }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, registry-url: https://registry.npmjs.org/, package-manager-cache: false }
      - name: Install Bun
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.github/workflows/*.yml', '.mise/locks/**') }}"
          monorepo: false
          add_shims_to_path: false
        env: { MISE_ENABLE_TOOLS: bun }
      - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # v0.28.0
        with: { version-file: .tool-versions }
      - name: Install dependencies, check types and test the changelog package
        run: runner i --no-tools -fs @kjlint/changelog-rss:typecheck @kjlint/changelog-rss:test
      - name: Build and pack the changelog package
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="${RUNNER_TEMP}/changelog-tarball"
          mkdir -p "${out}"
          npm pack --workspace @kjlint/changelog-rss --pack-destination "${out}"
          packed=("${out}"/*.tgz)
          test "${#packed[@]}" -eq 1
          echo "tarball=${packed[0]}" >> "${GITHUB_OUTPUT}"
      - uses: $/.github/actions/npm-publish
        id: publish
        with: { tarball: "${{ steps.pack.outputs.tarball }}", dist-tag: latest, dry-run: "${{ inputs.dry-run }}" }
