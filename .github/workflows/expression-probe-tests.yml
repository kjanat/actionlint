name: Expression probe tests
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  changes:
    uses: $/.github/workflows/ci-changes.yml
    with:
      filters: |
        {
          "shared": [
            ".github/workflows/expression-probe-tests.yml", ".github/workflows/ci-changes.yml", ".github/ci/**",
            ".tool-versions", ".mise.toml"
          ],
          "jobs": {
            "expression-probe": [
              "internal/expression/probe/**", ".github/workflows/expr-conformance-probe.yml", ".node-version", "!internal/expression/probe/**/*.md",
              "!internal/expression/probe/results/**"
            ]
          }
        }
  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['expression-probe']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      - uses: kjanat/runner@b32ea932a1813ae0be44e755c16df9f9f5ca86a4 # v0.28.0
        with: { version-file: .tool-versions }
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with: { install: false, env: false, add_shims_to_path: false }
      - env: { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: run //internal/expression/probe:test
