name: Expression probe tests
env: { MISE_CACHE_DIR: "${{ github.workspace }}-mise/cache", MISE_LOCKED: "1", MISE_TASK_RUN_AUTO_INSTALL: "false" }
on:
  push: { branches: [master] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  changes:
    uses: $/.github/workflows/ci-changes.yml
    with: { profile: expression-probe-tests }
  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['expression-probe']) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env: { MISE_ENABLE_TOOLS: "node,npm,bun,npm:runner-run" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Install the project Node.js and npm versions
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          mise_dir: "${{ github.workspace }}-mise"
          cache: true
          cache_key: "{{default}}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('.mise/locks/**') }}"
          cache_save_post: true
          monorepo: false
          add_shims_to_path: false
        env: { MISE_ENABLE_TOOLS: "node,npm,bun,npm:runner-run" }
      - env: { MISE_TASK_RUN_AUTO_INSTALL: "false" }
        run: run //internal/development/tests/conformance/expressions:test
