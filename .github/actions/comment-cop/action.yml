name: Comment Cop
description: Flag added implementation prose and resolve stale review threads
runs:
  using: composite
  steps:
    - name: Scan added comments and Markdown
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { default: run } = await import(`${process.env.GITHUB_ACTION_PATH}/comment-cop.mjs`);
          await run({ github, context, core });
