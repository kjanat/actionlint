name: GitHub Changelog monitor
description: Collect unreported GitHub Actions changelog entries for a separate issue-publishing job
inputs:
  token:
    description: Token used to read existing issues
    required: true
    default: ${{ github.token }}
  lookback-days:
    description: Only report entries published within this many days
    required: false
    default: "30"
  max-issues:
    description: Maximum number of issues opened per run
    required: false
    default: "10"
outputs:
  drafts:
    description: JSON array of issue titles and bodies
    value: ${{ steps.monitor.outputs.drafts }}
runs:
  using: composite
  steps:
    - name: Collect new Actions changelog entries
      id: monitor
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env: { LOOKBACK_DAYS: "${{ inputs.lookback-days }}", MAX_ISSUES: "${{ inputs.max-issues }}" }
      with:
        github-token: ${{ inputs.token }}
        retries: 3
        script: |
          const load = require('node:module').createRequire(`${process.env.GITHUB_WORKSPACE}/package.json`)
          const { parseFeed, FEED_URL } = load('@kjlint/changelog-rss/feed')
          const { toEntry, reportedGuids, selectEntries, issueTitle, issueBody, LABEL } = load('@kjlint/changelog-rss/action')
          const count = name => {
            const value = process.env[name] || ''
            if (!/^[1-9]\d*$/.test(value) || !Number.isSafeInteger(Number(value))) {
              throw new Error(`${name} must be a positive integer`)
            }
            return Number(value)
          }
          const since = new Date(Date.now() - count('LOOKBACK_DAYS') * 86400000)
          const response = await fetch(FEED_URL, { headers: { accept: 'application/rss+xml, application/xml' } })
          if (!response.ok) throw new Error(`Changelog feed returned HTTP ${response.status}`)
          const entries = parseFeed(await response.text()).items.map(toEntry)
          if (entries.length === 0) throw new Error('Changelog feed contains no entries')
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            ...context.repo, state: 'all', labels: process.env.CHANGELOG_LABEL || LABEL, per_page: 100,
          })
          const limit = count('MAX_ISSUES')
          const selected = selectEntries(entries, { reported: reportedGuids(issues), since, limit: entries.length })
          const drafts = []
          for (const entry of selected) {
            const draft = { title: issueTitle(entry), body: issueBody(entry) }
            if (draft.title.length > 256 || draft.body.length > 65536) {
              core.warning(`Skipping ${entry.link}: the issue title or body exceeds GitHub's length limit`)
              continue
            }
            drafts.push(draft)
            if (drafts.length === limit) break
          }
          core.setOutput('drafts', drafts)
