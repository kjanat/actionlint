name: Prepare AUR PKGBUILD
description: Rewrite a checked-in PKGBUILD so it describes a specific release, ready to push to the AUR
inputs:
  package:
    description: AUR package name, matching a directory under distribution/aur/
    required: true
  version:
    description: Release version, with or without a leading v
    required: true
  commit:
    description: Commit the release tag points at; required only for the -git package
    required: false
    default: ""
  repository:
    description: Repository to read the release checksums manifest from
    required: false
    default: ${{ github.repository }}
  token:
    description: Token used to download the release checksums manifest
    required: false
    default: ${{ github.token }}
  aur-dir:
    description: Directory holding the per-package PKGBUILD directories
    required: false
    default: ${{ github.workspace }}/distribution/aur
runs:
  using: composite
  steps:
    # Self-contained module: runs from the action directory, and invisible to
    # ./... at the repository root because the go tool skips dot-directories.
    - name: Rewrite PKGBUILD
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_AUR_DIR: ${{ inputs.aur-dir }}
      run: go run .
