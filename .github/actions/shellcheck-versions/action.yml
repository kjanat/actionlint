name: Check ShellCheck versions
description: Compare ShellCheck, go-shellcheck, and the version pinned by actionlint
inputs:
  token:
    description: Token used to read upstream GitHub releases
    required: true
    default: ${{ github.token }}
  update-files:
    description: Update repository files when the go-shellcheck pin is outdated
    required: false
    default: "false"
  fail-on-outdated:
    description: Fail when the pinned go-shellcheck version is outdated
    required: false
    default: "false"
outputs:
  verdict:
    description: Combined dependency-pin and wrapper status
    value: ${{ steps.check.outputs.verdict }}
  shellcheck-version:
    description: Latest stable ShellCheck release
    value: ${{ steps.check.outputs.shellcheck-version }}
  go-shellcheck-version:
    description: Latest stable go-shellcheck release
    value: ${{ steps.check.outputs.go-shellcheck-version }}
  embedded-shellcheck-version:
    description: ShellCheck version embedded by the latest go-shellcheck release
    value: ${{ steps.check.outputs.embedded-shellcheck-version }}
  pinned-go-shellcheck-version:
    description: go-shellcheck version currently pinned by actionlint
    value: ${{ steps.check.outputs.pinned-go-shellcheck-version }}
  pinned-outdated:
    description: Whether actionlint's go-shellcheck pin is outdated
    value: ${{ steps.check.outputs.pinned-outdated }}
  wrapper-lagging:
    description: Whether go-shellcheck embeds an older ShellCheck release
    value: ${{ steps.check.outputs.wrapper-lagging }}
  files-updated:
    description: Whether this invocation updated the pinned version files
    value: ${{ steps.check.outputs.files-updated }}
runs:
  using: composite
  steps:
    - name: Compare ShellCheck versions
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env: { UPDATE_FILES: "${{ inputs.update-files }}", FAIL_ON_OUTDATED: "${{ inputs.fail-on-outdated }}" }
      with:
        github-token: ${{ inputs.token }}
        retries: 3
        script: |
          const { default: run } = await import(`${process.env.GITHUB_ACTION_PATH}/shellcheck-version-lifecycle.mjs`)
          await run({ github, context, core, exec, glob, io })
