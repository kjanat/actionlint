name: Check ShellCheck versions
description: Compare ShellCheck, rshellcheck, and the installer version pinned by actionlint
inputs:
  token:
    description: Token used to read upstream GitHub releases
    required: true
    default: ${{ github.token }}
  update-files:
    description: Update repository files when the rshellcheck pin is outdated
    required: false
    default: "false"
  fail-on-outdated:
    description: Fail when the pinned rshellcheck version is outdated
    required: false
    default: "false"
outputs:
  verdict:
    description: Combined dependency-pin and port status
    value: ${{ steps.check.outputs.verdict }}
  shellcheck-version:
    description: Latest stable ShellCheck release
    value: ${{ steps.check.outputs.shellcheck-version }}
  rshellcheck-version:
    description: Latest stable rshellcheck release, which ports the ShellCheck release of the same version
    value: ${{ steps.check.outputs.rshellcheck-version }}
  pinned-rshellcheck-version:
    description: rshellcheck installer version currently pinned by actionlint
    value: ${{ steps.check.outputs.pinned-rshellcheck-version }}
  pinned-outdated:
    description: Whether actionlint's rshellcheck pin is outdated
    value: ${{ steps.check.outputs.pinned-outdated }}
  port-lagging:
    description: Whether the latest rshellcheck release ports an older ShellCheck release than the latest
    value: ${{ steps.check.outputs.port-lagging }}
  files-updated:
    description: Whether this invocation updated the pinned version files
    value: ${{ steps.check.outputs.files-updated }}
runs:
  using: composite
  steps:
    - name: Compare ShellCheck versions
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env: { UPDATE_FILES: "${{ inputs.update-files }}", FAIL_ON_OUTDATED: "${{ inputs.fail-on-outdated }}" }
      with:
        github-token: ${{ inputs.token }}
        retries: 3
        script: |
          const { default: run } = await import(`${process.env.GITHUB_ACTION_PATH}/shellcheck-version-lifecycle.mjs`)
          await run({ github, context, core, exec, glob, io })
