---
name: Setup ShellCheck
description: Install a pinned ShellCheck release, verified against its GitHub release asset checksum.
inputs:
  shellcheck-version:
    description: ShellCheck version to install (e.g., 0.11.0 or v0.11.0), or latest. Requires GitHub release asset SHA-256 checksums.
    required: false
    default: "0.11.0"
  update-path:
    description: Add the installed binaries to the PATH.
    required: false
    default: "true"
  token:
    description: Token used to read and download the ShellCheck release.
    default: "${{ github.token }}"
outputs:
  shellcheck-path:
    description: Path to the installed ShellCheck binary.
    value: ${{ steps.install.outputs.shellcheck-path }}
runs:
  using: composite
  steps:
    - name: Resolve ShellCheck version
      id: prepare
      shell: bash
      env:
        GH_REPO: koalaman/shellcheck
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.shellcheck-version }}
        UPDATE_PATH: ${{ inputs.update-path }}
      run: bash "${GITHUB_ACTION_PATH//\\//}/setup.bash" prepare
    - name: Restore verified ShellCheck archive
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache-dir }}
        key: actionlint-shellcheck-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.tag }}-${{ hashFiles('.github/actions/setup-shellcheck/pinned-release.json') }}
    - name: Verify and install ShellCheck
      id: install
      shell: bash
      env:
        GH_REPO: koalaman/shellcheck
        GH_TOKEN: ${{ inputs.token }}
        UPDATE_PATH: ${{ inputs.update-path }}
        TAG: ${{ steps.prepare.outputs.tag }}
        CACHE_DIR: ${{ steps.prepare.outputs.cache-dir }}
        RELEASE_FILE: ${{ steps.prepare.outputs.release-file }}
      run: bash "${GITHUB_ACTION_PATH//\\//}/setup.bash" install
    - name: Cache verified ShellCheck archive
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache-dir }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
