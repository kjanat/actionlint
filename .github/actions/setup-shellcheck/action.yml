---
name: Setup ShellCheck (Linux)
description: Install a pinned ShellCheck release, verified against its GitHub release asset checksum.
inputs:
  shellcheck-version:
    description: ShellCheck version to install (e.g., 0.11.0 or v0.11.0), or latest.
    required: false
    default: "0.11.0"
  update-path:
    description: Add the installed binaries to the PATH.
    required: false
    default: "true"
  token:
    description: Token used to read and download the ShellCheck release.
    default: "${{ github.token }}"
outputs:
  shellcheck-path:
    description: Path to the installed ShellCheck binary.
    value: ${{ steps.install.outputs.shellcheck-path }}
runs:
  using: composite
  steps:
    - name: Download, verify, and install ShellCheck
      id: install
      shell: bash
      env:
        GH_REPO: koalaman/shellcheck
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.shellcheck-version }}
        UPDATE_PATH: ${{ inputs.update-path }}
      run: |
        source "${GITHUB_ACTION_PATH}/retry.bash"
        if [[ "${RUNNER_OS}" != Linux ]]; then
          echo '::error::setup-shellcheck only supports Linux runners.'
          exit 1
        fi
        case "${RUNNER_ARCH}" in
          X64) arch=x86_64 ;;
          ARM64) arch=aarch64 ;;
          *) echo '::error::Unsupported Linux runner architecture.'; exit 1 ;;
        esac
        case "${UPDATE_PATH}" in
          true|false) ;;
          *) echo '::error::update-path must be true or false.'; exit 1 ;;
        esac

        if [[ "${VERSION}" == latest ]]; then
          release="$(retry gh api "repos/${GH_REPO}/releases/latest")"
        elif [[ "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          release="$(retry gh api "repos/${GH_REPO}/releases/tags/v${VERSION#v}")"
        else
          echo '::error::shellcheck-version must be a release version or latest.'
          exit 1
        fi
        tag="$(jq -r '.tag_name' <<< "${release}")"
        if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo '::error::The release does not have a stable ShellCheck version tag.'
          exit 1
        fi
        asset="shellcheck-${tag}.linux.${arch}.tar.xz"
        digest="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .digest' <<< "${release}")"
        if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo '::error::The release asset is missing a SHA-256 checksum.'
          exit 1
        fi

        install_dir="$(mktemp -d "${RUNNER_TEMP}/shellcheck.XXXXXXXX")"
        archive="${install_dir}/${asset}"
        retry gh release download "${tag}" --pattern "${asset}" --output "${archive}" --clobber
        printf '%s  %s\n' "${digest#sha256:}" "${archive}" | sha256sum --check --status
        tar -xJf "${archive}" -C "${install_dir}" --strip-components=1 "shellcheck-${tag}/shellcheck"
        "${install_dir}/shellcheck" --version
        printf 'shellcheck-path=%s/shellcheck\n' "${install_dir}" >> "${GITHUB_OUTPUT}"
        if [[ "${UPDATE_PATH}" == true ]]; then
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"
        fi
