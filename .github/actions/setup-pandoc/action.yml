name: Setup pandoc (Linux)
description: Install Pandoc from a reviewed release asset SHA-256 pin without GitHub API requests.
runs:
  using: composite
  steps:
    - name: Select pinned Pandoc archive
      id: prepare
      if: runner.os == 'Linux'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/setup.bash" prepare
    - name: Restore Pandoc archive
      id: cache
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache-dir }}
        key: ${{ steps.prepare.outputs.cache-key }}
    - name: Verify and install Pandoc
      if: runner.os == 'Linux'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/setup.bash" install
    - name: Cache verified Pandoc archive
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache-dir }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
