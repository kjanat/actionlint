name: Setup pandoc (Linux)
description: Install a pinned pandoc release, verified against its build provenance attestation.

inputs:
  version:
    description: pandoc release tag to install.
    default: "3.11"
  repo:
    description: GitHub repository to read the release from.
    default: "jgm/pandoc"
  token:
    description: Token used to read the pandoc release and its attestation.
    default: "${{ github.token }}"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_REPO: ${{ inputs.repo }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        encode() {
          local s="$1"
          s="${s//'%'/'%25'}"
          s="${s//$'\r'/'%0D'}"
          s="${s//$'\n'/'%0A'}"
          printf '%s' "$s"
        }
        LATEST_RELEASE="$(gh release view --json name,tagName,url | tee /dev/stderr)"
        LATEST="$(echo "${LATEST_RELEASE}" | jq -r '.tagName')"
        URL="$(echo "${LATEST_RELEASE}" | jq -r '.url')"
        if [[ "${VERSION}" != "${LATEST}" ]]; then
          echo "::warning::The requested pandoc version '$(encode "${VERSION}")' is not the latest release '$(encode "${LATEST}")'. See $(encode "${URL}") for details."
        fi
    - shell: bash
      if: ${{ runner.os == 'Linux' }}
      env:
        GH_REPO: ${{ inputs.repo }}
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        arch="$(dpkg --print-architecture)"
        deb="${RUNNER_TEMP}/pandoc.deb"
        gh release download "${VERSION}" --pattern "pandoc-${VERSION}-1-${arch}.deb" --output "${deb}"
        gh release verify-asset "${VERSION}" "${deb}"
        sudo dpkg --install "${deb}"
