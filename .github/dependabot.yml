# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { "GitHub Actions": { patterns: ["*"] } }
    labels: [dependencies, github-actions]
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    groups: { "Go modules": { patterns: ["*"] } }
    # Renovate updates these modules together with docs/go-forks.md.
    ignore:
      - dependency-name: github.com/kjanat/go-yaml/v4
      - dependency-name: github.com/kjanat/wacogo
      - dependency-name: github.com/kjanat/wazero
      - dependency-name: github.com/kjanat/go-modules
      - dependency-name: github.com/kjanat/go-modules/cm
      - dependency-name: github.com/invopop/jsonschema
      - dependency-name: github.com/pb33f/ordered-map/v2
      - dependency-name: github.com/pb33f/go-yaml
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { “npm modules”: { patterns: ["*"] } }
    ignore:
      - dependency-name: typescript
      # GitHub Actions branding uses Feather 4.28.0.
      - dependency-name: feather-icons
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    groups: { “docker images”: { patterns: ["*"] } }
