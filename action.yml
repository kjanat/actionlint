# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
name: actionlint by @kjanat
description: >-
  Static-check GitHub Actions workflow files with actionlint,
  and ShellCheck.
inputs:
  version:
    description: Exact actionlint release version, optionally prefixed with v. Defaults to this Action's version; overrides version-file.
    required: false
    default: ""
  version-file:
    description: File containing an exact version or a .tool-versions actionlint entry, relative to working-directory.
    required: false
    default: ""
  install-only:
    description: Install actionlint on PATH without analyzing workflows. Requires add-actionlint-to-path.
    required: false
    default: "false"
  plugin-cache:
    description: Restore and save pinned plugin artifacts using GitHub Actions cache. Artifact digests are verified before use.
    required: false
    default: "true"
  files:
    description: >-
      Newline-separated workflow file paths.
      Empty checks every workflow in the repository.
    required: false
    default: ""
  format:
    description: >-
      Output format. Choose github, default, oneline, json, json-lines,
      markdown, or sarif.
    required: false
    default: github
  ignore:
    description: >-
      Newline-separated regular expressions for actionlint errors to ignore.
    required: false
    default: ""
  config-file:
    description: >-
      Path to an actionlint configuration file,
      absolute or relative to working-directory.
    required: false
    default: ""
  config:
    description: >-
      Inline actionlint configuration as YAML or JSON,
      merged over the config file.
    required: false
    default: ""
  disable-tools:
    description: >-
      Tool ids to turn off, separated by newlines or commas, such as shellcheck or ruff.
      A disabled tool runs neither natively nor as a plugin.
    required: false
    default: ""
  shellcheck:
    description: "Deprecated: false is the same as listing shellcheck in disable-tools."
    deprecationMessage: Use disable-tools to turn ShellCheck off.
    required: false
    default: "true"
  ruff:
    description: "Deprecated: false is the same as listing ruff in disable-tools."
    deprecationMessage: Use disable-tools to turn Ruff off.
    required: false
    default: "true"
  pyflakes:
    description: "Deprecated and ignored: Ruff checks Python scripts unless disable-tools lists ruff."
    deprecationMessage: The pyflakes input is ignored; use disable-tools to turn Ruff off.
    required: false
    default: "false"
  add-actionlint-to-path:
    description: Make actionlint available on PATH for subsequent steps in this job.
    required: false
    default: "true"
  working-directory:
    description: Directory to lint, absolute or relative to the repository workspace.
    required: false
    default: .
  output-file:
    description: >-
      Optional repository-relative file to receive the selected output format.
    required: false
    default: ""
  fail-on-error:
    description: >-
      Fail the step when actionlint finds problems.
      Invalid options and fatal errors always fail.
    required: false
    default: "true"
  annotations:
    description: "Emit finding annotations: auto follows format; true enables them; false disables them."
    required: false
    default: auto
  summary:
    description: Add a compact analysis summary to the job summary.
    required: false
    default: "true"
  summary-title:
    description: Optional summary label and text-log label. Without a label, summaries have no title and status logs use the GitHub Action invocation ID.
    required: false
    default: ""
  sarif:
    description: Save a SARIF file alongside the always-written JSON result.
    required: false
    default: "false"
  review:
    description: Post PR review comments and supported fix suggestions on changed lines. Requires pull-requests write permission.
    required: false
    default: "false"
  token:
    description: GitHub token used only when review is enabled.
    required: false
    default: ${{ github.token }}
outputs:
  version:
    description: Installed actionlint release version, without the v prefix.
  exit-code:
    description: >-
      actionlint exit code:
      0 for clean,
      1 for problems,
      2 for invalid options, or
      3 for failure.
  result:
    description: >-
      Result name: success, problems-found, invalid-options, or failure.
  problems-found:
    description: Whether actionlint found one or more problems.
  problem-count:
    description: >-
      Number of problems found, or an empty string if
      actionlint could not complete.
  output:
    description: Complete actionlint output in the selected format.
  output-file:
    description: >-
      Repository-relative output file path,
      or an empty string when output-file was not set.
  result-file:
    description: Absolute path to the versioned analysis result, including partial findings when analysis fails.
  report-sarif:
    description: Absolute path to the SARIF report when requested and analysis completed.
runs: { using: node24, main: action.mjs } # actionlint:ignore action -- action.mjs is generated when building the release bundle.
branding: { icon: check-circle, color: blue }
