#:schema https://www.schemastore.org/golangci-lint.json
#:tombi schema.strict = false
# this breaks in current tombi, something about the schema and tombi is wrong.
# https://golangci-lint.run/jsonschema/golangci.v2.jsonschema.json

version = "2"

[linters]
default = "standard"
enable  = [
  "contextcheck",
  "depguard",
  "exhaustive",
  "dupl",
  "asasalint",
  "asciicheck",
  "bidichk",
  "bodyclose",
  "copyloopvar",
  "dupword",
  "durationcheck",
  "errname",
  "errorlint",
  "exptostd",
  "fatcontext",
  "forbidigo",
  "forcetypeassert",
  "gocheckcompilerdirectives",
  "gocritic",
  "intrange",
  "iotamixing",
  "makezero",
  "mirror",
  "misspell",
  "modernize",
  "nilerr",
  "nilnesserr",
  "noctx",
  "perfsprint",
  "prealloc",
  "predeclared",
  "reassign",
  "recvcheck",
  "unconvert",
  "unparam",
  "usestdlibvars",
  "wastedassign",
  "whitespace"
]

[linters.settings.forbidigo]
analyze-types = true
forbid        = [
  { pattern = '^os\.(Open|OpenFile|ReadDir|ReadFile|Readlink)$', msg = "read through fsread.Reader" },
  { pattern = '^(filepath\.(Walk|WalkDir)|fs\.(ReadFile|ReadDir|WalkDir))$', msg = "walk through fsread.Reader" },
  { pattern = '^fsread\.(Disk|ProbeDir)$', msg = "fsread.Disk and fsread.ProbeDir skip recording; read through fsread.Reader" },
  { pattern = '^invocation\.New(Root|Call|Script)ID$', pkg = '^actionlint\.kjanat\.dev/v2/internal/model/workflows/definition/invocation$', msg = "only the invocation owner registers occurrence IDs" },
]

# Import direction. Each rule applies to every file its globs match, so a
# file must satisfy all matching rules. Deny entries match import-path prefixes.
# Package layering lives in the generated layer table below. The hand-written
# rules here confine external modules and standard packages more narrowly
# than a layer does.

[linters.settings.depguard.rules.yaml-types]
files = [
  "**/internal/checking/constraints/**",
  "**/internal/checking/passes/*.go",
  "**/internal/model/workflows/definition/*.go",
  "**/internal/model/workflows/mappings/*.go",
  "!$test",
]
deny  = [{ pkg = "github.com/kjanat/go-yaml/v4", desc = "parser types stay behind the YAML codec" }]

[linters.settings.depguard.rules.invocation]
files = ["**/internal/model/calls/invocation/*.go", "!$test"]
deny  = [
  { pkg = "os", desc = "the invocation owner has no host capabilities" },
  { pkg = "io", desc = "the invocation owner has no host capabilities" },
  { pkg = "net", desc = "the invocation owner has no host capabilities" },
  { pkg = "syscall", desc = "the invocation owner has no host capabilities" },
  { pkg = "unsafe", desc = "the invocation owner has no host capabilities" },
  { pkg = "crypto/rand", desc = "the invocation owner has no host capabilities" },
  { pkg = "math/rand", desc = "the invocation owner has no host capabilities" },
]

[linters.settings.depguard.rules.tool-providers]
files = ["**/internal/plugins/manifests/**", "!$test"]
deny  = [
  { pkg = "github.com/kjanat/wazero", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
  { pkg = "github.com/kjanat/wacogo", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
]

[linters.settings.depguard.rules.oci-transport]
files = ["$all", "!**/internal/plugins/artifacts/oci/**"]
deny  = [
  { pkg = "github.com/oras-project/oras-go", desc = "oci:// sources are pulled only by internal/plugins/artifacts/oci; everything else reads the artifact Store" },
]

[linters.settings.exhaustive]
default-signifies-exhaustive = false

[linters.settings.staticcheck]
checks = ["all", "-ST1003"]

[linters.exclusions]
generated = "lax"
presets   = ["std-error-handling"]
paths     = [
  # An npm dependency ships Go sources that are not part of this module.
  "node_modules",
]

[[linters.exclusions.rules]]
path    = '_test\.go$|^(\.github|cmd|fuzz|tools)/|^internal/(cli|input/files)/|^internal/development/(generators|tests/(conformance|integration/(documentation|plugins/package-fixture)))/'
text    = "fsread"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '_test\.go$|^internal/model/calls/invocation/'
text    = "occurrence IDs"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/(workspace/(project|session)|config/(config|inspection))\.go$'
text    = "fsread\\.Disk"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/input/files/names/index\.go$'
text    = "fsread\\.ProbeDir"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/development/(generators/files/write_new|tests/support/ruff)\.go$'
text    = 'use of `os\.OpenFile`'
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = "_test\\.go"
linters = ["dupword", "forcetypeassert", "prealloc", "unparam"]

[formatters]
enable = ["gofmt"]

[formatters.exclusions]
paths = ["node_modules"]

[issues]
max-issues-per-linter = 0
max-same-issues       = 0
