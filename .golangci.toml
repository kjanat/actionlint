#:schema https://www.schemastore.org/golangci-lint.json
#:tombi schema.strict = false
# this breaks in current tombi, something about the schema and tombi is wrong.
# https://golangci-lint.run/jsonschema/golangci.v2.jsonschema.json

version = "2"

[linters]
default = "standard"
enable  = [
  "actionlintarch",
  "contextcheck",
  "depguard",
  "exhaustive",
  "dupl",
  "asasalint",
  "asciicheck",
  "bidichk",
  "bodyclose",
  "copyloopvar",
  "dupword",
  "durationcheck",
  "errname",
  "errorlint",
  "exptostd",
  "fatcontext",
  "forbidigo",
  "forcetypeassert",
  "gocheckcompilerdirectives",
  "gocritic",
  "intrange",
  "iotamixing",
  "makezero",
  "mirror",
  "misspell",
  "modernize",
  "nilerr",
  "nilnesserr",
  "noctx",
  "perfsprint",
  "prealloc",
  "predeclared",
  "reassign",
  "recvcheck",
  "unconvert",
  "unparam",
  "usestdlibvars",
  "wastedassign",
  "whitespace"
]

[linters.settings.forbidigo]
analyze-types = true
forbid        = [
  { pattern = '^os\.(Open|OpenFile|ReadDir|ReadFile|Readlink)$', msg = "read through fsread.Reader" },
  { pattern = '^(filepath\.(Walk|WalkDir)|fs\.(ReadFile|ReadDir|WalkDir))$', msg = "walk through fsread.Reader" },
  { pattern = '^fsread\.(Disk|ProbeDir)$', msg = "fsread.Disk and fsread.ProbeDir skip recording; read through fsread.Reader" },
  { pattern = '^invocation\.New(Root|Call|Script)ID$', pkg = '^actionlint\.kjanat\.dev/v2/internal/workflow/invocation$', msg = "only the invocation owner registers occurrence IDs" },
]

# Import direction. Each rule applies to every file its globs match, so a
# file must satisfy all matching rules. Deny entries match import-path prefixes.
# Rules checking transitive dependencies remain in internal/architecture until
# a strict layer table makes them redundant.

[linters.settings.depguard.rules.cli]
files = ["**/internal/cli/**", "!$test"]
deny  = [
  { pkg = "actionlint.kjanat.dev/v2/internal/engine", desc = "the terminal adapter consumes application and presentation contracts" },
  { pkg = "actionlint.kjanat.dev/v2/internal/plugins/component", desc = "the terminal adapter must not construct plugin runtimes" },
  { pkg = "actionlint.kjanat.dev/v2/internal/plugins/core", desc = "the terminal adapter must not construct plugin runtimes" },
]

[linters.settings.depguard.rules.entrypoints]
files = [
  "**/internal/githubaction/**",
  "**/analysis/*.go",
  "**/internal/rulecatalog/check-docs/**",
  "!$test",
]
deny  = [{ pkg = "actionlint.kjanat.dev/v2/internal/engine", desc = "entrypoints use the application boundary" }]

[linters.settings.depguard.rules.engine]
files = ["**/internal/engine/**", "!$test"]
deny  = [
  { pkg = "os/exec", desc = "the engine does not own native process execution" },
  { pkg = "actionlint.kjanat.dev/v2/internal/semantics", desc = "the engine receives semantic checks through built-in composition" },
  { pkg = "actionlint.kjanat.dev/v2/internal/action/validation", desc = "the engine receives semantic checks through built-in composition" },
  { pkg = "actionlint.kjanat.dev/v2/internal/workflow/checks", desc = "the engine receives semantic checks through built-in composition" },
  { pkg = "actionlint.kjanat.dev/v2/internal/workflow/expressions", desc = "the engine receives semantic checks through built-in composition" },
  { pkg = "actionlint.kjanat.dev/v2/internal/workflow/cachepolicy", desc = "the engine receives semantic checks through built-in composition" },
  { pkg = "actionlint.kjanat.dev/v2/internal/workflow/matrix", desc = "the engine receives semantic checks through built-in composition" },
  { pkg = "actionlint.kjanat.dev/v2/internal/workflow/commands", desc = "the engine receives semantic checks through built-in composition" },
]

[linters.settings.depguard.rules.yaml-types]
files = [
  "**/internal/semantics/**",
  "**/internal/engine/*.go",
  "**/internal/workflow/*.go",
  "**/internal/mapping/*.go",
  "!$test",
]
deny  = [{ pkg = "github.com/kjanat/go-yaml/v4", desc = "parser types stay behind the YAML codec" }]

[linters.settings.depguard.rules.integration]
files = ["**/internal/integration/**"]
deny  = [{ pkg = "actionlint.kjanat.dev/v2/internal/engine", desc = "integration suites exercise the application boundary" }]

[linters.settings.depguard.rules.invocation]
files = ["**/internal/workflow/invocation/*.go", "!$test"]
deny  = [
  { pkg = "os", desc = "the invocation owner has no host capabilities" },
  { pkg = "io", desc = "the invocation owner has no host capabilities" },
  { pkg = "net", desc = "the invocation owner has no host capabilities" },
  { pkg = "syscall", desc = "the invocation owner has no host capabilities" },
  { pkg = "unsafe", desc = "the invocation owner has no host capabilities" },
  { pkg = "crypto/rand", desc = "the invocation owner has no host capabilities" },
  { pkg = "math/rand", desc = "the invocation owner has no host capabilities" },
]

[linters.settings.depguard.rules.invocationview]
files     = ["**/internal/invocationview/*.go", "!$test"]
list-mode = "strict"
allow     = [
  "$gostd",
  "actionlint.kjanat.dev/v2/analyzer",
  "actionlint.kjanat.dev/v2/diagnostic",
  "actionlint.kjanat.dev/v2/source",
  "actionlint.kjanat.dev/v2/internal/workflow/invocation",
]

[linters.settings.depguard.rules.tool-providers]
files = ["**/internal/tools/provider/**", "!$test"]
deny  = [
  { pkg = "actionlint.kjanat.dev/v2/internal/config", desc = "configuration reaches providers as typed values from the composition layer" },
  { pkg = "actionlint.kjanat.dev/v2/internal/plugins/component", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
  { pkg = "github.com/kjanat/wazero", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
  { pkg = "github.com/kjanat/wacogo", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
]

[linters.settings.depguard.rules.preparation-profiles]
files = ["**/internal/tools/profile/**", "!$test"]
deny  = [
  { pkg = "actionlint.kjanat.dev/v2/internal/config", desc = "settings reach preparation profiles as typed values from the tool that owns them" },
]

[linters.settings.custom.actionlintarch]
type        = "module"
description = "Check source-derived representation ownership and public API boundaries"

[linters.settings.exhaustive]
default-signifies-exhaustive = false

[linters.settings.staticcheck]
checks = ["all", "-ST1003"]

[linters.exclusions]
generated = "lax"
presets   = ["std-error-handling"]
paths     = [
  # An npm dependency ships Go sources that are not part of this module.
  "node_modules",
]

[[linters.exclusions.rules]]
path    = '_test\.go$|^(\.github|cmd|fuzz|playground|tools)/|^internal/(cli|githubaction|conformance|fsread)/|^internal/(actioncatalog/(generate|metadata)|expression/context/generate|webhook/generate|rulecatalog/check-docs|documentation/check-readme)/'
text    = "fsread"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '_test\.go$|^internal/workflow/invocation/'
text    = "occurrence IDs"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/(workspace/(project|session)|config/(config|inspection))\.go$'
text    = "fsread\\.Disk"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/workflow/names/index\.go$'
text    = "fsread\\.ProbeDir"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/(genfile/write_new|testutil/ruff)\.go$'
text    = 'use of `os\.OpenFile`'
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = "_test\\.go"
linters = ["dupword", "forcetypeassert", "prealloc", "unparam"]

[formatters]
enable = ["gofmt"]

[formatters.exclusions]
paths = ["node_modules"]

[issues]
max-issues-per-linter = 0
max-same-issues       = 0
