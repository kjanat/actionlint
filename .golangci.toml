#:schema https://www.schemastore.org/golangci-lint.json
#:tombi schema.strict = false
# this breaks in current tombi, something about the schema and tombi is wrong.
# https://golangci-lint.run/jsonschema/golangci.v2.jsonschema.json

version = "2"

[linters]
default = "standard"
enable  = [
  "actionlintarch",
  "contextcheck",
  "depguard",
  "exhaustive",
  "dupl",
  "asasalint",
  "asciicheck",
  "bidichk",
  "bodyclose",
  "copyloopvar",
  "dupword",
  "durationcheck",
  "errname",
  "errorlint",
  "exptostd",
  "fatcontext",
  "forbidigo",
  "forcetypeassert",
  "gocheckcompilerdirectives",
  "gocritic",
  "intrange",
  "iotamixing",
  "makezero",
  "mirror",
  "misspell",
  "modernize",
  "nilerr",
  "nilnesserr",
  "noctx",
  "perfsprint",
  "prealloc",
  "predeclared",
  "reassign",
  "recvcheck",
  "unconvert",
  "unparam",
  "usestdlibvars",
  "wastedassign",
  "whitespace"
]

[linters.settings.forbidigo]
analyze-types = true
forbid        = [
  { pattern = '^os\.(Open|OpenFile|ReadDir|ReadFile|Readlink)$', msg = "read through fsread.Reader" },
  { pattern = '^(filepath\.(Walk|WalkDir)|fs\.(ReadFile|ReadDir|WalkDir))$', msg = "walk through fsread.Reader" },
  { pattern = '^fsread\.(Disk|ProbeDir)$', msg = "fsread.Disk and fsread.ProbeDir skip recording; read through fsread.Reader" },
  { pattern = '^invocation\.New(Root|Call|Script)ID$', pkg = '^actionlint\.kjanat\.dev/v2/internal/workflow/invocation$', msg = "only the invocation owner registers occurrence IDs" },
]

# Import direction. Each rule applies to every file its globs match, so a
# file must satisfy all matching rules. Deny entries match import-path prefixes.
# Package layering lives in the generated layer table below. The hand-written
# rules here confine external modules and standard packages more narrowly
# than a layer does.

[linters.settings.depguard.rules.yaml-types]
files = [
  "**/internal/semantics/**",
  "**/internal/engine/*.go",
  "**/internal/workflow/*.go",
  "**/internal/mapping/*.go",
  "!$test",
]
deny  = [{ pkg = "github.com/kjanat/go-yaml/v4", desc = "parser types stay behind the YAML codec" }]

[linters.settings.depguard.rules.invocation]
files = ["**/internal/workflow/invocation/*.go", "!$test"]
deny  = [
  { pkg = "os", desc = "the invocation owner has no host capabilities" },
  { pkg = "io", desc = "the invocation owner has no host capabilities" },
  { pkg = "net", desc = "the invocation owner has no host capabilities" },
  { pkg = "syscall", desc = "the invocation owner has no host capabilities" },
  { pkg = "unsafe", desc = "the invocation owner has no host capabilities" },
  { pkg = "crypto/rand", desc = "the invocation owner has no host capabilities" },
  { pkg = "math/rand", desc = "the invocation owner has no host capabilities" },
]

[linters.settings.depguard.rules.tool-providers]
files = ["**/internal/tools/provider/**", "!$test"]
deny  = [
  { pkg = "github.com/kjanat/wazero", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
  { pkg = "github.com/kjanat/wacogo", desc = "providers are runtime-free; WebAssembly loads behind tools.Context.LoadEngine" },
]

[linters.settings.depguard.rules.oci-transport]
files = ["$all", "!**/internal/plugins/artifact/oci/**"]
deny  = [
  { pkg = "github.com/oras-project/oras-go", desc = "oci:// sources are pulled only by internal/plugins/artifact/oci; everything else reads the artifact Store" },
]

# BEGIN GENERATED LAYER TABLE. Edit tools/layers/layers.toml and run go run ./tools/layers.

# Layer source: The public source contract: files, spans and their identities.
# Imports: itself.
[linters.settings.depguard.rules.layer-source]
files     = [
  "**/source/*.go",
  "!$test",
]
list-mode = "strict"
allow     = [
  "$gostd",
  "actionlint.kjanat.dev/v2/source$",
]
deny      = [
  { pkg = "os/exec", desc = "this layer does not launch processes; process execution belongs to the analyzer host and the layers above it" },
]

[linters.settings.depguard.rules.layer-source-tests]
files     = [
  "**/source/*_test.go",
]
list-mode = "strict"
allow     = [
  "$gostd",
  "actionlint.kjanat.dev/v2/source$",
  "github.com/google/go-cmp$",
  "github.com/google/go-cmp/",
  "golang.org/x/tools$",
  "golang.org/x/tools/",
]

# Layer contract-leaves: Public contracts with no module dependencies. config/report is a value
# contract that imports only the standard library.
# Imports no module package.
[linters.settings.depguard.rules.layer-contract-leaves]
files     = [
  "**/config/report/*.go",
  "**/resolver/*.go",
  "**/rule/*.go",
  "!$test",
]
list-mode = "strict"
allow     = [
  "$gostd",
]
deny      = [
  { pkg = "os/exec", desc = "this layer does not launch processes; process execution belongs to the analyzer host and the layers above it" },
]

# Layer analysis-contracts: The public diagnostic and analyzer contracts. They never import internal
# packages.
# Imports: itself, source, contract-leaves.
[linters.settings.depguard.rules.layer-analysis-contracts]
files     = [
  "**/analyzer/*.go",
  "**/diagnostic/*.go",
  "!$test",
]
list-mode = "strict"
allow     = [
  "$gostd",
  "actionlint.kjanat.dev/v2/analyzer$",
  "actionlint.kjanat.dev/v2/config/report$",
  "actionlint.kjanat.dev/v2/diagnostic$",
  "actionlint.kjanat.dev/v2/resolver$",
  "actionlint.kjanat.dev/v2/rule$",
  "actionlint.kjanat.dev/v2/source$",
]
deny      = [
  { pkg = "os/exec", desc = "this layer does not launch processes; process execution belongs to the analyzer host and the layers above it" },
]

[linters.settings.depguard.rules.layer-analysis-contracts-tests]
files     = [
  "**/analyzer/*_test.go",
  "**/diagnostic/*_test.go",
