#:schema https://www.schemastore.org/golangci-lint.json
# this breaks in current tombi, something about the schema and tombi is wrong.
# https://golangci-lint.run/jsonschema/golangci.v2.jsonschema.json

version = "2"

[linters]
default = "standard"
enable  = [
  "asasalint",
  "asciicheck",
  "bidichk",
  "bodyclose",
  "copyloopvar",
  "dupword",
  "durationcheck",
  "errname",
  "errorlint",
  "exptostd",
  "fatcontext",
  "forbidigo",
  "forcetypeassert",
  "gocheckcompilerdirectives",
  "gocritic",
  "intrange",
  "iotamixing",
  "makezero",
  "mirror",
  "misspell",
  "modernize",
  "nilerr",
  "nilnesserr",
  "noctx",
  "perfsprint",
  "prealloc",
  "predeclared",
  "reassign",
  "recvcheck",
  "unconvert",
  "unparam",
  "usestdlibvars",
  "wastedassign",
  "whitespace"
]

[linters.settings.forbidigo]
forbid = [
  { pattern = '^os\.(Open|OpenFile|ReadDir|ReadFile|Readlink)$', msg = "read through disk in internal/gitrepo/disk.go" },
  { pattern = '^time\.Sleep$', msg = "wait through disk.wait in internal/gitrepo/disk.go" },
  { pattern = '^(io\.ReadAll|zlib\.NewReader)$', msg = "inflate through inflater in internal/gitrepo/inflate.go" },
]

[linters.settings.staticcheck]
checks = ["all", "-ST1003"]

[linters.exclusions]
generated = "lax"
presets   = ["std-error-handling"]
paths     = [
  # An npm dependency ships Go sources that are not part of this module.
  "node_modules",
]

[[linters.exclusions.rules]]
path-except = "^internal/gitrepo/"
linters     = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/gitrepo/(disk|inflate)\.go$|_test\.go$'
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = "_test\\.go"
linters = ["dupword", "forcetypeassert", "prealloc", "unparam"]

[formatters]
enable = ["gofmt"]

[formatters.exclusions]
paths = ["node_modules"]

[issues]
max-issues-per-linter = 0
max-same-issues       = 0
