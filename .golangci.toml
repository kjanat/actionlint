#:schema https://www.schemastore.org/golangci-lint.json
# this breaks in current tombi, something about the schema and tombi is wrong.
# https://golangci-lint.run/jsonschema/golangci.v2.jsonschema.json

version = "2"

[linters]
default = "standard"
enable  = [
  "asasalint",
  "asciicheck",
  "bidichk",
  "bodyclose",
  "copyloopvar",
  "dupword",
  "durationcheck",
  "errname",
  "errorlint",
  "exptostd",
  "fatcontext",
  "forbidigo",
  "forcetypeassert",
  "gocheckcompilerdirectives",
  "gocritic",
  "intrange",
  "iotamixing",
  "makezero",
  "mirror",
  "misspell",
  "modernize",
  "nilerr",
  "nilnesserr",
  "noctx",
  "perfsprint",
  "prealloc",
  "predeclared",
  "reassign",
  "recvcheck",
  "unconvert",
  "unparam",
  "usestdlibvars",
  "wastedassign",
  "whitespace"
]

[linters.settings.forbidigo]
forbid = [
  { pattern = '^os\.(Open|OpenFile|ReadDir|ReadFile|Readlink)$', msg = "read through fsread.Reader" },
  { pattern = '^(filepath\.(Walk|WalkDir)|fs\.(ReadFile|ReadDir|WalkDir))$', msg = "walk through fsread.Reader" },
  { pattern = '^fsread\.(Disk|ProbeDir)$', msg = "fsread.Disk and fsread.ProbeDir skip recording; read through fsread.Reader" },
]

[linters.settings.staticcheck]
checks = ["all", "-ST1003"]

[linters.exclusions]
generated = "lax"
presets   = ["std-error-handling"]
paths     = [
  # An npm dependency ships Go sources that are not part of this module.
  "node_modules",
]

[[linters.exclusions.rules]]
path    = '_test\.go$|^(scripts|\.github|cmd|fuzz|playground)/|^internal/(cli|githubaction|conformance|fsread)/'
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/(engine/(project|analysis_application)|repoconfig/(config|inspection))\.go$'
text    = "fsread\\.Disk"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/workflownames/index\.go$'
text    = "fsread\\.ProbeDir"
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = '^internal/genfile/write_new\.go$'
text    = 'use of `os\.OpenFile`'
linters = ["forbidigo"]

[[linters.exclusions.rules]]
path    = "_test\\.go"
linters = ["dupword", "forcetypeassert", "prealloc", "unparam"]

[formatters]
enable = ["gofmt"]

[formatters.exclusions]
paths = ["node_modules"]

[issues]
max-issues-per-linter = 0
max-same-issues       = 0
