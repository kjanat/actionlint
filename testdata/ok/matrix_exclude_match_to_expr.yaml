on: repository_dispatch

jobs:
  nested-0:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        foo:
          - ${{ fromJSON(github.event.client_payload.matrix) }}
        exclude:
          - foo: bar
    steps:
      - run: echo ${{ matrix.foo.bar }}
  nested-object-1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        foo:
          - bar: ${{ fromJSON(github.event.client_payload.matrix) }}
        exclude:
          - foo:
              bar: ...
    steps:
      - run: echo ${{ matrix.foo.bar }}
  nested-array-1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        foo:
          - ["${{ fromJSON(github.event.client_payload.matrix) }}"]
        exclude:
          - foo: ['...']
    steps:
      - run: echo ${{ matrix.foo[0] }}
