on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: test
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput('foo', 'bar');
      - id: call
        env:
          TEST_OUTPUT: ${{ steps.test.outputs.foo }}
        run: |
          echo "Test output: $TEST_OUTPUT"
