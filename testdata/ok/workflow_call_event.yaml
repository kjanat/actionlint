on:
  workflow_call:
    inputs:
      input0:
        description: 'hello'
        type: string
      input1:
        description: 'with default and required'
        default: 'hello'
        required: false
        type: string
      input2:
        description: 'with default'
        default: 23
        type: number
      input3:
        description: 'with required'
        required: true
        type: boolean
    secrets:
      secret0:
        description: '🙊'
      secret1:
        description: 'with required'
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "$INPUT0"
          echo "$INPUT1"
          echo ${{ inputs.input2 }}
          echo ${{ inputs.input3 }}
          test -n "$SECRET0"
          test -n "$SECRET1"
        env:
          INPUT0: ${{ inputs.input0 }}
          INPUT1: ${{ inputs.input1 }}
          SECRET0: ${{ secrets.secret0 }}
          SECRET1: ${{ secrets.secret1 }}
