name: Test for workflow_dispatch input types
on:
  workflow_dispatch:
    inputs:
      name:
        type: choice
        description: Name of event
        options:
          - workflow_dispatch
          - workflow_call
          - webhook
      type:
        type: choice
        description: Type of input
        options:
          - choice
          - string
          - boolean
          - environment
        default: string
      submitter:
        type: string
      message:
        type: string
        default: hello
      verbose:
        type: boolean
        default: false
      dry-run:
        type: boolean
        default: true
      notification:
        type: boolean
      environment:
        type: environment
      number:
        type: number
        default: 123
      pi:
        type: number
        default: 3.1415

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.name }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.type }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.submitter }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.message }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.verbose }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.dry-run }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.notification }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.environment }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.number }}
      - run: echo "${{ contains('hello, world!', github.event.inputs.name) }}"
        if: ${{ github.event.inputs.verbose }}
