name: Dynamic expression indexes
on: push

jobs:
  indexes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - k: status
            name: TOKEN
            env: DEV
            first: settings
            second: channel
    env:
      TOKEN: ${{ secrets[matrix.name] }}
      V: ${{ vars[format('X_{0}', matrix.env)] }}
      CONTEXT: ${{ fromJSON('{"status":"x"}')[matrix.k] }}
      OPERATOR: ${{ vars[matrix.env == 'DEV' && 'X_DEV' || 'X_PROD'] }}
      CHAINED: ${{ fromJSON('{"settings":{"channel":{"d":"x"}}}')[matrix.first][matrix.second].d }}
    steps:
      - name: Context index in a bare condition
        if: fromJSON('{"status":"x"}')[matrix.k] == 'x'
        run: echo context
      - name: Context index in an expression condition
        if: ${{ fromJSON('{"status":"x"}')[matrix.k] == 'x' }}
        run: echo context
      - name: Function call index in a bare condition
        if: vars[format('X_{0}', matrix.env)] == 'x'
        run: echo call
      - name: Function call index in an expression condition
        if: ${{ vars[format('X_{0}', matrix.env)] == 'x' }}
        run: echo call
      - name: Operators inside an index in a bare condition
        if: vars[matrix.env == 'DEV' && 'X_DEV' || 'X_PROD'] == 'x'
        run: echo operator
      - name: Operators inside an index in an expression condition
        if: ${{ vars[matrix.env == 'DEV' && 'X_DEV' || 'X_PROD'] == 'x' }}
        run: echo operator
      - name: Chained indexes and property access in a bare condition
        if: fromJSON('{"settings":{"channel":{"d":"x"}}}')[matrix.first][matrix.second].d == 'x'
        run: echo chain
      - name: Chained indexes and property access in an expression condition
        if: ${{ fromJSON('{"settings":{"channel":{"d":"x"}}}')[matrix.first][matrix.second].d == 'x' }}
        run: echo chain
