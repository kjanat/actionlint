on:
  workflow_call:

permissions:
  contents: read

jobs:
  inherits:
    runs-on: ubuntu-latest
    steps:
      - run: echo inherits
  snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: echo snapshot
  nothing:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo nothing
