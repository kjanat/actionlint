on:
  workflow_call:
    secrets:
      declared_secret:
        required: false
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Declared by workflow_call
      - run: echo '${{ secrets.declared_secret }}'
      # Listed in actionlint.yaml
      - run: echo '${{ secrets.MY_SECRET }}'
      # ERROR: Neither declared nor listed
      - run: echo '${{ secrets.NOPE }}'
