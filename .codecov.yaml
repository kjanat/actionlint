# yaml-language-server: $schema=https://www.schemastore.org/codecov.json
# https://docs.codecov.com/docs/commit-status#disabling-a-status
---
comment: false
github_checks: { annotations: true }
coverage:
  status:
    project:
      default: { target: 0%, informational: true }
    patch:
      default: { target: 0%, informational: true }
ignore:
  - "**/*.gen.go"
