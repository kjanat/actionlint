#:schema https://mise.jdx.dev/schema/mise.json

min_version   = { soft = "2026.10.13" }
monorepo_root = true

[wrappers.actionlint]
command = "go"
args    = ["run", "./cmd/actionlint"]
env     = { GOFLAGS = "-buildvcs=true" }

[wrappers.poutine]
command = "docker"
args    = ["run", "-qt", "--rm", "--pull=always", "-eGH_TOKEN", "ghcr.io/boostsecurityio/poutine:latest"]
env     = { GH_TOKEN = "{{ exec(command='gh auth token') | default(value='') }}" }

[wrappers.modernize]
command = "go"
args    = ["run", "golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest"]

[tools]
npm                               = "12.2.0"
go                                = "1.27.3"
node                              = "26"
shellcheck                        = { prefix = "0.11" }
rshellcheck                       = "latest"
grype                             = "latest"
ruff                              = "0.17.0"
syft                              = "latest"
tinygo                            = { prefix = "0.43" }
wasm-tools                        = "latest"
yamllint                          = "latest"
zizmor                            = "latest"
"github:charmbracelet/markscribe" = { prefix = "0.8" }
"github:jgm/pandoc"               = { prefix = "3" }
"github:kjanat/runner"            = { prefix = "0.28" }
"github:microsoft/TypeScript"     = { prefix = "7" }
"github:tombi-toml/tombi"         = { prefix = "1.9" }
"github:biomejs/biome"            = { prefix = "2", version_prefix = "@biomejs/biome@" }

[tools."golangci-lint"]
prefix  = "2"
depends = ["go"]

[tools."github:kjanat/actionlint"]
version = "latest"
depends = ["rshellcheck"]

[tools."github:rhysd/actionlint"]
version = "latest"
depends = ["rshellcheck"]

[tools."github:kjanat/dprint"]
version = "0.60.6-kjanat"

[tool_alias]
tombi       = "github:tombi-toml/tombi"
shellcheck  = "github:koalaman/shellcheck"
rshellcheck = "github:kjanat/shellcheck-rs"

[settings]
experimental                        = true
idiomatic_version_file_enable_tools = ["go", "node"]
minimum_release_age                 = "0s"

[env]
_.path       = ["{{config_root}}/node_modules/.bin"]
GOFLAGS      = "-buildvcs=true"
VOLTA_BYPASS = 1

[deps]
[deps.npm]
auto = false
run  = "npm i --no-fund --no-audit --ignore-scripts"

[deps.go]
auto = false
run  = "go mod tidy -diff"

[tasks]
[tasks.format]
alias       = ["f", "fmt"]
description = "Format code"
run         = "dprint fmt"

[tasks.go-modernize]
run = "modernize -fix ./..."

[monorepo]
config_roots = [
  ".github/actions/comment-cop",
  ".github/actions/setup-pandoc",
  ".github/actions/setup-runner",
  ".github/actions/setup-shellcheck",
  ".github/actions/setup-wasm-toolchain",
  ".github/ci",
  "distribution/docker",
  "internal/expression/probe",
  "tools/action",
  "tools/matcher",
  "tools/release",
  "tools/toolchain",
]
