#:schema https://mise.jdx.dev/schema/mise.json

[tools]
actionlint                = { version = "latest", minimum_release_age = "0s", depends = ["shellcheck"] }
runner-run                = "latest"
shellcheck                = "latest"
"github:tombi-toml/tombi" = "latest"

[tools."github:kjanat/dprint"]
prerelease          = true
version             = "latest"
minimum_release_age = "0s"
depends             = ["github:tombi-toml/tombi", "go"]

[tool_alias]
"actionlint"        = "github:kjanat/actionlint"
"actionlint-kjanat" = "github:kjanat/actionlint"
"actionlint-rhysd"  = "github:rhysd/actionlint"
"runner-run"        = "github:kjanat/runner"

[settings]
idiomatic_version_file_enable_tools = ["go", "node"]
minimum_release_age_excludes        = [
  "actionlint",
  "github:kjanat/actionlint",
  "github:rhysd/actionlint",
]

[env]
GOFLAGS = "-buildvcs=true"

[tasks]
[tasks.build]
alias       = "bin"
description = "Build actionlint binary"
run         = "go build -o actionlint ./cmd/actionlint"
outputs     = ["./actionlint", "./actionlint.exe"]
env         = { GOFLAGS = "-buildvcs=true" }

[tasks.format]
alias       = ["f", "fmt"]
description = "Format code"
run         = "dprint fmt"
