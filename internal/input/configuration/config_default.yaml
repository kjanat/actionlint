# yaml-language-server: $schema={{SCHEMA_URL}}
# Use an exact release such as @2.0.0 to pin the schema, or @2 to follow v2.
# Lint rules: recommended checks are enabled without a configuration file.
# Use all for all stable rules, or none to select rules individually.
---
plugins: [shellcheck, ruff]
# network:
#   metadata-mirrors:
#     services: [jsdelivr] # Use [] to disable third-party metadata mirrors.
#     allow-unknown-repositories: false
lint:
  enabled: true
  # experimental: true # Enable nursery rules.
  rules:
    preset: recommended
    # Each group accepts a level or individual rules. Named levels: {{RULE_LEVELS}}.
    # Warnings and info findings also cause exit status 1.
    # List rules and their defaults with: actionlint rules
    # Rule defaults in this build:
    # {{RULE_EXAMPLES}}
    # Use actionlint rules to find each plugin rule's category.
    # Enable nursery rules individually under their categories.
    # disable: []

# Plugins check scripts without executing them. Configure a native backend explicitly when needed.
# This example selects F, B and S rules and targets Python 3.14.
# tools:
#   ruff: {enabled: true, target-version: py314, select: [F, B, S], ignore: []}
#   shellcheck:
#     enabled: true
#     # config also accepts an rc path, auto for discovery, or false to skip rc files.
#     config: {disable: [SC2086], enable: [check-unassigned-uppercase], shell: bash,
#       extended-analysis: true, external-sources: true, source-path: ["${{ workspace }}"]}

# Set CLI reporting defaults. Command-line flags and environment variables take precedence.
# output:
#   formats: [github, pretty]
#   log-level: info
#   summary: true
#   network-stats: false
#   quiet: false

# Input selection uses repository-relative globs. Omitted includes selects all
# workflows and actions; includes: [] selects none. Git ignore rules also apply.
# files:
#   includes: ["**/*.{yml,yaml}"]
#   excludes: ["fixtures/**", "generated/**"]

# Reusable suppressions match a rule and at least one file/job/step/uses selector.
# All supplied selectors must match. Prefer a documented, narrow exception.
# ignores:
#   - rule: shellcheck
#     file: .github/workflows/legacy.yml
#     job: build
#     step: example
#     reason: Reviewed exception
#   - rule: missing-local-action
#     uses: ./generated-action
#     reason: Created by an earlier workflow step

# Apply lint/tool settings to matching files. Later matching overrides win.
# overrides:
#   - includes: [".github/workflows/release*.yml"]
#     excludes: [".github/workflows/release-preview.yml"]
#     {{RULE_OVERRIDE}}
#     tools: {ruff: {ignore: [F401]}}

# Shared local configs resolve relative to this file, in the order listed.
# Mappings merge recursively; lists/scalars replace; null resets a setting.
# extends: [../config/actionlint-base.yml]

# Map generated action locations to checked-in source directories.
# local-actions:
#   ./generated-action: ./src/action

# Repository facts are independent of rule selection. Omission inherits host
# knowledge; null makes a fact unknown. Empty collections are known empty sets.
# repository:
#   runners: [linux.2xlarge]
#   variables: {DEFAULT_RUNNER: null, PROVENANCE: "true"}
#   secrets: [DEPLOY_TOKEN]
#   default-workflow-permissions: read
#   environments:
#     production: {variables: {STAGE: "production"}, secrets: [DEPLOY_TOKEN]}
# Built-in and workflow_call secrets are added separately.

# Run `actionlint config migrate` to preview conversion of older configuration.
