    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.ref }}
    steps:
      - &Runner { uses: example/action@v1 }
      - *Runner
      - uses: &Action example/action@v1
      - uses: *Action
      - run: &Script |
          echo "$SOURCE_REF"
      - run: *Script
