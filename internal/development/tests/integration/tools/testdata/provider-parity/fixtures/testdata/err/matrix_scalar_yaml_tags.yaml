on: push

jobs:
  build:
    strategy:
      matrix:
        obj:
          - props:
              foo: bar
        upper_bool:
          - v: True
        upper_false:
          - v: FALSE
        hex_int:
          - v: 0x1F
        octal_int:
          - v: 0o17
        infinity:
          - v: .inf
        not_a_number:
          - v: .nan
        blank:
          - v:
        tilde:
          - v: ~
        upper_null:
          - v: NULL
        quoted_num:
          - "5"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.quoted_num }}
    steps:
      - run: echo "${{ matrix.obj.props[matrix.upper_bool.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.upper_false.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.hex_int.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.octal_int.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.infinity.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.not_a_number.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.blank.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.tilde.v] }}"
      - run: echo "${{ matrix.obj.props[matrix.upper_null.v] }}"
