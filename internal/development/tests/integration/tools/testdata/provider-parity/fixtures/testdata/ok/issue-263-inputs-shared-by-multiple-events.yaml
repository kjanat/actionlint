# Issue #263
on:
  workflow_dispatch:
    inputs:
      input-for-dispatch:
        type: string
      same-type-input:
        type: string
      different-type-input:
        type: boolean
  workflow_call:
    inputs:
      input-for-call:
        type: string
      same-type-input:
        type: string
      different-type-input:
        type: number

jobs:
  some-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$VALUE"
        env:
          VALUE: ${{ inputs.input-for-dispatch }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ inputs.input-for-call }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ inputs.same-type-input }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ inputs.different-type-input }}
