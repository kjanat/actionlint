on:
  workflow_call:
    inputs:
      timeout:
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'called!'
        # Valid comparison: the object converts to NaN, producing false.
        if: ${{ github.event == 'workflow_call' }}
      - run: echo 'timeout is too long'
        # Valid comparison: the boolean converts to 0 or 1.
        if: ${{ inputs.timeout > 60 }}
