on:
  workflow_dispatch:
    inputs:
      my_input:
        type: string
        required: true

jobs:
  my_job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$VALUE"
        env:
          VALUE: ${{ github.event.inputs.my_input }}
      - run: echo "$VALUE"
        env:
          VALUE: ${{ inputs.my_input }}
