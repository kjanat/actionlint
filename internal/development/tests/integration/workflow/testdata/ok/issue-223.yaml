run-name: "${{ inputs.property_name }}"

on:
  workflow_dispatch:
    inputs:
      property_name:
        description: test
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "$PROPERTY_NAME"
        env:
          PROPERTY_NAME: ${{ inputs.property_name }}
