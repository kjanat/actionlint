on:
  workflow_call:
    secrets:
      declared_secret:
        required: false
  workflow_dispatch:

jobs:
  self-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: test -n "$REPO_SECRET"
        env:
          REPO_SECRET: ${{ secrets.MY_REPO_SECRET }}
