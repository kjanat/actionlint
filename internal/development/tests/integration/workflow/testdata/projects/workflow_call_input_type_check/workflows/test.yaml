on: push

jobs:
  caller1:
    uses: ./workflows/reusable.yaml
    with:
      # Note: any value can be converted into bool
      str_input: null
      num_input: false
      bool_input: 'foo!'
  caller2:
    uses: ./workflows/reusable.yaml
    with:
      str_input: ${{ true }}
      num_input: ${{ 'foo' }}
  caller3:
    uses: ./workflows/reusable.yaml
    with:
      str_input:
      num_input:
  caller4:
    # GitHub refuses to call a workflow whose input declares no type.
    uses: ./workflows/broken.yaml
    with:
      broken_input: 42
permissions: {}
