# source: https://github.com/kjanat/vw/blob/548144a7c38bfb2995bcb995b185cce381d68e4c/.github/workflows/release.yml
# covers: JSON job outputs forwarded to reusable workflows and checkout, permission overrides
---
name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions: { contents: read, actions: read }
concurrency: { group: "release-${{ inputs.tag || github.ref_name }}", cancel-in-progress: false }
defaults: { run: { shell: "bash -euo pipefail {0}" } }
env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
jobs:
  draft:
    name: Prepare GitHub draft
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: { contents: write }
    outputs: { release: "${{ steps.draft.outputs.release }}" }
    env: { TAG: "${{ inputs.tag || github.ref_name }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install repository tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Create draft unless one exists
        id: draft
        run: bun run repo release draft prepare
  checks:
    needs: [draft]
    uses: $/.github/workflows/test.yml
    with:
      ref: ${{ fromJSON(needs.draft.outputs.release).sha }}
      compatibility-mode: full
  assets:
    name: Upload tested tarballs to draft
    needs: [draft, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    env: { RELEASE: "${{ needs.draft.outputs.release }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(env.RELEASE).sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: npm-packages, path: artifacts }
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Install repository tooling
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release assets and checksums
        run: bun run repo release draft stage
      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/vaultwarden.tgz
            artifacts/cli.tgz
            artifacts/SHA256SUMS
            artifacts/release.json
      - name: Verify release attestations
        env: { TAG: "${{ fromJSON(env.RELEASE).tag }}" }
        run: bun run repo release verify-attestations
      - run: bun run repo release draft attach
