[[ignores]]
file = '**/*.yml'
job = 'build'
reason = 'reviewed'
rule = 'invalid-action-reference'
step = 'run'

[lint]
[lint.rules]
[lint.rules.conventions]
[lint.rules.conventions.forbidden-suppression]
level = 'warn'

[lint.rules.conventions.forbidden-suppression.options]
report = 'all'
rules = ['invalid-action-reference']
