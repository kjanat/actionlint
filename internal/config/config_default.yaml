# yaml-language-server: $schema=https://raw.githubusercontent.com/kjanat/actionlint/HEAD/actionlint.schema.json
# Replace HEAD with either v1|vX.Y.X|etc. to get a tailored schema for your actionlint version.
# Lint rules: recommended checks are enabled without a configuration file.
# Use all for all stable rules, or none to select rules individually.
---
lint:
  enabled: true
  rules:
    preset: recommended
    # Each group accepts a level or individual rules. Levels: off, on, info,
    # warn, error, default. Warnings and info findings also cause exit status 1.
    # List rules and their defaults with: actionlint rules
    # correctness:
    #   deprecated-commands: warn
    #   runner-label:
    #     level: default
    #     options: {labels: [linux.2xlarge]}
    #   expression-reference:
    #     level: default
    #     options: {variables: null, secrets: null}
    #   workflow-call:
    #     level: default
    #     options: {default-permissions: restricted}
    # suspicious:
    #   case-insensitive-conditions: off
    # security:
    #   cache-write-untrusted: error
    # policy:
    #   require-commit-hash: error
    #   require-job-timeout:
    #     level: error
    #     options: {min-minutes: 1, max-minutes: 30}
    #   require-permissions:
    #     level: error
    #     options: {scope: job}
    #   required-actions:
    #     level: error
    #     options: {actions: [actions/checkout]}
    # external:
    # Document analyzers loaded with --plugin use their registered rule names.
    # plugins:
    #   no-sudo: warn
    # Nursery rules require explicit selection; stable presets exclude them.
    # nursery: {preset: none}
    # disable: []

# Input selection uses repository-relative globs. Omitted includes selects all
# workflows and actions; includes: [] selects none. Git ignore rules also apply.
# files:
#   includes: ["**/*.{yml,yaml}"]
#   excludes: ["fixtures/**", "generated/**"]

# Reusable suppressions match a rule and at least one file/job/step/uses selector.
# All supplied selectors must match. Prefer a documented, narrow exception.
# ignores:
#   - rule: missing-local-action
#     uses: ./generated-action
#     reason: Created by an earlier workflow step

# Apply lint/tool settings to matching files. Later matching overrides win.
# overrides:
#   - includes: [".github/workflows/release*.yml"]
#     excludes: [".github/workflows/release-preview.yml"]
#     lint: {rules: {policy: {require-commit-hash: error}}}

# Shared local configs resolve relative to this file, in the order listed.
# Mappings merge recursively; lists/scalars replace; null resets a setting.
# extends: [../config/actionlint-base.yml]

# Map generated action locations to checked-in source directories.
# local-actions:
#   ./generated-action: ./src/action

# Null variables/secrets disables name checking; [] permits no configured names.
# Built-in and workflow_call secrets are added to this list.

# Run `actionlint config migrate` to preview conversion of older configuration.
