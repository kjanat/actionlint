---
- id: actionlint
  name: Lint GitHub Actions workflow files
  description: Runs actionlint to lint GitHub Actions workflow files
  language: golang
  pass_filenames: false
  always_run: true
  entry: actionlint pre-commit
  minimum_pre_commit_version: 3.0.0
- id: actionlint-docker
  name: Lint GitHub Actions workflow files
  description: Runs actionlint Docker image to lint GitHub Actions workflow files
  language: docker_image
  pass_filenames: false
  always_run: true
  entry: ghcr.io/kjanat/actionlint:nightly pre-commit
- id: actionlint-system
  name: Lint GitHub Actions workflow files
  description: Runs system-installed actionlint to lint GitHub Actions workflow files
  language: system
  pass_filenames: false
  always_run: true
  entry: actionlint pre-commit
- id: actionlint-bundled
  name: Lint GitHub Actions workflow files (with ShellCheck and Ruff)
  description: Builds this revision's Docker image, including ShellCheck and Ruff
  language: docker
  pass_filenames: false
  always_run: true
  entry: /usr/local/bin/actionlint pre-commit
- id: actionlint-shellcheck
  name: Lint GitHub Actions workflow files (with ShellCheck)
  description: Runs actionlint with the ShellCheck integration enabled via a Go build of ShellCheck
  language: golang
  pass_filenames: false
  always_run: true
  entry: actionlint pre-commit
  minimum_pre_commit_version: 3.0.0
  additional_dependencies: [github.com/kjanat/shellcheck-rs/go/cmd/shellcheck@v0.11.0-wrapper.1]
