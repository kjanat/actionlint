[package]
name = "actionlint-extension-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Guest API and component packaging for actionlint extensions"
license = "MIT"
repository = "https://github.com/kjanat/actionlint"
readme = "README.md"
include = ["src/**", "wit/**", "build.rs", "README.md", "LICENSE.txt"]

[dependencies]
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
wasm-encoder = { version = "0.262", optional = true }
wasmparser = { version = "0.262", optional = true }

[build-dependencies]
sha2 = "0.10"

[features]
source-annotations = []
package = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:wasm-encoder", "dep:wasmparser"]
