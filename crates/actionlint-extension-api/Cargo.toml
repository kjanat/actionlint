[package]
name         = "actionlint-extension-api"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
description  = "Guest API and component packaging for actionlint extensions"
readme       = "README.md"
repository   = "https://github.com/kjanat/actionlint"
license      = "MIT"
include      = ["LICENSE.txt", "README.md", "build.rs", "schemas/**", "src/**", "wit/**"]

[dependencies]
serde        = { version = "1", features = ["derive"], optional = true }
serde_json   = { version = "1", optional = true }
sha2         = { version = "0.10", optional = true }
wasm-encoder = { version = "0.262", optional = true }
wasmparser   = { version = "0.262", optional = true }
wit-bindgen  = "0.63"

[build-dependencies]
sha2 = "0.10"

[features]
package            = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:wasm-encoder", "dep:wasmparser"]
source-annotations = []
tool-integration   = ["source-annotations"]
