[package]
name              = "actionlint-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name              = "generate-config-schema"
path              = "src/bin/generate_config_schema.rs"
required-features = ["schema"]

[dependencies]
actionlint-component-host   = { path = "../actionlint-component-host" }
actionlint-engine.workspace = true
actionlint-model.workspace  = true
json-schema-sort            = { version = "0.1", default-features = false, optional = true }
schemars                    = { version = "1", optional = true }
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"

[features]
schema = ["dep:json-schema-sort", "dep:schemars"]

[lints]
workspace = true
