[package]
name              = "actionlint-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "actionlint"
path = "src/main.rs"

[dependencies]
actionlint-app              = { path = "../actionlint-app" }
actionlint-engine.workspace = true
actionlint-lsp              = { path = "../actionlint-lsp" }
actionlint-model.workspace  = true

clap          = { version = "4", features = ["derive"] }
unicode-width = "0.2"

[lints]
workspace = true
