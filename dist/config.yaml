version: 2
project_name: actionlint
release:
  github:
    owner: kjanat
    name: actionlint
  prerelease: "false"
  name_template: '{{.Tag}}'
homebrew_casks:
  - name: actionlint
    repository:
      owner: kjanat
      name: homebrew-actionlint
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: Brew cask update for {{ .ProjectName }} version {{ .Tag }}
    directory: Casks
    description: Static checker for GitHub Actions workflow files
    homepage: https://actionlint.kjanat.dev
    binaries:
      - actionlint
    manpages:
      - man/actionlint.1
    dependencies:
      - formula: shellcheck
    generate_completions_from_executable:
      executable: actionlint
      args:
        - -completion
      shells:
        - bash
        - zsh
        - fish
        - pwsh
aurs:
  - name: actionlint-kjanat-bin
    ids:
      - nix
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: Update to {{ .Tag }}
    description: Static checker for GitHub Actions workflow files (kjanat fork, prebuilt binary)
    homepage: https://actionlint.kjanat.dev
    license: MIT
    skip_upload: auto
    maintainers:
      - Kaj Kowalski <info at kajkowalski dot nl>
    provides:
      - actionlint
      - actionlint-kjanat
    conflicts:
      - actionlint
      - actionlint-kjanat
    optdepends:
      - 'shellcheck: check shell scripts in run steps'
      - 'python-pyflakes: check Python scripts in run steps'
    rel: "1"
    package: |-
      install -Dm0755 actionlint "${pkgdir}/usr/bin/actionlint"
      install -Dm0644 LICENSE.txt "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE.txt"
      install -Dm0644 README.md "${pkgdir}/usr/share/doc/${pkgname}/README.md"
      install -Dm0644 -t "${pkgdir}/usr/share/doc/${pkgname}/" docs/*.md
      install -Dm0644 man/actionlint.1 "${pkgdir}/usr/share/man/man1/actionlint.1"
      install -dm0755 "${pkgdir}/usr/share/bash-completion/completions" \
        "${pkgdir}/usr/share/zsh/site-functions" \
        "${pkgdir}/usr/share/fish/vendor_completions.d" \
        "${pkgdir}/usr/share/actionlint"
      ./actionlint -completion bash >"${pkgdir}/usr/share/bash-completion/completions/actionlint"
      ./actionlint -completion zsh >"${pkgdir}/usr/share/zsh/site-functions/_actionlint"
      ./actionlint -completion fish >"${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish"
      ./actionlint -completion powershell >"${pkgdir}/usr/share/actionlint/actionlint.ps1"
      chmod 0644 "${pkgdir}/usr/share/bash-completion/completions/actionlint" \
        "${pkgdir}/usr/share/zsh/site-functions/_actionlint" \
        "${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish" \
        "${pkgdir}/usr/share/actionlint/actionlint.ps1"
    git_url: ssh://aur@aur.archlinux.org/actionlint-kjanat-bin.git
    private_key: '{{ .Env.AUR_KEY }}'
    goamd64: v1
aur_sources:
  - name: actionlint-kjanat
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: Update to {{ .Tag }}
    description: Static checker for GitHub Actions workflow files (kjanat fork)
    homepage: https://actionlint.kjanat.dev
    license: MIT
    skip_upload: auto
    maintainers:
      - Kaj Kowalski <info at kajkowalski dot nl>
    arches:
      - x86_64
      - aarch64
      - armv7h
    provides:
      - actionlint
    conflicts:
      - actionlint
      - actionlint-kjanat-bin
    depends:
      - glibc
    optdepends:
      - 'shellcheck: check shell scripts in run steps'
      - 'python-pyflakes: check Python scripts in run steps'
    makedepends:
      - go
      - git
    rel: "1"
    prepare: |-
      cd "actionlint-${pkgver}"
      go mod download
    build: |-
      cd "actionlint-${pkgver}"
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -o build/actionlint \
        -ldflags "-linkmode=external -X actionlint.kjanat.dev.version=${pkgver} -X actionlint.kjanat.dev.installedFrom=https://aur.archlinux.org/packages/${pkgname}" \
        ./cmd/actionlint
    package: |-
      cd "actionlint-${pkgver}"
      install -Dm0755 build/actionlint "${pkgdir}/usr/bin/actionlint"
      install -Dm0644 LICENSE.txt "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE.txt"
      install -Dm0644 README.md "${pkgdir}/usr/share/doc/${pkgname}/README.md"
      install -Dm0644 -t "${pkgdir}/usr/share/doc/${pkgname}/" docs/*.md
      install -Dm0644 man/actionlint.1 "${pkgdir}/usr/share/man/man1/actionlint.1"
      install -dm0755 "${pkgdir}/usr/share/bash-completion/completions" \
        "${pkgdir}/usr/share/zsh/site-functions" \
        "${pkgdir}/usr/share/fish/vendor_completions.d" \
        "${pkgdir}/usr/share/actionlint"
      build/actionlint -completion bash >"${pkgdir}/usr/share/bash-completion/completions/actionlint"
      build/actionlint -completion zsh >"${pkgdir}/usr/share/zsh/site-functions/_actionlint"
      build/actionlint -completion fish >"${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish"
      build/actionlint -completion powershell >"${pkgdir}/usr/share/actionlint/actionlint.ps1"
      chmod 0644 "${pkgdir}/usr/share/bash-completion/completions/actionlint" \
        "${pkgdir}/usr/share/zsh/site-functions/_actionlint" \
        "${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish" \
        "${pkgdir}/usr/share/actionlint/actionlint.ps1"
    git_url: ssh://aur@aur.archlinux.org/actionlint-kjanat.git
    private_key: '{{ .Env.AUR_KEY }}'
    goamd64: v1
scoops:
  - name: actionlint
    ids:
      - windows
    repository:
      owner: kjanat
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_TOKEN }}'
    directory: bucket
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: Scoop update for {{ .ProjectName }} version {{ .Tag }}
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    license: MIT
    goamd64: v1
builds:
  - id: macos
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - darwin_amd64_v1
      - darwin_arm64_v8.0
    dir: .
    main: ./cmd/actionlint
    binary: actionlint
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
    env:
      - CGO_ENABLED=0
  - id: linux
    goos:
      - linux
    goarch:
      - "386"
      - arm
      - amd64
      - arm64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - linux_386_sse2
      - linux_arm_6
      - linux_amd64_v1
      - linux_arm64_v8.0
    dir: .
    main: ./cmd/actionlint
    binary: actionlint
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
    env:
      - CGO_ENABLED=0
  - id: windows
    goos:
      - windows
    goarch:
      - "386"
      - amd64
      - arm64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - windows_386_sse2
      - windows_amd64_v1
      - windows_arm64_v8.0
    dir: .
    main: ./cmd/actionlint
    binary: actionlint
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
    env:
      - CGO_ENABLED=0
  - id: freebsd
    goos:
      - freebsd
    goarch:
      - "386"
      - amd64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - freebsd_386_sse2
      - freebsd_amd64_v1
    dir: .
    main: ./cmd/actionlint
    binary: actionlint
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
    env:
      - CGO_ENABLED=0
archives:
  - id: nix
    ids:
      - macos
      - linux
      - freebsd
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - tar.gz
    files:
      - src: README.md
      - src: LICENSE.txt
      - src: docs
      - src: man/actionlint.1
  - id: windows
    ids:
      - windows
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - zip
    files:
      - src: README.md
      - src: LICENSE.txt
      - src: docs
      - src: man/actionlint.1
srpm:
  package_name: actionlint
  file_name_template: '{{ .PackageName }}-{{ .Version }}.src.rpm'
  bins:
    actionlint: '%{goipath}'
snapshot:
  version_template: '{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256
docker_digest:
  name_template: digests.txt
changelog:
  format: '{{ .SHA }} {{ .Message }}'
dist: dist
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
before:
  hooks:
    - go mod download
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
  enabled: true
  prefix_template: '{{ .ProjectName }}-{{ replace .Version "-" "_" }}/'
  files:
    - src: man/actionlint.1
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    color: '#2D313E'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ print .ProjectName " " .Tag " is out! Check it out at " .ReleaseURL | mdv2escape }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
sboms:
  - id: default
    cmd: syft
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    args:
      - $artifact
      - --output
      - spdx-json=$document
      - --enrich
      - all
    documents:
      - '{{ .ArtifactName }}.sbom.json'
    artifacts: archive
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m0s
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
