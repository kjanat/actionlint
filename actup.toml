#:schema actup.schema.json

update_policy    = "latest"
ref_style        = "sha"
branch_policy    = "warn"
allow_prerelease = false
ignore           = []
extra_paths      = ["README.md", "docs/usage.md", "playground/index.ts"]

[cache]
ttl     = 86400
enabled = true

[fetch]
api_mode          = "graphql"
max_tags_per_repo = 100

[hosts]
