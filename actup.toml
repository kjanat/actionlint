#:schema actup.schema.json

update_policy = "latest"
ref_style = "preserve"
branch_policy = "warn"
allow_prerelease = false
ignore = [
  "ruby/setup-ruby@v1",
  "vedantmgoyal9/winget-releaser@main",
]
extra_paths = [
  "README.md",
  "docs/usage.md",
  "playground/index.ts",
  "testdata/bench/*.yaml",
  "testdata/examples/main.yaml",
]

[actions]

[cache]
ttl = 86400
enabled = true

[fetch]
api_mode = "graphql"
max_tags_per_repo = 100

[hosts]
