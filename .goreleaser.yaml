# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

release:
  draft: false
  prerelease: "false"

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/actionlint
      ldflags: -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: ["386", amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: ["386", amd64]

sboms:
  - artifacts: archive

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/actionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

homebrew_casks:
  - name: actionlint
    directory: Casks
    binaries: [actionlint]
    manpages: [man/actionlint.1]
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    dependencies:
      - formula: shellcheck
    repository:
      owner: kjanat
      name: homebrew-actionlint
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
scoops:
  - name: actionlint
    # One bucket for every project. Manifests stay at the repository root:
    # `scoop bucket list` reports zero manifests from a subdirectory.
    repository:
      owner: kjanat
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    ids: [windows]
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    license: MIT
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
