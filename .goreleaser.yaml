# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

release:
  draft: false
  prerelease: "false"

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/actionlint
      ldflags: -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: ["386", amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: ["386", amd64]

sboms:
  - artifacts: archive

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/actionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

# Carries the rendered manual, and its prefix spells the version the way
# pkgver does (_ for -), which the AUR source package relies on.
source:
  enabled: true
  prefix_template: '{{ .ProjectName }}-{{ replace .Version "-" "_" }}/'
  files: [man/actionlint.1]

homebrew_casks:
  - name: actionlint
    ids: [nix]
    directory: Casks
    binaries: [actionlint]
    manpages: [man/actionlint.1]
    # No shell_parameter_format: unset, Homebrew appends the shell name as a
    # plain argument, which is what -completion takes.
    generate_completions_from_executable:
      executable: actionlint
      args: [-completion]
      base_name: actionlint
      shells: [bash, zsh, fish, pwsh]
    url:
      template: "https://github.com/kjanat/actionlint/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: github.com/kjanat/actionlint/
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    skip_upload: auto
    dependencies:
      - formula: shellcheck
    # The binary is not notarized. Without this, Gatekeeper blocks it, and the
    # completion generation above runs it during install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/actionlint"]
          end
    repository:
      owner: kjanat
      name: homebrew-actionlint
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
scoops:
  - name: actionlint
    ids: [windows]
    # One bucket for every project. Scoop reads manifests from bucket/ when
    # that directory exists, leaving the root to the bucket's own config.
    directory: bucket
    goamd64: v1
    url_template: "https://github.com/kjanat/actionlint/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    license: MIT
    skip_upload: auto
    repository:
      owner: kjanat
      name: scoop-bucket
      branch: master
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
winget:
  - name: actionlint
    package_name: actionlint
    # Upstream owns rhysd.actionlint in winget-pkgs; this fork is its own package.
    package_identifier: kjanat.actionlint
    default_locale: en-US
    publisher: kjanat
    publisher_url: https://github.com/kjanat
    publisher_support_url: https://github.com/kjanat/actionlint/issues
    author: Kaj Kowalski
    homepage: https://actionlint.kjanat.dev
    short_description: Static checker for GitHub Actions workflow files
    description: |-
      actionlint is a static checker for GitHub Actions workflow files. It checks the workflow syntax, expression
      placeholders, the shell scripts in run: steps, and many other mistakes that only surface once a workflow
      runs. This is the kjanat fork.
    license: MIT
    license_url: "https://github.com/kjanat/actionlint/blob/{{ .Tag }}/LICENSE.txt"
    copyright: Copyright (c) 2026 Kaj Kowalski, Copyright (c) 2021 rhysd
    copyright_url: "https://github.com/kjanat/actionlint/blob/{{ .Tag }}/LICENSE.txt"
    release_notes: "{{ .Changelog }}"
    release_notes_url: "https://github.com/kjanat/actionlint/releases/tag/{{ .Tag }}"
    installation_notes: >-
      ShellCheck and pyflakes are optional; when installed, actionlint can use them
      to check shell and Python scripts in workflow run steps.
    tags: [actionlint, github-actions, workflow, linter, static-analysis, yaml, ci]
    ids: [windows]
    goamd64: v1
    url_template: "https://github.com/kjanat/actionlint/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "New version: {{ .PackageIdentifier }} {{ .Version }}"
    skip_upload: auto
    # winget-pkgs takes pull requests only: push a branch to a personal fork,
    # shared by every project like the scoop bucket, and open the PR from there.
    repository:
      owner: kjanat
      name: winget-pkgs
      branch: "actionlint-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"

# Both AUR packages carry the -kjanat suffix: actionlint is in Arch extra and
# actionlint-bin on the AUR tracks upstream under another maintainer.
aurs:
  - name: actionlint-kjanat-bin
    ids: [nix]
    goamd64: v1
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files (kjanat fork, prebuilt binary)
    maintainers: ["Kaj Kowalski <info at kajkowalski dot nl>"]
    license: MIT
    rel: "1"
    url_template: "https://github.com/kjanat/actionlint/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/actionlint-kjanat-bin.git
    commit_msg_template: "Update to {{ .Tag }}"
    skip_upload: auto
    provides: [actionlint, actionlint-kjanat]
    conflicts: [actionlint, actionlint-bin, actionlint-git, actionlint-kjanat]
    optdepends:
      - "shellcheck: check shell scripts in run steps"
      - "python-pyflakes: check Python scripts in run steps"
    package: |-
      install -Dm0755 actionlint "${pkgdir}/usr/bin/actionlint"
      install -Dm0644 LICENSE.txt "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE.txt"
      install -Dm0644 README.md "${pkgdir}/usr/share/doc/${pkgname}/README.md"
      install -Dm0644 -t "${pkgdir}/usr/share/doc/${pkgname}/" docs/*.md
      install -Dm0644 man/actionlint.1 "${pkgdir}/usr/share/man/man1/actionlint.1"
      install -dm0755 "${pkgdir}/usr/share/bash-completion/completions" \
        "${pkgdir}/usr/share/zsh/site-functions" \
        "${pkgdir}/usr/share/fish/vendor_completions.d" \
        "${pkgdir}/usr/share/actionlint"
      ./actionlint -completion bash >"${pkgdir}/usr/share/bash-completion/completions/actionlint"
      ./actionlint -completion zsh >"${pkgdir}/usr/share/zsh/site-functions/_actionlint"
      ./actionlint -completion fish >"${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish"
      ./actionlint -completion powershell >"${pkgdir}/usr/share/actionlint/actionlint.ps1"
      chmod 0644 "${pkgdir}/usr/share/bash-completion/completions/actionlint" \
        "${pkgdir}/usr/share/zsh/site-functions/_actionlint" \
        "${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish" \
        "${pkgdir}/usr/share/actionlint/actionlint.ps1"
    commit_author:
      name: "{{ .Env.COMMIT_USER }}"
      email: "{{ .Env.COMMIT_EMAIL }}"

aur_sources:
  - name: actionlint-kjanat
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files (kjanat fork)
    maintainers: ["Kaj Kowalski <info at kajkowalski dot nl>"]
    license: MIT
    rel: "1"
    url_template: "https://github.com/kjanat/actionlint/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/actionlint-kjanat.git
    commit_msg_template: "Update to {{ .Tag }}"
    skip_upload: auto
    arches: [x86_64, aarch64, armv7h]
    provides: [actionlint]
    conflicts: [actionlint, actionlint-bin, actionlint-git, actionlint-kjanat-bin]
    # Built with cgo and -linkmode=external per the Arch Go guidelines, so it
    # links against the system libc, unlike the static release binaries.
    depends: [glibc]
    makedepends: [go, git]
    optdepends:
      - "shellcheck: check shell scripts in run steps"
      - "python-pyflakes: check Python scripts in run steps"
    prepare: |-
      cd "actionlint-${pkgver}"
      go mod download
    build: |-
      cd "actionlint-${pkgver}"
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -o build/actionlint \
        -ldflags "-linkmode=external -X actionlint.kjanat.dev.version=${pkgver} -X actionlint.kjanat.dev.installedFrom=https://aur.archlinux.org/packages/${pkgname}" \
        ./cmd/actionlint
    package: |-
      cd "actionlint-${pkgver}"
      install -Dm0755 build/actionlint "${pkgdir}/usr/bin/actionlint"
      install -Dm0644 LICENSE.txt "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE.txt"
      install -Dm0644 README.md "${pkgdir}/usr/share/doc/${pkgname}/README.md"
      install -Dm0644 -t "${pkgdir}/usr/share/doc/${pkgname}/" docs/*.md
      install -Dm0644 man/actionlint.1 "${pkgdir}/usr/share/man/man1/actionlint.1"
      install -dm0755 "${pkgdir}/usr/share/bash-completion/completions" \
        "${pkgdir}/usr/share/zsh/site-functions" \
        "${pkgdir}/usr/share/fish/vendor_completions.d" \
        "${pkgdir}/usr/share/actionlint"
      build/actionlint -completion bash >"${pkgdir}/usr/share/bash-completion/completions/actionlint"
      build/actionlint -completion zsh >"${pkgdir}/usr/share/zsh/site-functions/_actionlint"
      build/actionlint -completion fish >"${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish"
      build/actionlint -completion powershell >"${pkgdir}/usr/share/actionlint/actionlint.ps1"
      chmod 0644 "${pkgdir}/usr/share/bash-completion/completions/actionlint" \
        "${pkgdir}/usr/share/zsh/site-functions/_actionlint" \
        "${pkgdir}/usr/share/fish/vendor_completions.d/actionlint.fish" \
        "${pkgdir}/usr/share/actionlint/actionlint.ps1"
    commit_author:
      name: "{{ .Env.COMMIT_USER }}"
      email: "{{ .Env.COMMIT_EMAIL }}"
