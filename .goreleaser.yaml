# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

release:
  draft: false
  prerelease: "false"

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/actionlint
      ldflags: -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: ["386", amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: ["386", amd64]

  # GoReleaser names the binary after ProjectName unless "binary" says otherwise,
  # which would put an "actionlint" file inside the actionlint-action archive.
  - <<: &action_build_defaults
      main: ./cmd/actionlint-action
      binary: actionlint-action
      ldflags: -s -w -X main.version={{ .Version }}
      env:
        - CGO_ENABLED=0
    id: action-nix
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - <<: *action_build_defaults
    id: action-windows
    goos: [windows]
    goarch: [amd64, arm64]

sboms:
  - artifacts: archive

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/actionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

  - <<: &action_archive_defaults
      name_template: actionlint-action_{{ .Version }}_{{ .Os }}_{{ .Arch }}
      files:
        - LICENSE.txt
    id: action-nix
    ids: [action-nix]
    formats: [tar.gz]
  - <<: *action_archive_defaults
    id: action-windows
    ids: [action-windows]
    formats: [zip]

homebrew_casks:
  - name: actionlint
    directory: Casks
    binaries: [actionlint]
    manpages: [man/actionlint.1]
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    dependencies:
      - formula: shellcheck
    repository:
      owner: kjanat
      name: homebrew-actionlint
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
