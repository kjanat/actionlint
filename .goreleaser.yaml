# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2

release:
  draft: false
  prerelease: "false"

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/actionlint
      ldflags: -s -w -X {{ .ModulePath }}.version={{ .Version }} -X "{{ .ModulePath }}.installedFrom={{ trimsuffix .GitURL ".git" }}/releases/tag/{{ .Tag }}"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: ["386", amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: ["386", amd64]

sboms:
  - artifacts: archive

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/actionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

homebrew_casks:
  - name: actionlint
    directory: Casks
    binaries: [actionlint]
    manpages: [man/actionlint.1]
    generate_completions_from_executable:
      args: [-completion]
      shells: [bash, zsh, fish, pwsh]
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    dependencies:
      - formula: shellcheck
    repository:
      owner: kjanat
      name: homebrew-actionlint
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
scoops:
  - name: actionlint
    # One bucket for every project. Scoop reads manifests from bucket/ when
    # that directory exists, leaving the root to the bucket's own config.
    directory: bucket
    repository:
      owner: kjanat
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    ids: [windows]
    homepage: https://actionlint.kjanat.dev
    description: Static checker for GitHub Actions workflow files
    license: MIT
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
winget:
  - name: actionlint
    # Upstream owns rhysd.actionlint in winget-pkgs; this fork is its own package.
    package_identifier: kjanat.actionlint
    publisher: kjanat
    publisher_url: https://github.com/kjanat
    publisher_support_url: https://github.com/kjanat/actionlint/issues
    author: Kaj Kowalski
    homepage: https://actionlint.kjanat.dev
    short_description: Static checker for GitHub Actions workflow files
    description: |-
      actionlint is a static checker for GitHub Actions workflow files. It checks the workflow syntax, expression
      placeholders, the shell scripts in run: steps, and many other mistakes that only surface once a workflow
      runs. This is the kjanat fork.
    license: MIT
    license_url: https://github.com/kjanat/actionlint/blob/master/LICENSE.txt
    copyright: Copyright (c) 2026 Kaj Kowalski, Copyright (c) 2021 rhysd
    release_notes_url: "https://github.com/kjanat/actionlint/blob/{{ .Tag }}/CHANGELOG.md"
    tags: [actionlint, github-actions, workflow, linter, static-analysis, yaml, ci]
    ids: [windows]
    # winget-pkgs takes pull requests only: push a branch to a personal fork,
    # shared by every project like the scoop bucket, and open the PR from there.
    repository:
      owner: kjanat
      name: winget-pkgs
      branch: "actionlint-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: "github-actions[bot]"
      email: "41898282+github-actions[bot]@users.noreply.github.com"
