#:schema https://dprint.kjanat.dev/schemas/v0.json

extends     = "https://raw.githubusercontent.com/kjanat/kjanat/HEAD/configs/dprint.remote.json"
plugins     = ["npm:@dprint/exec@0.7.3/plugin.json@704701df449dd7e942a71144773778ac529d68c2e4657bfc236d393b898b9a67"]
incremental = true
excludes    = [
  "**/testdata/**",
  "internal/webhook/generate/sources/**",
  "man/actionlint.1.md",
  ".claude/**",
  ".worktrees/**",
  "**/targets.json",
  "schemas/ruff/0.17.0.schema.json",
  "docs/releases/**/*.md"
]

[exec]
cwd = "${configDir}"

[[exec.commands]]
command       = "tombi format - --stdin-filename {{file_path}}"
exts          = ["toml"]
cacheKeyFiles = ["tombi.toml"]

[[exec.commands]]
command = "gofmt -s"
exts    = ["go"]

[[exec.commands]]
command = "rustfmt --edition 2024"
exts    = ["rs"]

[jsonSchemaSort]
associations = ["**/schema.json", "**/*.schema.json"]

[shfmt]
useTabs          = true
binaryNextLine   = true
switchCaseIndent = true

[pwsh]
braceStyle          = "sameLine"
useTabs             = true
keywordCasing       = true
spaceAroundOperator = true
spaceAroundPipe     = true
spaceAfterSeparator = true

[dockerfile]
associations = ["Dockerfile", "Dockerfile.*"]

[markdown]
textWrap                        = "maintain"
emphasisKind                    = "asterisks"
"codeBlock.useTabs"             = false
"codeBlock.preserveIndentation" = true
"html.useTabs"                  = false

[[markdown.overrides]]
files    = ["**/AGENTS.md", "**/CLAUDE.md", "**/CHANGELOG.md", "**/CONTRIBUTING.md", "**/.rules"]
textWrap = "never"

[yaml]
printWidth = 160

[sortPackageJson]
associations = ["package.json"]

[json]
jsonTrailingCommaFiles = ["**/.vscode/*.json", "**/.zed/{settings,tasks,debug}.json", "**/tsconfig*.json"]
associations           = ["package.json"]

[typescript]
quoteStyle                              = "preferSingle"
useTabs                                 = true
"module.sortImportDeclarations"         = "maintain"
"importDeclaration.sortNamedImports"    = "maintain"
"importDeclaration.sortTypeOnlyImports" = "none"
"module.sortExportDeclarations"         = "maintain"
"exportDeclaration.sortNamedExports"    = "maintain"
"exportDeclaration.sortTypeOnlyExports" = "none"

[markup]
printWidth                 = 999
useTabs                    = true
"html.void.selfClosing"    = false
formatComments             = true
scriptIndent               = true
styleIndent                = true
doctypeKeywordCase         = "upper"
strictSvelteAttr           = false
svelteAttrShorthand        = true
svelteDirectiveShorthand   = true
ignoreCommentDirective     = "dprint-ignore"
ignoreFileCommentDirective = "dprint-ignore-file"
associations               = ["!**/*.svg"]
