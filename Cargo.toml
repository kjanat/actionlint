[workspace]
resolver = "3"
members  = ["crates/*", "plugins/*", "xtask"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
publish = false

[workspace.dependencies]
actionlint-engine          = { path = "crates/actionlint-engine" }
actionlint-model           = { path = "crates/actionlint-model" }
actionlint-plugin-sdk      = { path = "crates/actionlint-plugin-sdk" }
actionlint-rules           = { path = "crates/actionlint-rules" }
actionlint-syntax          = { path = "crates/actionlint-syntax" }
tree-sitter-github-actions = "0.1.0"

tree-sitter = "=0.27.1"
wit-bindgen = "=0.63.0"
yaml-rust2  = "=0.13.0"

[workspace.dependencies.wasmtime]
version          = "=49.0.0"
default-features = false
features         = ["component-model", "cranelift", "runtime", "std"]

[workspace.lints.clippy]
all = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
tree-sitter-github-actions = { path = "../../../tree-sitter-github-actions" }
