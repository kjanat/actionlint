[workspace]
resolver = "3"
members  = [
  "internal/plugins/execution/component/testdata/sources/*",
  "internal/plugins/execution/module/testdata/sources/*",
  "plugins/examples/buildkite-runners",
  "plugins/examples/pinned-actions",
  "plugins/examples/pipe-to-shell",
  "plugins/examples/source-annotations",
  "plugins/sdk/rust"
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
wit-bindgen = "0.63"

[profile.wasm]
inherits      = "release"
opt-level     = "s"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
