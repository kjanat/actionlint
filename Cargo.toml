[package]
name              = "actionlint-plugin-examples"
version           = "0.1.0"
edition.workspace = true
publish           = false
autoexamples      = false

[workspace]
resolver = "3"
members  = ["testdata/plugins/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
wit-bindgen = "0.63"

[[example]]
crate-type = ["cdylib"]
name       = "pipe-to-shell"
path       = "examples/plugins/pipe-to-shell.rs"
test       = false

[[example]]
crate-type = ["cdylib"]
name       = "pinned-actions"
path       = "examples/plugins/pinned-actions.rs"
test       = false

[[example]]
crate-type = ["cdylib"]
name       = "buildkite-runners"
path       = "examples/plugins/buildkite-runners.rs"
test       = false

[[example]]
crate-type = ["cdylib"]
name       = "script-engine"
path       = "examples/plugins/script-engine.rs"
test       = false

[dev-dependencies]
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
sha2                  = "0.10"
wit-bindgen.workspace = true

[features]
action-input-fixture = []

[profile.wasm]
inherits      = "release"
opt-level     = "s"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
