[package]
name              = "actionlint-plugin-examples"
version           = "0.1.0"
edition.workspace = true
publish           = false
autoexamples      = false

[workspace]
resolver = "3"
members  = ["crates/actionlint-extension-api", "testdata/plugins/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
wit-bindgen = "0.63"

[[example]]
crate-type = ["cdylib"]
name       = "pipe-to-shell"
path       = "examples/plugins/pipe-to-shell.rs"

[[example]]
crate-type = ["cdylib"]
name       = "pinned-actions"
path       = "examples/plugins/pinned-actions.rs"
test       = false

[[example]]
crate-type = ["cdylib"]
name = "source-annotations"
path = "examples/plugins/source-annotations.rs"
required-features = ["source-annotations-fixture"]
test = false

[[example]]
crate-type = ["cdylib"]
name       = "buildkite-runners"
path       = "examples/plugins/buildkite-runners.rs"
test       = false

[[example]]
crate-type = ["cdylib"]
name       = "script-engine"
path       = "examples/plugins/script-engine.rs"
test       = false

[dev-dependencies]
actionlint-extension-api = { path = "crates/actionlint-extension-api" }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
sha2                  = "0.10"
wit-bindgen.workspace = true

[features]
source-annotations-fixture = ["actionlint-extension-api/source-annotations"]
action-input-fixture = []
ruff-fixture         = []

[profile.wasm]
inherits      = "release"
opt-level     = "s"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
