<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PSIwIDAgNjQgNjQiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CiAgPHJlY3Qgcng9IjE0IiB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIGZpbGw9IiMyNDI5MmYiIC8+CiAgPHBhdGggZD0iTTE4IDE3aDI4YTUgNSAwIDAgMSA1IDV2MjBhNSA1IDAgMCAxLTUgNUgxOGE1IDUgMCAwIDEtNS01VjIyYTUgNSAwIDAgMSA1LTVaIgogICAgICAgIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSI0IiAvPgogIDxwYXRoIGQ9Ik0yNCAyNWw5IDctOSA3VjI1Wm0xMyAwaDR2MTRoLTRWMjVaIiBmaWxsPSIjZmZmIiAvPgo8L3N2Zz4K"
		>
		<link rel="stylesheet" href="./style.css">
		<title>GitHub Actions Changelog</title>
	</head>
	<body>
		<main class="app">
			<div class="topbar">
				<div class="brand">
					<h1>GitHub Actions Changelog</h1>
					<p>
						Live reader for
						<code>github.blog/changelog/label/actions/feed/</code>
					</p>
				</div>

				<div class="controls">
					<button id="refreshBtn" type="button" class="primary">Refresh</button>
					<button id="rawBtn" type="button" class="ghost" disabled>
						Raw XML
					</button>
				</div>
			</div>

			<div id="errorBox" class="error-box" role="alert" hidden></div>

			<section id="feedMeta" class="feed-meta" aria-live="polite">
				<div>
					<div id="feedTitle" class="feed-title"></div>
					<div id="feedDescription" class="feed-description"></div>
				</div>
				<div id="feedStats" class="feed-stats"></div>
			</section>

			<div class="layout">
				<aside class="sidebar">
					<div class="filters">
						<input
							id="search"
							type="search"
							placeholder="Search title, author, content…"
							disabled
						>
						<select id="typeFilter" disabled>
							<option value="">All types</option>
						</select>
					</div>
					<div id="items" class="items">
						<div class="empty">No feed loaded yet.</div>
					</div>
				</aside>

				<section id="viewer" class="viewer">
					<div id="article" class="empty">
						Loading the latest GitHub Actions entries…
					</div>
					<div id="raw" class="raw"></div>
				</section>
			</div>
		</main>

		<script type="importmap">
			{
			  "imports": {
			    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.11.0?external=*",
			    "@codemirror/state": "https://esm.sh/@codemirror/state@6.7.1?external=*",
			    "@codemirror/view": "https://esm.sh/@codemirror/view@6.43.9?external=*",
			    "@codemirror/language": "https://esm.sh/@codemirror/language@6.12.4?external=*",
			    "@codemirror/search": "https://esm.sh/@codemirror/search@6.7.1?external=*",
			    "@codemirror/lang-xml": "https://esm.sh/@codemirror/lang-xml@6.1.0?external=*",
			    "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.3?external=*",
			    "@lezer/common": "https://esm.sh/@lezer/common@1.5.2?external=*",
			    "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.8?external=*",
			    "@lezer/xml": "https://esm.sh/@lezer/xml@1.0.5?external=*",
			    "style-mod": "https://esm.sh/style-mod@4.1.3?external=*",
			    "w3c-keyname": "https://esm.sh/w3c-keyname@2.2.8?external=*",
			    "crelt": "https://esm.sh/crelt@1.0.7?external=*",
			    "@marijn/find-cluster-break": "https://esm.sh/@marijn/find-cluster-break@1.0.4?external=*",
			    "xml-formatter": "https://esm.sh/xml-formatter@3.6.7?external=*",
			    "xml-parser-xo": "https://esm.sh/xml-parser-xo@4.1.5?external=*"
			  }
			}
		</script>
		<script type="module">
			await import('@kjlint/changelog-rss');
		</script>
	</body>
</html>
